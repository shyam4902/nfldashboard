<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 Paint Chips · Matchup Board NFL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0d;--label:#18181a;--line:#262629;--text:#efeeea;--muted:#a3a19b;--faint:#8d8b86;
  --d:'Bricolage Grotesque',system-ui,sans-serif;--m:'Azeret Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--d);font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased}
::selection{background:#FFB612;color:#0c0c0d}
html{scrollbar-color:#34343a var(--bg)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.m{font-family:var(--m);font-variant-numeric:tabular-nums;font-size:11.5px;letter-spacing:.01em}
.wrap{max-width:1360px;margin:0 auto;padding:0 32px}

header{display:flex;align-items:center;gap:28px;padding:18px 0 16px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em;font-variation-settings:"wdth" 80;display:flex;align-items:center;gap:10px}
.logo i{display:flex;height:20px}
.logo i b{width:7px;height:20px}
.lg{display:flex;gap:4px}
.lg a{font:500 12px var(--m);padding:5px 9px;border:1px solid var(--line);color:var(--muted)}
.lg a[aria-current]{background:var(--text);color:var(--bg);border-color:var(--text)}
nav.tabs{display:flex;gap:22px;margin-left:auto}
nav.tabs a{color:var(--muted);font-weight:500;padding:4px 0;border-bottom:2px solid transparent}
nav.tabs a[aria-current]{color:var(--text);border-color:var(--text)}
nav.tabs a:hover{color:var(--text)}

.intro{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding:36px 0 22px}
h1{font-size:56px;line-height:.95;font-weight:800;letter-spacing:-.035em;font-variation-settings:"wdth" 78}
h1 span{color:var(--muted);font-weight:500}
.intro p{color:var(--muted);max-width:42ch;text-align:right}

.slate{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.pair{display:flex;flex-direction:column;background:var(--label);cursor:default}
.pair .fields{display:grid;grid-template-columns:1fr 1fr;height:124px}
.f{position:relative;padding:10px;display:flex;flex-direction:column;justify-content:space-between}
.f .ab{font-weight:800;font-size:30px;line-height:1;letter-spacing:-.03em;font-variation-settings:"wdth" 75}
.f .sc{font-family:var(--m);font-size:22px;font-weight:600;align-self:flex-end}
.f.dim::after{content:"";position:absolute;inset:0;background:rgba(12,12,13,.6)}
.f.dim>*{position:relative;z-index:1;color:#d9d8d4}
.lab{padding:9px 10px 10px;display:grid;gap:3px}
.lab .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab .k{display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:10px;color:var(--muted)}
.lab .k span{white-space:nowrap}
.pair.feat{grid-column:span 2;grid-row:span 2}
.pair.feat .fields{height:auto;flex:1;min-height:260px}
.pair.feat .ab{font-size:72px}
.pair.feat .nk{font-size:20px;font-weight:600;margin-top:4px}
.pair.feat .lab .t{font-size:18px}
.f .nk{display:none}
.pair.feat .f .nk{display:block}

h2{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variation-settings:"wdth" 80;line-height:1}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin:64px 0 18px}
.sh p{color:var(--muted)}

.divs{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 22px}
.div h3{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{display:flex;flex-direction:column;background:var(--label)}
.tube{height:150px;position:relative}
.tube b{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font:600 13px var(--m)}
.tube b.lo span{position:absolute;bottom:100%;padding-bottom:5px;color:var(--text)}
.chip .lab{padding:7px 7px 8px;gap:1px}
.chip .lab .t{font-size:15px;font-weight:800;font-variation-settings:"wdth" 80}

.lower{display:grid;grid-template-columns:repeat(3,1fr) 1.1fr;gap:22px}
.list{background:var(--label)}
.list h3{font-size:15px;font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.list h3 span{font:400 11px var(--m);color:var(--faint)}
.li{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;padding:8px 14px 8px 0}
.li+.li{border-top:1px solid var(--line)}
.li i{height:100%;min-height:32px}
.li .n{font-weight:600;line-height:1.2}
.li .n small{display:block;font:400 11px var(--m);color:var(--muted)}
.li .v{font:600 15px var(--m)}
.pw{display:grid;grid-template-columns:22px 1fr 40px;gap:10px;align-items:center;padding:5px 14px}
.pw .bar{height:18px;display:flex;align-items:center;padding-left:6px;font:600 11px var(--m)}
footer{color:var(--faint);padding:40px 0 48px;border-top:1px solid var(--line);margin-top:64px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

@media (max-width:1180px){.slate{grid-template-columns:repeat(4,1fr)}.divs{grid-template-columns:repeat(2,1fr)}.lower{grid-template-columns:1fr 1fr}}
@media (max-width:720px){
  .wrap{padding:0 14px}
  header{flex-wrap:wrap;gap:12px}
  nav.tabs{order:3;width:100%;margin-left:0;overflow-x:auto;gap:18px}
  .intro{grid-template-columns:1fr;padding:24px 0 16px}
  .intro p{text-align:left}
  h1{font-size:42px}
  .slate{grid-template-columns:repeat(2,1fr);gap:10px}
  .pair .fields{height:96px}
  .f .ab{font-size:24px}
  .pair.feat{grid-column:span 2;grid-row:auto}
  .pair.feat .fields{min-height:180px}
  .pair.feat .ab{font-size:52px}
  .divs{grid-template-columns:1fr}
  .tube{height:120px}
  .lower{grid-template-columns:1fr}
  .sh{flex-direction:column;gap:6px;margin-top:48px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#"><i id="logo"></i>Matchup Board</a>
    <nav class="lg" aria-label="League"><a href="../nfl/" aria-current="page">NFL</a><a href="../nba/">NBA</a></nav>
    <nav class="tabs" aria-label="Sections"><a href="#" aria-current="page">Home</a><a href="#">Schedule</a><a href="#">Teams</a><a href="#">League</a><a href="#">Projections</a></nav>
  </header>

  <section class="intro"><h1 id="h1"></h1><p id="sub"></p></section>
  <section class="slate" id="slate" aria-label="This week's games"></section>

  <div class="sh"><h2>Standings</h2><p id="stSub"></p></div>
  <section class="divs" id="divs"></section>

  <div class="sh"><h2>Leaders and power</h2><p id="ldSub"></p></div>
  <section class="lower" id="lower"></section>

  <footer><span id="src"></span><span id="sync"></span></footer>
</div>
<script src="data.js"></script>
<script src="kit.js"></script>
<script>
const { MB, T, rec, on, ink, kick, thisWeek, slot, power, winner, synced, featured, esc } = KIT;
document.getElementById('logo').innerHTML = ['CIN','PIT','SEA','LAC','MIN'].map(a => `<b style="background:${T(a).color}"></b>`).join('');
document.getElementById('h1').innerHTML = `Week ${MB.week} <span>· ${MB.season}</span>`;
document.getElementById('sub').textContent = `${thisWeek.filter(g => g.final).length} final, ${thisWeek.filter(g => !g.final).length} to play. On bye: ${KIT.byes.map(a => T(a).nick).join(', ')}.`;

const field = (a, s, dim) => { const t = T(a); return `<div class="f${dim ? ' dim' : ''}" style="background:${t.color};color:${on(t.color)}"><div><div class="ab">${a}</div><div class="nk">${t.nick}</div></div><div class="sc">${s ?? ''}</div></div>`; };
const order = [featured, ...thisWeek.filter(g => g !== featured)];
document.getElementById('slate').innerHTML = order.map(g => {
  const k = kick(g.kickoff); const w = winner(g); const A = T(g.away), H = T(g.home);
  return `<article class="pair${g === featured ? ' feat' : ''}">
    <div class="fields">${field(g.away, g.as, w && w !== g.away)}${field(g.home, g.hs, w && w !== g.home)}</div>
    <div class="lab"><span class="t">${g === featured ? `${A.name} at ${H.name}` : `${A.nick} at ${H.nick}`}</span>
    <span class="k m"><span>${g.final ? 'FINAL' : `${k.day.toUpperCase()} ${k.time}`}${g === featured ? ' · ' + slot(g) + ' · ' + esc(g.venue) : ''}</span><span>${rec(g.away)} / ${rec(g.home)}</span></span>
    ${g === featured ? `<span class="k m"><span>${A.color} / ${H.color}</span><span>Clay ${MB.clayWins[A.abbr].toFixed(1)} / ${MB.clayWins[H.abbr].toFixed(1)}</span></span>` : ''}</div></article>`;
}).join('');

document.getElementById('stSub').textContent = `Each chip fills to its win percentage · actual results through Week ${MB.standingsThrough}`;
document.getElementById('divs').innerHTML = MB.divisions.map(d => `<div class="div"><h3><span>${d.div}</span><span class="m">W-L</span></h3><div class="chips">` +
  d.teams.map(a => { const t = T(a); const p = t.pct ?? 0;
    return `<div class="chip" title="${t.name} ${rec(a)}"><div class="tube"><b class="${p < .3 ? 'lo' : ''}" style="height:${Math.max(p * 100, 4)}%;background:${t.color};color:${on(t.color)}"><span>${rec(a)}</span></b></div><div class="lab"><span class="t">${a}</span><span class="m" style="color:var(--faint)">${t.color.slice(1)}</span></div></div>`; }).join('') + '</div></div>').join('');

const L = [['Passing yards','passing','pass_yd', r => `${r.pass_td} TD · ${r.pass_int} INT`],['Rushing yards','rushing','rush_yd', r => `${r.rush_td} TD · ${r.rush_avg} YPC`],['Receiving yards','receiving','rec_yd', r => `${r.rec} REC · ${r.rec_td} TD`]];
document.getElementById('ldSub').textContent = `Season to date, weeks ${MB.statsWeeks[0]}–${MB.statsWeeks.at(-1)} · Power is Mike Clay's preseason projected wins`;
document.getElementById('lower').innerHTML = L.map(([title, k, key, sub]) => `<div class="list"><h3>${title}<span>TOP 6</span></h3>` +
  MB.leaders[k].slice(0, 6).map(r => `<div class="li"><i style="background:${T(r.team).color}"></i><span class="n">${esc(r.name)}<small>${r.team} · ${sub(r)}</small></span><span class="v">${r[key].toLocaleString()}</span></div>`).join('') + '</div>').join('') +
  `<div class="list"><h3>Power index<span>CLAY ${MB.clayUpdated}</span></h3><div style="padding:6px 0 8px">` +
  power.slice(0, 12).map((p, i) => { const t = T(p.abbr); return `<div class="pw"><span class="m" style="color:var(--faint)">${String(i + 1).padStart(2, '0')}</span><span class="bar" style="width:${(p.wins / power[0].wins * 100).toFixed(1)}%;background:${t.color};color:${on(t.color)}">${p.abbr}</span><span class="m" style="text-align:right">${p.wins.toFixed(1)}</span></div>`; }).join('') + '</div></div>';

document.getElementById('src').textContent = 'Scores: schedule.json via ESPN sync · Standings: actual results · Stats: Sleeper';
document.getElementById('sync').textContent = 'Last score sync ' + synced;
</script>
</body>
</html>
