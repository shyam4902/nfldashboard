<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07 Broadcast · Matchup Board NFL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0e;--s1:#131417;--s2:#1a1c20;--line:#24262b;--text:#f0f1f2;--muted:#a3a7ae;--faint:#8a8d95;
  --c:'Saira Condensed',system-ui,sans-serif;--f:'Saira',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:#f0f1f2;color:#0b0c0e}
html{scrollbar-color:#2c2f35 var(--bg)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.c{font-family:var(--c);text-transform:uppercase;letter-spacing:.02em}
.wrap{max-width:1380px;margin:0 auto;padding:0 28px}

header{display:flex;align-items:center;gap:24px;height:60px;border-bottom:1px solid var(--line)}
.logo{font:800 24px var(--c);text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.logo i{display:flex;flex-direction:column;gap:2px}
.logo i b{display:block;width:16px;height:4px}
.lg{display:flex}
.lg a{font:700 15px var(--c);text-transform:uppercase;letter-spacing:.06em;padding:4px 12px;color:var(--muted);background:var(--s1)}
.lg a[aria-current]{background:var(--text);color:var(--bg)}
nav.tabs{display:flex;gap:20px;margin-left:auto}
nav.tabs a{font:600 16px var(--c);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 0}
nav.tabs a[aria-current]{color:var(--text);box-shadow:inset 0 -3px 0 var(--text)}

.top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;margin-top:28px;align-items:start}
.lt .bar1{display:flex;justify-content:space-between;align-items:center;background:var(--text);color:var(--bg);padding:6px 14px;font:800 17px var(--c);text-transform:uppercase;letter-spacing:.06em}
.lt .bar2{display:grid;grid-template-columns:1fr 1fr}
.lt .side{padding:16px 18px 14px;display:grid;grid-template-columns:auto 1fr;align-items:end;gap:4px 14px}
.lt .side.r{grid-template-columns:1fr auto;text-align:right}
.lt .ab{font:800 92px/0.8 var(--c);letter-spacing:-.01em}
.lt .nm{font:700 22px/1 var(--c);text-transform:uppercase;letter-spacing:.03em}
.lt .rc{font:600 14px var(--f);opacity:.92}
.tape{background:var(--s1);padding:6px 0 10px}
.tp{display:grid;grid-template-columns:72px 1fr 150px 1fr 72px;align-items:center;gap:10px;padding:7px 14px}
.tp+.tp{border-top:1px solid var(--line)}
.tp .lab{font:700 15px var(--c);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.tp .v{font:800 26px var(--c)}
.tp .v.r{text-align:right}
.tp .bl{display:flex;justify-content:flex-end}
.tp .bl i,.tp .br i{display:block;height:12px}
.tp .lead{color:#fff}
.tp .trail{color:var(--faint)}
.note{color:var(--faint);font-size:12px;padding:8px 14px 0}

.bugs h2,.sh h2{font:800 30px/1 var(--c);text-transform:uppercase;letter-spacing:.02em}
.bugs h2{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.bugs h2 span,.sh p{font:500 13px var(--f);text-transform:none;letter-spacing:0;color:var(--muted)}
.bug{display:grid;grid-template-columns:1fr 40px 1fr 40px 88px;height:38px;margin-bottom:5px;align-items:stretch}
.bug .t{display:flex;align-items:center;justify-content:space-between;padding:0 10px;font:800 20px var(--c);letter-spacing:.03em}
.bug .t small{font:600 12px var(--f);opacity:.9;letter-spacing:0}
.bug .s{display:grid;place-items:center;background:var(--text);color:var(--bg);font:800 22px var(--c)}
.bug .s.e{background:var(--s2);color:var(--faint)}
.bug .s.lo{background:#3a3c42;color:#c4c6cb}
.bug .st{display:grid;place-items:center;background:var(--s2);font:700 14px var(--c);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.05;text-align:center}
.bug .st.fin{background:var(--text);color:var(--bg)}
.bug .t.lo{filter:saturate(.3) brightness(.6)}

.sh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:60px 0 14px}
.divs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.dv .dh{display:flex;justify-content:space-between;padding:6px 10px;font:800 17px var(--c);text-transform:uppercase;letter-spacing:.05em}
.dv .dh span{font-weight:600;opacity:.85}
.dr{display:grid;grid-template-columns:8px 46px 1fr 32px 32px 46px;gap:8px;align-items:center;height:34px;padding-right:10px;background:var(--s1);border-bottom:1px solid var(--line)}
.dr:last-child{border-bottom:0}
.dr i{height:100%}
.dr b{font:800 18px var(--c)}
.dr .n{font:600 15px var(--c);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .k{text-align:right;font:700 17px var(--c)}
.dr .p{text-align:right;color:var(--faint);font-size:12.5px}
.colh{display:grid;grid-template-columns:8px 46px 1fr 32px 32px 46px;gap:8px;padding:4px 10px 4px 0;font:700 12px var(--c);letter-spacing:.08em;color:var(--faint);background:var(--s1);border-bottom:1px solid var(--line)}
.colh span{text-align:right}

.leaders{display:grid;grid-template-columns:repeat(3,1fr) 1fr;gap:14px}
.lb{background:var(--s1)}
.lb .hd{padding:8px 12px;background:var(--s2);font:800 17px var(--c);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.lb .hd span{color:var(--faint);font-weight:600}
.lr{display:grid;grid-template-columns:52px 1fr auto;align-items:stretch;border-top:1px solid var(--line);min-height:44px}
.lr .tm{display:grid;place-items:center;font:800 17px var(--c);letter-spacing:.03em}
.lr .nm{padding:5px 12px;display:flex;flex-direction:column;justify-content:center;line-height:1.2}
.lr .nm b{font:700 17px var(--c);text-transform:uppercase;letter-spacing:.02em}
.lr .nm small{color:var(--faint);font-size:12px}
.lr .v{padding:0 12px;display:flex;align-items:center;font:800 24px var(--c)}
footer{margin-top:64px;border-top:1px solid var(--line);padding:18px 0 44px;color:var(--faint);font-size:12.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:1180px){.top{grid-template-columns:1fr}.divs{grid-template-columns:repeat(2,1fr)}.leaders{grid-template-columns:1fr 1fr}}
@media (max-width:720px){
  .wrap{padding:0 12px}
  header{height:auto;flex-wrap:wrap;gap:10px;padding:12px 0}
  nav.tabs{order:3;width:100%;margin:0;overflow-x:auto;gap:16px}
  .lt .bar1{font-size:14px;flex-wrap:wrap;gap:4px 10px}
  .lt .side{grid-template-columns:1fr;padding:12px}
  .lt .side.r{grid-template-columns:1fr}
  .lt .ab{font-size:64px}
  .lt .nm{font-size:17px}
  .tp{grid-template-columns:52px 1fr 92px 1fr 52px;gap:6px;padding:7px 10px}
  .tp .v{font-size:20px}
  .tp .lab{font-size:12.5px}
  .bug{grid-template-columns:1fr 34px 1fr 34px 64px;height:36px}
  .bug .t{font-size:18px;padding:0 8px}
  .bug .t small{display:none}
  .bug .st{font-size:12px}
  .sh{flex-direction:column;gap:6px;margin-top:44px}
  .divs,.leaders{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#"><i id="logo"></i>Matchup Board</a>
    <nav class="lg" aria-label="League"><a href="../nfl/" aria-current="page">NFL</a><a href="../nba/">NBA</a></nav>
    <nav class="tabs" aria-label="Sections"><a href="#" aria-current="page">Home</a><a href="#">Schedule</a><a href="#">Teams</a><a href="#">League</a><a href="#">Projections</a></nav>
  </header>

  <div class="top">
    <section class="lt" aria-label="Featured matchup" id="lt"></section>
    <section class="bugs"><h2><span class="c" style="font:800 30px/1 var(--c);color:var(--text);letter-spacing:.02em;text-transform:uppercase" id="wk"></span><span id="wkSub"></span></h2><div id="bugs"></div></section>
  </div>

  <div class="sh"><h2>Standings</h2><p id="stSub"></p></div>
  <section class="divs" id="divs"></section>

  <div class="sh"><h2>Stat leaders</h2><p id="ldSub"></p></div>
  <section class="leaders" id="leaders"></section>

  <footer><span>Scores from schedule.json (ESPN sync) · standings are actual results · stats from Sleeper · Clay projections are a separate preseason model</span><span id="sync"></span></footer>
</div>
<script src="data.js"></script>
<script src="kit.js"></script>
<script>
const { MB, T, rec, on, ink, kick, thisWeek, slot, power, winner, synced, featured, esc } = KIT;
document.getElementById('logo').innerHTML = ['KC','BUF','SEA'].map(a => `<b style="background:${T(a).color}"></b>`).join('');
const F = featured, A = T(F.away), H = T(F.home), fk = kick(F.kickoff);
const slotName = { SNF: 'Sunday Night', MNF: 'Monday Night', TNF: 'Thursday Night' }[slot(F)] || 'Featured';
const tape = [['Record', A.pct, H.pct, rec(A.abbr), rec(H.abbr), true], ['Points for', A.pf, H.pf, A.pf, H.pf, true], ['Points vs', A.pa, H.pa, A.pa, H.pa, false], ['Point diff', A.diff, H.diff, (A.diff > 0 ? '+' : '') + A.diff, (H.diff > 0 ? '+' : '') + H.diff, true], ['Clay wins', MB.clayWins[A.abbr], MB.clayWins[H.abbr], MB.clayWins[A.abbr].toFixed(1), MB.clayWins[H.abbr].toFixed(1), true]];
const barW = (x, y, hi) => { const lo = Math.min(x, y, 0); const a = x - lo + 1, b = y - lo + 1; const m = Math.max(a, b); return [a / m * 100, b / m * 100]; };
document.getElementById('lt').innerHTML = `<div class="bar1"><span>${slotName} · ${esc(F.venue)}</span><span>${fk.day} ${fk.date} · ${fk.time} ET</span></div>
  <div class="bar2"><div class="side" style="background:${A.color};color:${on(A.color)}"><span class="ab">${A.abbr}</span><span><span class="nm">${A.nick}</span><br><span class="rc">${rec(A.abbr)} · ${A.div}</span></span></div>
  <div class="side r" style="background:${H.color};color:${on(H.color)}"><span><span class="nm">${H.nick}</span><br><span class="rc">${rec(H.abbr)} · ${H.div}</span></span><span class="ab">${H.abbr}</span></div></div>
  <div class="tape">${tape.map(([lab, x, y, dx, dy, hi]) => { const [wa, wh] = barW(hi ? x : -x, hi ? y : -y); const aL = hi ? x > y : x < y, hL = hi ? y > x : y < x;
    return `<div class="tp"><span class="v ${aL ? 'lead' : 'trail'}">${dx}</span><span class="bl"><i style="width:${wa}%;background:${A.color}"></i></span><span class="lab">${lab}</span><span class="br"><i style="width:${wh}%;background:${H.color}"></i></span><span class="v r ${hL ? 'lead' : 'trail'}">${dy}</span></div>`; }).join('')}
  <p class="note">Tale of the tape: actual results through Week ${MB.standingsThrough}. Clay wins is Mike Clay's preseason projection (${MB.clayUpdated}).</p></div>`;

document.getElementById('wk').textContent = `Week ${MB.week}`;
document.getElementById('wkSub').textContent = `${thisWeek.length} games · ET`;
document.getElementById('bugs').innerHTML = thisWeek.filter(g => g !== F).map(g => { const k = kick(g.kickoff), w = winner(g); const a = T(g.away), h = T(g.home);
  const team = (t, lo) => `<span class="t${lo ? ' lo' : ''}" style="background:${t.color};color:${on(t.color)}">${t.abbr}<small>${rec(t.abbr)}</small></span>`;
  const sc = (s, lo) => `<span class="s${s == null ? ' e' : ''}${lo ? ' lo' : ''}">${s ?? ''}</span>`;
  return `<div class="bug" title="${a.name} at ${h.name} · ${esc(g.venue)}">${team(a, w && w !== a.abbr)}${sc(g.as, w && w !== a.abbr)}${team(h, w && w !== h.abbr)}${sc(g.hs, w && w !== h.abbr)}<span class="st${g.final ? ' fin' : ''}">${g.final ? 'Final' : `${k.day} ${k.time}`}</span></div>`; }).join('');

document.getElementById('stSub').textContent = `Each division wears its leader's colour · actual results through Week ${MB.standingsThrough}`;
document.getElementById('divs').innerHTML = MB.divisions.map(d => { const L = T(d.teams[0]);
  return `<div class="dv"><div class="dh" style="background:${L.color};color:${on(L.color)}">${d.div}<span>${L.abbr} leads</span></div><div class="colh"><span></span><span style="text-align:left">Tm</span><span></span><span>W</span><span>L</span><span>Pct</span></div>` +
  d.teams.map(a => { const t = T(a); return `<div class="dr"><i style="background:${t.color}"></i><b>${a}</b><span class="n">${t.nick}</span><span class="k">${t.w}</span><span class="k">${t.l}${t.t ? `<small style="font-size:11px;color:var(--faint)"> ${t.t}T</small>` : ''}</span><span class="p">${t.pct == null ? '—' : t.pct.toFixed(3).replace(/^0/, '')}</span></div>`; }).join('') + '</div>'; }).join('');

const LB = [['Passing','passing','pass_yd', r => `${r.pass_td} TD · ${r.pass_int} INT`],['Rushing','rushing','rush_yd', r => `${r.rush_td} TD · ${r.rush_avg} avg`],['Receiving','receiving','rec_yd', r => `${r.rec} rec · ${r.rec_td} TD`]];
document.getElementById('ldSub').textContent = `Yards, weeks ${MB.statsWeeks[0]}–${MB.statsWeeks.at(-1)} (Sleeper) · power index is Clay's projected wins`;
const tm = a => { const t = T(a); return `<span class="tm" style="background:${t.color};color:${on(t.color)}">${a}</span>`; };
document.getElementById('leaders').innerHTML = LB.map(([title, k, key, sub]) => `<div class="lb"><div class="hd">${title}<span>Yds</span></div>` +
  MB.leaders[k].slice(0, 5).map(r => `<div class="lr">${tm(r.team)}<span class="nm"><b>${esc(r.name)}</b><small>${sub(r)}</small></span><span class="v">${r[key].toLocaleString()}</span></div>`).join('') + '</div>').join('') +
  `<div class="lb"><div class="hd">Power index<span>Clay W</span></div>${power.slice(0, 5).map(p => `<div class="lr">${tm(p.abbr)}<span class="nm"><b>${T(p.abbr).nick}</b><small>${rec(p.abbr)} actual</small></span><span class="v">${p.wins.toFixed(1)}</span></div>`).join('')}</div>`;
document.getElementById('sync').textContent = 'Last score sync ' + synced;
</script>
</body>
</html>
