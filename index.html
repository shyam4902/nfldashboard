<script src="https://cdn.tailwindcss.com"></script>
<script>
/* ── NFL26 pregame-studio palette ──────────────────────────────────────────
   Same palette as the league pages, so the picker and the sub-pages match.
   Guarded: the CDN above can fail (offline, blocked), and an unguarded
   assignment to `tailwind` would throw and abort the rest of the page. */
window.tailwind = window.tailwind || {};
tailwind.config = {
  theme: {
    extend: {
      colors: {
        slate: {
          50: '#f4f2ef', 100: '#e9e7e3', 200: '#dbd9d4', 300: '#c9ccd1',
          400: '#8f9299', 500: '#868a91', 600: '#3d434c', 700: '#2b3037',
          800: '#16191f', 900: '#101215', 950: '#08090b',
        },
        amber: {

          400: '#d9a441', 500: '#d9a441', 600: '#c08f34', 700: '#a3782a',
          800: '#7f5d20', 900: '#5c4317', 950: '#33260d',
        },
        yellow: {
          300: '#eecb86', 400: '#d9a441', 500: '#d9a441', 600: '#c08f34',
        },
        emerald: {
          50: '#eef7f2', 100: '#d7ecdf', 200: '#b9dec9', 300: '#a3d9b8',
          400: '#7cc49b', 500: '#63b487', 600: '#4e9a70', 700: '#3e7c5a',
          800: '#316148', 900: '#254735', 950: '#12281c',
        },
        green: {
          300: '#a3d9b8', 400: '#7cc49b', 500: '#63b487', 600: '#4e9a70',

</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Archivo:wght@600;700;800;900&display=swap');

:root {
  --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --bg-body: #0b0d10;
  --bg-card: #14161a;
  --bg-card-hover: #1a1d22;
  --bg-elevated: #16191f;
  --bg-inset: #111317;
  --bg-header: rgba(11, 13, 16, 0.92);
  --border-card: #2b3037;
  --border-muted: #262a31;
  --border-strong: #474d57;
  --text-main: #e9e7e3;
  --text-muted: #8f9299;
  --text-faint: #868a91;
  --accent-brand: #d9a441;
  --accent-brand-hover: #e6b556;
  --accent-brand-subtle: rgba(217, 164, 65, 0.12);
  --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--bg-body);
  color: var(--text-main);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

.picker-header {
  border-bottom: 1px solid var(--border-card);
  background: var(--bg-header);
  backdrop-filter: blur(14px);
}
.picker-header .bar {
  max-width: 900px;
  margin: 0 auto;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  min-height: 56px;
}
.wordmark { font: 800 22px/1 'Archivo', sans-serif; letter-spacing: -0.02em; }
.wordmark .gold { color: var(--accent-brand); }
.wordmark .white { color: var(--text-main); margin-left: 5px; }

main.picker {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 16px 56px;
}
.picker h1 {
  margin: 0 0 16px;
  font: 800 15px/1.3 var(--font-sans);
  letter-spacing: 0.02em;
  color: var(--text-muted);
  text-transform: uppercase;
}
.cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
@media (min-width: 640px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.pick-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 22px 20px;
  min-height: 148px;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 14px;
  box-shadow: var(--card-shadow);
  transition: border-color 0.15s, background-color 0.15s, transform 0.15s;
}
.pick-card:hover { border-color: var(--border-strong); background: var(--bg-card-hover); transform: translateY(-2px); }
.pick-card:focus-visible { outline: 2px solid var(--accent-brand); outline-offset: 2px; }
.pick-league {
  font: 800 30px/1 'Archivo', sans-serif;
  letter-spacing: -0.02em;
  color: var(--text-main);
}
.pick-desc { font: 500 13px/1.4 var(--font-sans); color: var(--text-muted); }
.pick-live {
  margin-top: auto;
  font: 500 11px/1.4 var(--font-mono);
  color: var(--accent-brand);
}
.pick-live[hidden] { display: none; }
.foot { margin-top: 22px; font: 500 10px/1.5 var(--font-mono); color: var(--text-faint); }
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://matchupboard.com/">
<meta property="og:title" content="Matchup Board · NFL and NBA scores, matchups and stats">
<meta property="og:description" content="NFL and NBA scores, matchups and stats in one clean layout.">
<meta property="og:url" content="https://matchupboard.com/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://matchupboard.com/og-image.png">

<body>

<header class="picker-header">
  <div class="bar">
    <span class="wordmark"><span class="gold">Matchup</span><span class="white">Board</span></span>
  </div>
</header>

<main class="picker">
  <h1>Pick a league</h1>
  <div class="cards">
    <a class="pick-card" href="/nfl/">
      <span class="pick-league">NFL</span>
      <span class="pick-desc">Scores, schedules, matchups and team stats.</span>
      <span class="pick-live" id="nflLive" hidden></span>
    </a>
    <a class="pick-card" href="/nba/">
      <span class="pick-league">NBA</span>
      <span class="pick-desc">Scores, standings, matchups and player stats.</span>
      <span class="pick-live" id="nbaLive" hidden></span>
    </a>
  </div>
  <p class="foot">Scores and stats only. No props, odds or predictions.</p>
</main>

<script>
(function () {
  'use strict';

  function etDate(date) {
    var parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit',
    }).formatToParts(date).reduce(function (acc, part) {
      acc[part.type] = part.value;
      return acc;
    }, {});
    return parts.year + parts.month + parts.day;
  }

  function setLine(id, text) {
    var el = document.getElementById(id);
    if (!el || !text) return;
    el.textContent = text;
    el.hidden = false;
  }

  function loadNFL() {
    return fetch('/schedule.json', { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('http ' + res.status);
        return res.json();
      })
      .then(function (schedule) {
        if (!schedule || schedule.week == null) return;
        var games = Array.isArray(schedule.games)
          ? schedule.games.filter(function (game) { return game && game.week === schedule.week; })
          : [];
        var finals = games.filter(function (game) { return game && game.status === 'final'; }).length;
        setLine('nflLive', games.length
          ? 'Week ' + schedule.week + ' · ' + finals + ' of ' + games.length + ' games final'
          : 'Week ' + schedule.week);
      })
      .catch(function () { /* card still shows and links */ });
  }

  function loadNBA() {
    var day = etDate(new Date());
    return fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=' + day, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('http ' + res.status);
        return res.json();
      })
      .then(function (board) {
        var games = Array.isArray(board && board.events) ? board.events.length : 0;
        setLine('nbaLive', games === 1 ? '1 game today' : games + ' games today');
      })
      .catch(function () { /* card still shows and links */ });
  }

  loadNFL();
  loadNBA();
})();
</script>
</body>
</html>
