// Text on a tile is budgeted from the tile's own size. Lines are added in
// priority order (abbreviation, record, size metric, point diff, last 10,
// streak) at a font scaled to the tile, shrunk to fit the width; the first line
// that cannot fit, and everything after it, is dropped. Nothing can overflow.
const clampNum = (value, lo, hi) => Math.max(lo, Math.min(hi, value));

function fitTile(el, row, r, spec) {
  const s = Math.min(r.w, r.h);
  const padX = clampNum(r.w * 0.07, 3, 9);
  const padY = clampNum(r.h * 0.07, 3, 9);
  el.querySelector('.mz-in').style.padding = padY + 'px ' + padX + 'px';
  const innerW = r.w - 4 - padX * 2;
  let room = r.h - 4 - padY * 2;
  const gap = s < 70 ? 1 : 3;

  const logo = el.querySelector('.mz-logo');
  if (logo) {
    const size = clampNum(s * 0.2, 20, 30);
    const show = s >= 110 && room > size + 90;
    logo.style.display = show ? '' : 'none';
    if (show) {
      logo.style.width = logo.style.height = size + 'px';
      room -= size + 5;
    }
  }

  const rec = row.wins != null && row.losses != null ? row.wins + '-' + row.losses : '';
  const diff = pointDiff(row);
  const small = clampNum(s * 0.085, 8.5, 11.5);
  const lines = [
    { l: 'ab', text: row.abbr, font: clampNum(s * 0.24, 11, 34), min: 8, k: 0.74, lh: 1 },
    { l: 'rc', text: rec, font: clampNum(s * 0.11, 9, 14), min: 7.5, k: 0.62, lh: 1.15 },
    { l: 'v', text: spec.show(row), alt: spec.show(row, true), font: clampNum(s * 0.15, 10, 24), min: 7.5, k: 0.62, lh: 1.1 },
    { l: 'dx', text: diff == null ? '' : 'DIFF ' + signedDecimal(diff), font: small, min: 7.5, k: 0.62, lh: 1.15 },
    { l: 'l10', text: row.last10 ? 'L10 ' + row.last10 : '', font: small, min: 7.5, k: 0.62, lh: 1.15 },
    { l: 'st', text: row.streak ? 'STRK ' + row.streak : '', font: small, min: 7.5, k: 0.62, lh: 1.15 },
  ];
  let used = 0;
  let open = true;
  for (const line of lines) {
    const node = el.querySelector('[data-l="' + line.l + '"]');
    let text = line.text;
    let font = line.font;
    let ok = open && Boolean(text);
    if (ok) {
      if (text.length * font * line.k > innerW && line.alt) text = line.alt;
      if (text.length * font * line.k > innerW) font = innerW / (text.length * line.k);
      const need = font * line.lh + (used ? gap : 0);
      ok = font >= line.min && used + need <= room;
      if (ok) used += need;
    }
    if (!ok) {
      node.style.display = 'none';
      if (text) open = false;
      continue;
    }
    node.textContent = text;
    node.style.fontSize = font + 'px';
    node.style.display = '';
  }
}

function wireMosaic(groups) {
  const map = document.getElementById('mzMap');
  const note = document.getElementById('mzNote');
  if (!map || !note) return;
  const byId = new Map(groups.flatMap((g) => g.divisions.flatMap((d) => d.teams)).map((row) => [row.teamId, row]));
  const tileOf = (id) => map.querySelector('[data-t="' + id + '"]');
  let metric = 'wins';

  function layout() {
    if (!map.isConnected) return;
    const W = map.clientWidth;
    if (W <= 0) return;
    const spec = MOSAIC_METRICS[metric];
    const diffs = [...byId.values()].map(pointDiff).filter((d) => d != null);
    const ctx = { minDiff: diffs.length ? Math.min(...diffs) : 0 };
    let placed = 0;
    // Teams with no value for this measure are left out of the layout.
    const valueOf = (row) => {
      const v = spec.value(row, ctx);
      return v != null && v > 0 ? v : null;
    };
    const sumTeams = (teams) => teams.reduce((acc, row) => acc + (valueOf(row) || 0), 0);
    const tiles = [...byId.keys()];
    tiles.forEach((id) => { tileOf(id).style.display = 'none'; });
    map.querySelectorAll('.mz-lab').forEach((el) => { el.style.display = 'none'; });
    const place = (el, x, y) => { el.style.display = ''; el.style.left = x + 'px'; el.style.top = y + 'px'; };

    function drawTeams(teams, x, y, w, h) {
      const items = teams.map((row) => ({ id: row.teamId, v: valueOf(row) })).filter((item) => item.v != null).sort((a, b) => b.v - a.v);
      for (const r of squarify(items, x, y, w, h)) {
        const row = byId.get(r.id);
        const el = tileOf(r.id);
        placed += 1;
        Object.assign(el.style, { display: '', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
        fitTile(el, row, r, spec);
      }
    }

    if (W > 640) {
      const H = Math.round(Math.min(720, Math.max(520, W * 0.6)));
      map.style.height = H + 'px';
      const confs = groups.map((g) => ({ id: g.conf, g, v: g.divisions.reduce((acc, d) => acc + sumTeams(d.teams), 0) })).filter((c) => c.v > 0);
      for (const c of squarify(confs, 0, 0, W, H)) {
        place(map.querySelector('[data-c="' + c.id + '"]'), c.x + 8, c.y + 5);
        const divs = c.g.divisions.map((d) => ({ id: d.name, d, v: sumTeams(d.teams) })).filter((d) => d.v > 0).sort((a, b) => b.v - a.v);
        for (const d of squarify(divs, c.x + 3, c.y + 26, c.w - 6, c.h - 29)) {
          place(map.querySelector('[data-d="' + c.id + '/' + d.id + '"]'), d.x + 7, d.y + 4);
          drawTeams(d.d.teams, d.x + 3, d.y + 22, d.w - 6, d.h - 25);
        }
      }
    } else {
      // Phone: one block per division, stacked, full width. Nothing can
      // overflow sideways because every rectangle is cut from [0, W].
      let y = 0;
      const blockH = Math.round(W * 0.78);
      for (const g of groups) {
        const live = g.divisions.filter((d) => sumTeams(d.teams) > 0);
        if (!live.length) continue;
        place(map.querySelector('[data-c="' + g.conf + '"]'), 2, y + 2);
        y += 26;
        for (const d of live) {
          place(map.querySelector('[data-d="' + g.conf + '/' + d.name + '"]'), 2, y);
          drawTeams(d.teams, 0, y + 18, W, blockH);
          y += 18 + blockH + 10;
        }
      }
      map.style.height = Math.max(0, y) + 'px';
    }
    const missing = byId.size - placed;
    note.textContent = spec.note + (missing > 0 ? ' ' + missing + ' team' + (missing === 1 ? '' : 's') + ' without this stat left out.' : '');
    document.querySelectorAll('.mz-ctrl button').forEach((button) => button.setAttribute('aria-pressed', String(button.getAttribute('data-m') === metric)));
  }

  document.querySelector('.mz-ctrl').addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    metric = button.getAttribute('data-m');
    layout();
  });
  const onResize = () => layout();
  window.addEventListener('resize', onResize);
  // stopPolling() runs on every route change and calls these closers.
  pickerClosers.push(() => window.removeEventListener('resize', onResize));
  layout();
  return layout;
}

async function showStandings(mode) {
  stopPolling();
  const token = ++requestId;
  const league = mode === 'league';
  app.innerHTML = loadingHTML();

  let standings;
  let colors;
  try {
    [standings, colors] = await Promise.all([
      fetchJSON(STANDINGS_API).then(parseStandings),
      getTeamColors(),
    ]);
  } catch (err) {
    if (token === requestId) showError(() => showStandings(mode));
    return;
  }
  if (token !== requestId) return;

  const switchHTML = '<nav class="standings-switch" aria-label="Standings scope">' +
    '<a href="#standings"' + (league ? '' : ' aria-current="page"') + '>Conference</a>' +
    '<a href="#standings/league"' + (league ? ' aria-current="page"' : '') + '>League</a></nav>';

  setTitle('NBA Standings');

  let view = readStandingsView();
  const segHTML = '<div class="st-seg" role="group" aria-label="Standings display">' +
    ['table', 'map'].map((key) => '<button type="button" data-v="' + key + '" aria-pressed="' + (view === key) + '">' + (key === 'table' ? 'Table' : 'Map') + '</button>').join('') + '</div>';

  const groups = mosaicGroups(standings);
  app.innerHTML = '<div class="st-bar">' + switchHTML + segHTML + '</div>' +
    '<div class="st-pane" id="stTable"' + (view === 'table' ? '' : ' hidden') + '>' + standingsTablesHTML(standings, league) + '</div>' +
    '<div class="st-pane" id="stMap"' + (view === 'map' ? '' : ' hidden') + '>' + mosaicHTML(groups, colors) + '</div>';
  wireStandingsSort(standings, league);
  const layout = wireMosaic(groups);

  // The map measures its own box, so it lays out only once it is visible.
  const paneOf = (key) => document.getElementById(key === 'table' ? 'stTable' : 'stMap');
  document.querySelector('.st-seg').addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    view = button.getAttribute('data-v');
    saveStandingsView(view);
    ['table', 'map'].forEach((key) => { paneOf(key).hidden = key !== view; });
    document.querySelectorAll('.st-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === view)));
    if (view === 'map' && layout) layout();
  });
}

const STANDINGS_VIEW_KEY = 'mb.nba.standings.view';

function readStandingsView() {
  try {
    const value = localStorage.getItem(STANDINGS_VIEW_KEY);
    return value === 'map' ? 'map' : 'table';
  } catch (err) {
    return 'table';
  }
}

function saveStandingsView(view) {
  try {
    localStorage.setItem(STANDINGS_VIEW_KEY, view);
  } catch (err) {
    /* private mode or blocked storage: the choice just won't persist */
  }
}

/* ── Compare ────────────────────────────────────────────────────────────── */
const WEB = 'https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba';
let standingsCache = null;
let standingsAt = 0;

async function getStandings() {
  if (!standingsCache) {
    standingsCache = parseStandings(await fetchJSON(STANDINGS_API));
    standingsAt = Date.now();
  }
  return standingsCache;
}

// Scores polls every 30s; standings only change when a game ends, so reload
// them at most once per maxAge.
async function getStandingsFresh(maxAge) {
  if (standingsCache && Date.now() - standingsAt < maxAge) return standingsCache;
  standingsCache = parseStandings(await fetchJSON(STANDINGS_API));
  standingsAt = Date.now();
  return standingsCache;
}

function allTeams(standings) {
  return [...standings.East, ...standings.West].slice().sort((a, b) => a.name.localeCompare(b.name));
}

function standingFor(standings, id) {
  const key = String(id);
  return [...standings.East, ...standings.West].find((row) => row.teamId === key) || null;
}

// One team, everything the compare table needs: standings row (record, points
// for and against), season averages and the schedule (last five, head to head).
const TEAM_TTL = 5 * 60 * 1000;
const teamCache = new Map();

// One team cache (statistics + schedule, five minutes) shared by compare,
// pre-game and the team page.
async function teamData(id) {
  const key = String(id);
  const hit = teamCache.get(key);
  if (hit && Date.now() - hit.at < TEAM_TTL) return hit.value;
  const [statsJson, scheduleJson] = await Promise.all([
    fetchJSON(API + '/teams/' + encodeURIComponent(key) + '/statistics'),
    fetchJSON(API + '/teams/' + encodeURIComponent(key) + '/schedule'),
  ]);
  const value = { stats: parseTeamStats(statsJson), schedule: parseTeamSchedule(scheduleJson) };
  teamCache.set(key, { at: Date.now(), value });
  return value;
}

async function teamBundle(id) {
  const key = String(id);
  const [standings, team] = await Promise.all([getStandings(), teamData(key)]);
  const stats = team.stats;
  const schedule = team.schedule;
  const row = standingFor(standings, key);
  const wins = row ? row.wins : null;
  const losses = row ? row.losses : null;
  return {
    id: key,
    abbr: (row && row.abbr) || schedule.team.abbr,
    name: (row && row.name) || schedule.team.name,
    logo: (row && row.logo) || schedule.team.logo,
    wins,
    losses,
    record: wins != null && losses != null ? wins + '-' + losses : (schedule.team.record || ''),
    ppg: row ? row.ppg : null,
    oppPpg: row ? row.oppPpg : null,
    stats,
    schedule,
  };
}

function oneDecimal(value) {
  if (value == null || Number.isNaN(value)) return '—';
  return (Math.round(value * 10) / 10).toFixed(1);
}

// Box-score counts are whole numbers; oneDecimal would show 46 rebounds as 46.0.
function wholeNumber(value) {
  if (value == null || Number.isNaN(Number(value))) return '—';
  return String(Math.round(Number(value)));
}

function signedDecimal(value) {
  if (value == null || Number.isNaN(value)) return '—';
  const rounded = Math.round(value * 10) / 10;
  return (rounded > 0 ? '+' : '') + rounded.toFixed(1);
}

function ratioDecimal(value) {
  if (value == null || Number.isNaN(value)) return '—';
  return (Math.round(value * 100) / 100).toFixed(2);
}

function pointDiff(row) {
  return row.ppg == null || row.oppPpg == null ? null : row.ppg - row.oppPpg;
}

// League view: one table of 30 by win percentage, then point differential.
function byLeague(a, b) {
  const pct = (b.pct ?? -1) - (a.pct ?? -1);
  if (pct !== 0) return pct;
  const diffA = pointDiff(a);
  const diffB = pointDiff(b);
  if (diffA != null && diffB != null && diffA !== diffB) return diffB - diffA;
  if (diffA != null && diffB == null) return -1;
  if (diffA == null && diffB != null) return 1;
  return a.name.localeCompare(b.name);
}

const COMPARE_ROWS = [
  {
    label: 'Record',
    value: (team) => (team.wins != null && team.losses != null && team.wins + team.losses > 0
      ? team.wins / (team.wins + team.losses)
      : null),
    text: (team) => team.record || '—',
  },
  { label: 'PPG', value: (team) => team.ppg, text: (team) => oneDecimal(team.ppg) },
  { label: 'Opp PPG', value: (team) => team.oppPpg, text: (team) => oneDecimal(team.oppPpg), lower: true },
  {
    label: 'Diff',
    value: (team) => (team.ppg == null || team.oppPpg == null ? null : team.ppg - team.oppPpg),
    text: (team) => signedDecimal(team.ppg == null || team.oppPpg == null ? null : team.ppg - team.oppPpg),
  },
  { label: 'FG%', value: (team) => team.stats.fgPct, text: (team) => oneDecimal(team.stats.fgPct) },
  { label: '3P%', value: (team) => team.stats.threePct, text: (team) => oneDecimal(team.stats.threePct) },
  { label: 'FT%', value: (team) => team.stats.ftPct, text: (team) => oneDecimal(team.stats.ftPct) },
  { label: 'REB', value: (team) => team.stats.reb, text: (team) => oneDecimal(team.stats.reb) },
  { label: 'AST', value: (team) => team.stats.ast, text: (team) => oneDecimal(team.stats.ast) },
  { label: 'TOV', value: (team) => team.stats.tov, text: (team) => oneDecimal(team.stats.tov), lower: true },
  { label: 'STL', value: (team) => team.stats.stl, text: (team) => oneDecimal(team.stats.stl) },
  { label: 'BLK', value: (team) => team.stats.blk, text: (team) => oneDecimal(team.stats.blk) },
  { label: 'AST/TO', value: (team) => team.stats.astTo, text: (team) => ratioDecimal(team.stats.astTo) },
];

function compareTableHTML(left, right, rowSet = COMPARE_ROWS, caption = 'Team comparison') {
  const rows = rowSet.map((row) => {
    const a = row.value(left);
    const b = row.value(right);
    let aBetter = false;
    let bBetter = false;
    if (a != null && b != null && a !== b) {
      const aWins = row.lower ? a < b : a > b;
      aBetter = aWins;
      bBetter = !aWins;
    }
    return '<tr><td class="cmp-val' + (aBetter ? ' better' : '') + '">' + esc(row.text(left)) + '</td>' +
      '<td class="cmp-lbl">' + esc(row.label) + '</td>' +
      '<td class="cmp-val right' + (bBetter ? ' better' : '') + '">' + esc(row.text(right)) + '</td></tr>';
  }).join('');

  return '<section class="card standings-block"><div class="table-wrap"><table class="cmp-table">' +
    '<caption class="sr-only">' + esc(caption) + '</caption><tbody>' +
    rows + '</tbody></table></div></section>';
}

function compareHeadHTML(left, right, flat) {
  const side = (team, cls) => '<a class="cmp-side' + (cls ? ' ' + cls : '') + '" href="#team/' + esc(team.id) + '">' +
    (team.logo ? '<img src="' + esc(smallImg(team.logo, 68, 68)) + '" alt="" width="34" height="34" loading="lazy" decoding="async">' : '') +
    '<span class="cmp-id"><span class="cmp-abbr">' + esc(team.abbr) + '</span>' +
    '<span class="cmp-name">' + esc(team.name) + '</span>' +
    '<span class="cmp-rec">' + esc(team.record || '—') + '</span></span></a>';
  return '<div class="cmp-head' + (flat ? ' flat' : '') + '">' + side(left, '') +
    '<span class="cmp-vs">vs</span>' + side(right, 'right') + '</div>';
}

function comparePickerHTML(teams, a, b) {
  const options = (selected) => '<option value="">Select team…</option>' + teams.map((row) =>
    '<option value="' + esc(row.teamId) + '"' + (row.teamId === selected ? ' selected' : '') + '>' +
    esc(row.name) + '</option>').join('');
  return '<div class="card cmp-pickers">' +
    '<label>Team A<select id="cmpA">' + options(a) + '</select></label>' +
    '<button class="cmp-swap" type="button" id="cmpSwap" title="Swap teams" aria-label="Swap teams">⇄</button>' +
    '<label>Team B<select id="cmpB">' + options(b) + '</select></label></div>';
}

function hashForCompare(a, b) {
  return '#compare' + (a ? '/' + a : '') + (a && b ? '/' + b : '');
}

function wireComparePicker(a, b) {
  const selectA = document.getElementById('cmpA');
  const selectB = document.getElementById('cmpB');
  const go = (nextA, nextB) => {
    const hash = hashForCompare(nextA, nextB);
    if (location.hash === hash) return;
    location.hash = hash;
  };
  selectA.addEventListener('change', () => go(selectA.value, selectB.value));
  selectB.addEventListener('change', () => go(selectA.value, selectB.value));
  document.getElementById('cmpSwap').addEventListener('click', () => go(b, a));
}

function recentGames(games, count) {
  return games.filter((game) => game.result !== null)
    .slice()
    .sort((x, y) => new Date(y.startISO) - new Date(x.startISO))
    .slice(0, count);
}

async function showCompare(idA, idB) {
  stopPolling();
  const token = ++requestId;
  app.innerHTML = loadingHTML();

  let standings;
  try {
    standings = await getStandings();
  } catch (err) {
    if (token === requestId) showError(() => showCompare(idA, idB));
    return;
  }
  if (token !== requestId) return;

  const teams = allTeams(standings);
  const wanted = (id) => (teams.some((row) => row.teamId === String(id || '')) ? String(id) : '');
  const a = wanted(idA);
  const b = wanted(idB);

  if (!a || !b) {
    app.innerHTML = comparePickerHTML(teams, a, b) + '<div class="state">' +
      esc(a ? 'Pick the second team to compare.' : 'Pick two teams to compare their season so far.') + '</div>';
    wireComparePicker(a, b);
    return;
  }

  let left;
  let right;
  try {
    [left, right] = await Promise.all([teamBundle(a), teamBundle(b)]);
  } catch (err) {
    if (token === requestId) showError(() => showCompare(a, b));
    return;
  }
  if (token !== requestId) return;

  const rivalIds = new Set(right.schedule.games.map((game) => game.id));
  const headToHead = left.schedule.games
    .filter((game) => rivalIds.has(game.id))
    .sort((x, y) => new Date(x.startISO) - new Date(y.startISO));
  const lastFive = (team) => {
    const played = recentGames(team.schedule.games, 5);
    return '<section class="card standings-block"><h2>Last 5 · ' + esc(team.abbr) + '</h2>' +
      (played.length
        ? '<div class="sched">' + played.map(scheduleRowHTML).join('') + '</div>'
        : '<div class="state">No games played yet</div>') +
      '</section>';
  };

  setTitle(left.abbr + ' vs ' + right.abbr + ' · Compare');

  app.innerHTML = comparePickerHTML(teams, a, b) +
    compareHeadHTML(left, right) +
    compareTableHTML(left, right, COMPARE_ROWS, left.abbr + ' vs ' + right.abbr + ' · season comparison') +
    lastFive(left) + lastFive(right) +
    '<section class="card standings-block"><h2>This season · head to head</h2>' +
    (headToHead.length
      ? '<div class="sched">' + headToHead.map(scheduleRowHTML).join('') + '</div>'
      : '<div class="state">No games meet both schedules.</div>') +
    '</section>';

  wireComparePicker(a, b);
}

/* ── Leaders ────────────────────────────────────────────────────────────── */
const LEADERS_API = WEB + '/statistics/byathlete';
const LEADER_BOARDS = [
  { key: 'points', label: 'Points', category: 'offensive', stat: 'avgPoints' },
  { key: 'rebounds', label: 'Rebounds', category: 'general', stat: 'avgRebounds' },
  { key: 'assists', label: 'Assists', category: 'offensive', stat: 'avgAssists' },
  { key: 'steals', label: 'Steals', category: 'defensive', stat: 'avgSteals' },
  { key: 'blocks', label: 'Blocks', category: 'defensive', stat: 'avgBlocks' },
  { key: 'threes', label: '3PM per game', category: 'offensive', stat: 'avgThreePointFieldGoalsMade' },
];
const leadersCache = new Map();

function initialsOf(name) {
  return String(name || '').split(/\s+/).filter(Boolean).slice(0, 2)
    .map((part) => part.charAt(0).toUpperCase()).join('');
}

// Initials sit under the image, so a missing or broken headshot swaps down to
// the circle with no layout shift.
function avatarHTML(src, name) {
  return '<span class="avatar">' +
    '<span class="avatar-ini" aria-hidden="true">' + esc(initialsOf(name) || '?') + '</span>' +
    (src ? '<img src="' + esc(smallImg(src, 52, 52)) + '" alt="' + esc(name || '') + '" width="26" height="26" loading="lazy" decoding="async" onerror="this.remove()">' : '') +
    '</span>';
}

function leaderRowHTML(row) {
  return '<div class="leader-row">' +
    '<span class="rank">' + esc(row.rank) + '</span>' +
    avatarHTML(row.headshot, row.name) +
    '<span class="who"><a href="#player/' + esc(row.id) + '">' + esc(row.name) + '</a>' +
    (row.teamAbbr ? '<span class="team"> ' + esc(row.teamAbbr) + '</span>' : '') + '</span>' +
    '<span class="val">' + esc(oneDecimal(row.value)) +
    (row.gp == null ? '' : ' <span class="gp">' + esc(row.gp) + ' GP</span>') + '</span></div>';
}

function leaderBoardHTML(rows) {
  if (!rows.length) return '<div class="state">No data for this board yet.</div>';
  return rows.map(leaderRowHTML).join('');
}

async function showLeaders() {
  stopPolling();
  const token = ++requestId;

  app.innerHTML = LEADER_BOARDS.map((board) => {
    const cached = leadersCache.get(board.key);
    return '<section class="card standings-block"><h2>' + esc(board.label) + '</h2>' +
      '<div class="board-body">' +
      (cached ? leaderBoardHTML(cached) : '<div class="state"><span class="pulse"></span>Loading…</div>') +
      '</div></section>';
  }).join('');

  setTitle('NBA Leaders');

  await Promise.all(LEADER_BOARDS.map(async (board, index) => {
    if (leadersCache.has(board.key)) return;
    const body = app.querySelectorAll('.board-body')[index];
    try {
      const url = LEADERS_API + '?limit=50&category=' + encodeURIComponent(board.category) +
        '&sort=' + encodeURIComponent(board.category + '.' + board.stat + ':desc');
      const rows = parseLeaders(await fetchJSON(url), board.category, board.stat);
      leadersCache.set(board.key, rows);
      if (token === requestId && body) body.innerHTML = leaderBoardHTML(rows);
    } catch (err) {
      if (token === requestId && body) body.innerHTML = '<div class="state">Couldn\'t load this board.</div>';
    }
  }));
}

/* ── Player search ──────────────────────────────────────────────────────── */
let searchTimer = 0;
let searchAbort = null;
let searchResults = [];
let searchActive = -1;

function highlightSearchResult() {
  const list = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');
  if (!list || !input) return;
  list.querySelectorAll('[role="option"]').forEach((option, index) => {
    option.setAttribute('aria-selected', String(index === searchActive));
    if (index === searchActive) input.setAttribute('aria-activedescendant', option.id);
  });
}

function searchOptionHTML(player, prefix) {
  return '<li role="option"' + (prefix ? ' id="' + esc(prefix) + esc(player.id) + '"' : '') +
    ' data-id="' + esc(player.id) + '" aria-selected="false">' +
    (player.headshot ? '<img src="' + esc(smallImg(player.headshot, 48, 48)) + '" alt="' + esc(player.name) + '" width="24" height="24" loading="lazy" decoding="async">' : '') +
    '<span>' + esc(player.name) + '</span>' +
    (player.teamAbbr ? '<span class="sr-team">' + esc(player.teamAbbr) + '</span>' : '') +
    '</li>';
}

async function searchPlayers(query, signal) {
  const response = await fetch(SEARCH_API + encodeURIComponent(query) + '&limit=10&type=player', { cache: 'no-store', signal });
  if (!response.ok) throw new Error('ESPN HTTP ' + response.status);
  return parseSearch(await response.json()).slice(0, 8);
}

function paintSearchMessage(message) {
  const list = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');
  if (!list || !input) return;
  searchResults = [];
  searchActive = -1;
  list.innerHTML = '<li class="sr-empty" role="presentation">' + esc(message) + '</li>';
  list.hidden = false;
  input.setAttribute('aria-expanded', 'true');
}

function paintSearchResults(items) {
  const list = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');
  if (!list || !input) return;
  searchResults = items;
  searchActive = items.length ? 0 : -1;
  list.innerHTML = items.length
    ? items.map((player) => searchOptionHTML(player, 'search-opt-')).join('')
    : '<li class="sr-empty" role="presentation">No NBA players found</li>';
  list.hidden = false;
  input.setAttribute('aria-expanded', 'true');
  highlightSearchResult();
}

function closeSearch() {
  if (searchTimer) {
    clearTimeout(searchTimer);
    searchTimer = 0;
  }
  if (searchAbort) {
    searchAbort.abort();
    searchAbort = null;
  }
  const list = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');
  const toggle = document.getElementById('searchToggle');
  const shell = document.getElementById('nbaSearch');
  if (list) {
    list.hidden = true;
    list.innerHTML = '';
  }
  if (input) input.setAttribute('aria-expanded', 'false');
  if (toggle) toggle.setAttribute('aria-expanded', 'false');
  if (shell) shell.classList.remove('open');
  searchResults = [];
  searchActive = -1;
}

function openPlayer(id) {
  if (!id) return;
  closeSearch();
  location.hash = '#player/' + id;
}

async function runSearch(query) {
  if (searchAbort) searchAbort.abort();
  searchAbort = new AbortController();
  const signal = searchAbort.signal;
  paintSearchMessage('Searching…');
  try {
    const players = await searchPlayers(query, signal);
    if (signal.aborted) return;
    paintSearchResults(players);
  } catch (err) {
    if (signal.aborted || (err && err.name === 'AbortError')) return;
    paintSearchResults([]);
  }
}

function initSearch() {
  const input = document.getElementById('searchInput');
  const toggle = document.getElementById('searchToggle');
  const list = document.getElementById('searchResults');
  const shell = document.getElementById('nbaSearch');
  if (!input || !toggle || !list || !shell) return;

  input.addEventListener('input', () => {
    if (searchTimer) clearTimeout(searchTimer);
    const query = input.value.trim();
    if (query.length < 2) {
      if (searchAbort) searchAbort.abort();
      closeSearch();
      return;
    }
    searchTimer = setTimeout(() => runSearch(query), 250);
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      closeSearch();
      return;
    }
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      if (!searchResults.length) return;
      event.preventDefault();
      const step = event.key === 'ArrowDown' ? 1 : -1;
      searchActive = (searchActive + step + searchResults.length) % searchResults.length;
      highlightSearchResult();
      return;
    }
    if (event.key === 'Enter' && searchResults.length) {
      event.preventDefault();
      const picked = searchResults[Math.max(0, searchActive)];
      if (picked) openPlayer(picked.id);
    }
  });

  list.addEventListener('click', (event) => {
    const option = event.target.closest('[data-id]');
    if (option) openPlayer(option.getAttribute('data-id'));
  });

  toggle.addEventListener('click', () => {
    const open = !shell.classList.contains('open');
    shell.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', String(open));
    if (open) input.focus();
    else closeSearch();
  });

  // Tapping anywhere outside the search closes it, so the brand and the sport
  // switch stay reachable while the phone overlay is open.
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('click', (event) => {
      if (shell.contains && shell.contains(event.target)) return;
      closeSearch();
    });
  }
}

function formatLogDate(iso) {
  const day = new Date(iso);
  if (Number.isNaN(day.getTime())) return '';
  return day.toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
}

function averagesHTML(overview) {
  if (!overview.labels.length) return '<div class="state">No averages for this player.</div>';
  const row = (title, values) => '<tr><td>' + esc(title) + '</td>' +
    overview.labels.map((label) => '<td>' + (values[label] == null ? '—' : esc(values[label])) + '</td>').join('') +
    '</tr>';
  return '<div class="table-wrap"><table class="log avg">' +
    '<caption class="sr-only">Season and career averages</caption><thead><tr><th class="sticky-col">Split</th>' +
    overview.labels.map((label) => '<th>' + esc(label) + '</th>').join('') +
    '</tr></thead><tbody>' + row('Season', overview.season) + row('Career', overview.career) +
    '</tbody></table></div>';
}

function seasonTableHTML(labels, games) {
  const head = '<th class="sticky-col">Date</th><th>Opp</th><th>Result</th>' +
    labels.map((label) => '<th>' + esc(label) + '</th>').join('');
  const rows = games.map((game) => '<tr><td class="sticky-col">' + esc(formatLogDate(game.date)) + '</td>' +
    '<td>' + esc((game.atVs ? game.atVs + ' ' : '') + game.opponentAbbr) + '</td>' +
    '<td>' + esc((game.result ? game.result + ' ' : '') + game.score) + '</td>' +
    labels.map((label) => '<td>' + (game.stats[label] == null ? '—' : esc(game.stats[label])) + '</td>').join('') +
    '</tr>').join('');
  return '<div class="table-wrap"><table class="log">' +
    '<caption class="sr-only">Game log</caption><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function gameLogHTML(log) {
  if (!log.seasons.length) return '<div class="state">No games logged this season.</div>';
  const found = log.seasons.findIndex((season) => /regular season/i.test(season.name));
  const active = found >= 0 ? found : 0;
  const tabs = log.seasons.map((season, index) =>
    '<button class="tab" type="button" role="tab" data-season="' + index + '" aria-selected="' + (index === active) + '">' + esc(season.name) + '</button>').join('');
  const panels = log.seasons.map((season, index) =>
    '<section data-season-panel="' + index + '"' + (index === active ? '' : ' hidden') + '>' +
    (season.games.length ? seasonTableHTML(log.labels, season.games) : '<div class="state">No games</div>') +
    '</section>').join('');
  return '<div class="tabs-row" role="tablist">' + tabs + '</div>' + panels;
}

function wireSeasonTabs() {
  const tabs = app.querySelectorAll('.tabs-row .tab[data-season]');
  tabs.forEach((tab) => tab.addEventListener('click', () => {
    tabs.forEach((other) => other.setAttribute('aria-selected', String(other === tab)));
    app.querySelectorAll('section[data-season-panel]').forEach((panel) => {
      panel.hidden = panel.getAttribute('data-season-panel') !== tab.getAttribute('data-season');
    });
  }));
}

async function showPlayer(id) {
  stopPolling();
  const token = ++requestId;
  app.innerHTML = loadingHTML();

  let athlete;
  let overview;
  let log;
  try {
    const payloads = await Promise.all([
      fetchJSON(WEB + '/athletes/' + encodeURIComponent(id)),
      fetchJSON(WEB + '/athletes/' + encodeURIComponent(id) + '/overview'),
      fetchJSON(WEB + '/athletes/' + encodeURIComponent(id) + '/gamelog'),
    ]);
    athlete = parseAthlete(payloads[0]);
    overview = parsePlayerOverview(payloads[1]);
    log = parseGameLog(payloads[2]);
  } catch (err) {
    if (token === requestId) showError(() => showPlayer(id));
    return;
  }
  if (token !== requestId) return;

  const facts = [
    athlete.jersey ? '#' + athlete.jersey : '',
    athlete.pos,
    athlete.height,
    athlete.weight,
    athlete.age == null ? '' : athlete.age + ' yrs',
  ].filter(Boolean).map((fact) => esc(fact)).join(' · ');

  setTitle(athlete.name);

  const head = '<div class="card player-head">' +
    (athlete.headshot ? '<img src="' + esc(smallImg(athlete.headshot, 128, 128)) + '" alt="' + esc(athlete.name || '') + '" width="64" height="64" loading="lazy" decoding="async">' : '') +
    '<div class="p-meta"><h1>' + esc(athlete.name || 'Player') + '</h1>' +
    (facts ? '<div class="p-sub">' + facts + '</div>' : '') +
    (athlete.team.id
      ? '<div class="p-sub"><a href="#team/' + esc(athlete.team.id) + '">' + esc(athlete.team.name || athlete.team.abbr) + '</a></div>'
      : '') +
    '</div>' +
    '<a class="cmp-link" href="#players/' + esc(athlete.id || id) + '">Compare</a></div>';

  app.innerHTML = head +
    '<section class="card standings-block"><h2>Averages</h2>' + averagesHTML(overview) + '</section>' +
    '<section class="card standings-block"><h2>Game log</h2>' + gameLogHTML(log) + '</section>';

}

// Same search component as the header, mounted on a picker field.
function bindPlayerSearch(inputId, listId, onPick) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if (!input || !list) return;
  let timer = 0;
  let controller = null;
  let results = [];
  let active = -1;

  const close = () => {
    if (timer) clearTimeout(timer);
    if (controller) controller.abort();
    list.hidden = true;
    list.innerHTML = '';
    results = [];
    active = -1;
    input.setAttribute('aria-expanded', 'false');
  };

  const paint = () => {
    list.innerHTML = results.length
      ? results.map((player) => searchOptionHTML(player, inputId + '-opt-')).join('')
      : '<li class="sr-empty" role="presentation">No NBA players found</li>';
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    list.querySelectorAll('[role="option"]').forEach((option, index) => {
      option.setAttribute('aria-selected', String(index === active));
    });
  };

  input.addEventListener('input', () => {
    if (timer) clearTimeout(timer);
    if (controller) controller.abort();
    const query = input.value.trim();
    if (query.length < 2) {
      close();
      return;
    }
    list.innerHTML = '<li class="sr-empty" role="presentation">Searching…</li>';
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    timer = setTimeout(async () => {
      controller = new AbortController();
      const signal = controller.signal;
      try {
        results = await searchPlayers(query, signal);
        if (signal.aborted) return;
        active = results.length ? 0 : -1;
        paint();
      } catch (err) {
        if (signal.aborted) return;
        results = [];
        active = -1;
        paint();
      }
    }, 250);
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      close();
      return;
    }
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      if (!results.length) return;
      event.preventDefault();
      active = (active + (event.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length;
      paint();
      return;
    }
    if (event.key === 'Enter' && results.length) {
      event.preventDefault();
      const picked = results[Math.max(0, active)];
      if (picked) onPick(picked.id);
    }
  });

  list.addEventListener('click', (event) => {
    const option = event.target.closest('[data-id]');
    if (option) onPick(option.getAttribute('data-id'));
  });

  // Registered so stopPolling() (every hash change) closes this picker too.
  pickerClosers.push(close);
}

async function playerEntry(id) {
  const [athleteJson, overviewJson] = await Promise.all([
    fetchJSON(WEB + '/athletes/' + encodeURIComponent(id)),
    fetchJSON(WEB + '/athletes/' + encodeURIComponent(id) + '/overview'),
  ]);
  return {
    id: String(id),
    athlete: parseAthlete(athleteJson),
    season: parsePlayerOverview(overviewJson).season,
  };
}

function playersHash(a, b) {
  return '#players' + (a ? '/' + a : '') + (a && b ? '/' + b : '');
}

async function showPlayers(idA, idB) {
  stopPolling();
  const token = ++requestId;
  const a = String(idA || '');
  const b = String(idB || '');
  const go = (nextA, nextB) => {
    const hash = playersHash(nextA, nextB);
    if (location.hash !== hash) location.hash = hash;
  };

  if (!a || !b) {
    app.innerHTML = playerPickerHTML() + '<div class="state">' +
      esc(a || b ? 'Pick the second player to compare.' : 'Search for two players to compare their season averages.') + '</div>';
    bindPlayerSearch('psA', 'psListA', (id) => go(id, b));
    bindPlayerSearch('psB', 'psListB', (id) => go(a, id));
    return;
  }

  app.innerHTML = playerPickerHTML() + loadingHTML();
  bindPlayerSearch('psA', 'psListA', (id) => go(id, b));
  bindPlayerSearch('psB', 'psListB', (id) => go(a, id));

  let left;
  let right;
  try {
    [left, right] = await Promise.all([playerEntry(a), playerEntry(b)]);
  } catch (err) {
    if (token === requestId) showError(() => showPlayers(a, b));
    return;
  }
  if (token !== requestId) return;

  setTitle(lastName(left.athlete.name) + ' vs ' + lastName(right.athlete.name));

  app.innerHTML = playerPickerHTML(left.athlete.name, right.athlete.name) +
    playerCompareHeadHTML(left, right) +
    compareTableHTML(left, right, PLAYER_COMPARE_ROWS, 'Player comparison');
  bindPlayerSearch('psA', 'psListA', (id) => go(id, b));
  bindPlayerSearch('psB', 'psListB', (id) => go(a, id));
}

/* ── Game page: scorebug, tale of the tape, leaders, market blocks (gm-*) ──
   One layout for pre-game, live and final. Every block returns '' when its
   data is missing, so a payload with no BPI or no injuries just drops them. */
function gmLooks(game, colors) {
  const away = teamLook(colors, game.away.abbr, game.away.id, game.away.logo);
  const home = teamLook(colors, game.home.abbr, game.home.id, game.home.logo);
  // Two near-identical colours (both blue, say) make the bars unreadable, so
  // the home side moves to its alternate colour when that separates them.
  if (contrastRatio(away.fill, home.fill) < 1.35) {
    const entry = (colors && (colors.byAbbr[game.home.abbr] || colors.byId[String(game.home.id)])) || {};
    if (entry.alt && contrastRatio(away.fill, entry.alt) >= 1.35) {
      home.fill = entry.alt;
      home.ink = textOn(entry.alt);
    }
  }
  return { away, home };
}

function gmAbbr(side, look) {
  return '<span class="gm-abbr" style="color:' + readableOn(look.fill, PANEL_BG) + '">' + esc(side.abbr) + '</span>';
}

function gmBlockHTML(side, look, which, game) {
  const started = game.state !== 'pre' && side.score != null;
  const lost = game.state === 'post' && !side.winner;
  const split = which === 'home'
    ? (side.homeRecord ? side.homeRecord + ' home' : '')
    : (side.roadRecord ? side.roadRecord + ' road' : '');
  const logo = look.logo
    ? '<span class="gm-logo"><img src="' + esc(smallImg(look.logo, 72, 72)) + '" alt="" width="36" height="36" decoding="async"></span>'
    : '';
  return '<a class="gm-team ' + which + (started ? ' sc' : '') + (lost ? ' lost' : '') + '" href="#team/' + esc(side.id) + '" style="background:' + look.fill + ';color:' + look.ink + '">' +
    '<span class="gm-id">' + logo + '<span class="gm-ab">' + esc(side.abbr) + '</span></span>' +
    '<span class="gm-nm">' + esc(side.name) + '</span>' +
    '<span class="gm-rec">' + esc(side.record) + (split ? '<i>' + esc(split) + '</i>' : '') + '</span>' +
    (started ? '<span class="gm-sc">' + esc(side.score) + '</span>' : '') + '</a>';
}

function gmMidHTML(game) {
  const live = game.state === 'in';
  const dayKey = etDate(game.startISO);
  const day = dayKey ? formatDay(dayKey) : '';
  const status = game.state === 'pre' ? (tipOff(game.startISO) || game.statusText || 'Scheduled') : (game.statusText || 'Final');
  const odds = game.odds;
  const line = [];
  if (odds && odds.details) line.push('<b>' + esc(odds.details) + '</b>');
  if (odds && odds.total != null) line.push('<span>O/U ' + esc(odds.total) + '</span>');
  return '<div class="gm-mid">' +
    (day ? '<span class="gm-day">' + esc(day) + '</span>' : '') +
    '<span class="gm-st' + (live ? ' live' : '') + '">' + (live ? '<i class="dot"></i>' : '') + esc(status) + '</span>' +
    (game.venue ? '<span class="gm-meta">' + esc(game.venue) + '</span>' : '') +
    (game.broadcast ? '<span class="gm-meta">' + esc(game.broadcast) + '</span>' : '') +
    (line.length ? '<span class="gm-line">' + line.join('') + '</span>' : '') + '</div>';
}

function gmBugHTML(game, looks) {
  return '<div class="gm-bug">' + gmBlockHTML(game.away, looks.away, 'away', game) + gmMidHTML(game) + gmBlockHTML(game.home, looks.home, 'home', game) + '</div>';
}

// Tale of the tape: values on the outside, bars grow from the centre in each
// team's colour. The better value gets the full bar; `lower` rows (turnovers,
// points allowed) flip which side is better. Rows with no data are dropped.
function gmTapeHTML(rows, left, right, looks, title, kind) {
  let shown = 0;
  const body = rows.map((row) => {
    const a = row.value(left);
    const b = row.value(right);
    if (a == null && b == null) return '';
    shown += 1;
    const share = barShares(a, b, row.lower);
    const lead = a != null && b != null && a !== b ? ((row.lower ? a < b : a > b) ? 'a' : 'b') : '';
    const val = (team, side) => {
      const sub = row.sub ? row.sub(team) : '';
      return '<b class="gm-v ' + side + (lead === side ? ' lead' : '') + '">' + esc(row.text(team)) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</b>';
    };
    const bar = (side, amount, fill) => '<span class="gm-bar ' + side + (lead === side ? ' lead' : '') + '"><i style="width:' + Math.round(amount * 100) + '%;background:' + fill + '"></i></span>';
    return '<div class="gm-tr">' + val(left, 'a') + bar('a', share.a, looks.away.fill) +
      '<span class="gm-k">' + esc(row.label) + '</span>' + bar('b', share.b, looks.home.fill) + val(right, 'b') + '</div>';
  }).join('');
  if (!shown) return '';
  return '<section class="card gm-card gm-tape" aria-label="' + esc(title) + '">' +
    '<div class="gm-th"><span class="a">' + gmAbbr(left, looks.away) + '</span><h2>Tale of the tape · ' + esc(kind) + '</h2><span class="b">' + gmAbbr(right, looks.home) + '</span></div>' +
    body + '</section>';
}

function gmLeadersHTML(game, looks) {
  const leaders = game.leaders;
  if (!leaders) return '';
  const kind = (leaders.away && leaders.away.kind) || (leaders.home && leaders.home.kind);
  const col = (key) => {
    const lead = leaders[key];
    const side = game[key];
    const look = looks[key];
    if (!lead) return '';
    const rows = LEADER_ROWS.filter(([, field]) => lead[field]).map(([label, field]) => {
      const p = lead[field];
      const shot = p.headshot
        ? '<img class="gm-hsimg" src="' + esc(smallImg(p.headshot, 120, 88)) + '" alt="" width="44" height="44" loading="lazy" decoding="async">'
        : '';
      const name = p.id ? '<a href="#player/' + esc(p.id) + '">' + esc(p.name) + '</a>' : esc(p.name);
      const sub = [p.pos, p.jersey ? '#' + p.jersey : '', lead.kind === 'game' ? p.line : ''].filter(Boolean).join(' · ');
      return '<div class="gm-lr"><span class="gm-hs" style="--c:' + look.fill + '">' + shot + '</span>' +
        '<span class="gm-lw"><span class="gm-ln">' + name + '</span><span class="gm-ls">' + esc(sub) + '</span></span>' +
        '<span class="gm-lv"><b>' + esc(p.value) + '</b><i>' + label + '</i></span></div>';
    }).join('');
    if (!rows) return '';
    return '<div class="gm-lcol"><div class="gm-lh" style="--c:' + look.fill + '">' + gmAbbr(side, look) + '<span>' + esc(side.name) + '</span></div>' + rows + '</div>';
  };
  const cols = col('away') + col('home');
  if (!cols) return '';
  return '<section class="card gm-card"><div class="gm-ch"><h2>Leaders</h2><span>' + esc(leaderCaption(kind, game)) + '</span></div><div class="gm-ld">' + cols + '</div></section>';
}

function gmLineScoreHTML(game, looks) {
  if (game.state === 'pre') return '';
  const n = Math.max(game.away.linescores.length, game.home.linescores.length);
  if (!n) return '';
  const label = (i) => (i < 4 ? String(i + 1) : 'OT' + (i > 4 ? i - 3 : ''));
  const head = '<tr><th></th>' + Array.from({ length: n }, (_, i) => '<th>' + label(i) + '</th>').join('') + '<th class="t">T</th></tr>';
  const row = (key) => {
    const side = game[key];
    return '<tr><th class="tm"><span class="sw" style="background:' + looks[key].fill + '"></span>' + esc(side.abbr) + '</th>' +
      Array.from({ length: n }, (_, i) => '<td>' + (side.linescores[i] == null ? '—' : esc(side.linescores[i])) + '</td>').join('') +
      '<td class="t">' + (side.score == null ? '—' : esc(side.score)) + '</td></tr>';
  };
  return '<section class="card gm-card"><div class="gm-ch"><h2>Line score</h2></div><div class="gm-ls-wrap"><table class="gm-lsc"><caption class="sr-only">Score by period</caption><thead>' +
    head + '</thead><tbody>' + row('away') + row('home') + '</tbody></table></div></section>';
}

function gmSeriesHTML(pre, game) {
  if (!pre || !pre.seasonSeries.length) return '';
  const team = (abbr, score, winner) => '<span class="gm-st2' + (!winner ? '' : abbr === winner ? ' w' : ' l') + '">' + esc(abbr) + ' <b>' + esc(score) + '</b></span>';
  const rows = pre.seasonSeries.map((g) => {
    const done = g.state === 'post';
    return '<a class="gm-sr' + (String(g.id) === String(game.id) ? ' now' : '') + '" href="#game/' + esc(g.id) + '">' +
      '<span class="d">' + esc(formatDay(etDate(g.date) || '')) + '</span>' +
      (done
        ? '<span class="m">' + team(g.away, g.awayScore, g.winnerAbbr) + '<i>@</i>' + team(g.home, g.homeScore, g.winnerAbbr) + '</span><span class="r">Final</span>'
        : '<span class="m"><span class="gm-st2">' + esc(g.away) + '</span><i>@</i><span class="gm-st2">' + esc(g.home) + '</span></span><span class="r up">' + (String(g.id) === String(game.id) ? 'This game' : 'Upcoming') + '</span>') +
      '</a>';
  }).join('');
  return '<section class="card gm-card"><div class="gm-ch"><h2>Season series</h2></div><div class="gm-srs">' + rows + '</div></section>';
}

function gmLastFiveHTML(game, pre, looks) {
  if (!pre) return '';
  const col = (key) => {
    const side = game[key];
    const games = pre.lastFive[side.abbr] || [];
    if (!games.length) return '';
    const chips = games.map((g) => {
      const date = formatDay(etDate(g.date) || '').replace(/^\w+,\s*/, '');
      return '<a class="gm-g ' + (g.result === 'W' ? 'W' : 'L') + '" href="#game/' + esc(g.id) + '" title="' + esc(date) + '">' +
        '<b>' + esc(g.result || '–') + '</b><span>' + esc(g.atVs + ' ' + g.opponentAbbr) + '</span><span>' + esc(g.score) + '</span><span class="dt">' + esc(date) + '</span></a>';
    }).join('');
    return '<div class="gm-l5c"><div class="gm-lh" style="--c:' + looks[key].fill + '">' + gmAbbr(side, looks[key]) + '</div><div class="gm-chips">' + chips + '</div></div>';
  };
  const cols = col('away') + col('home');
  if (!cols) return '';
  return '<section class="card gm-card"><div class="gm-ch"><h2>Last 5</h2></div><div class="gm-l5">' + cols + '</div></section>';
}

function gmOddsHTML(game, looks) {
  const odds = game.odds;
  if (!odds) return '';
  const cell = (main, sub) => '<span class="gm-ov">' + (main ? '<b>' + esc(main) + '</b>' : '<b class="none">—</b>') + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>';
  const rows = [];
  const sp = odds.spread;
  if (sp.away.line || sp.home.line) {
    const moved = (key) => (odds.spreadOpen[key] && odds.spreadOpen[key] !== sp[key].line ? 'open ' + odds.spreadOpen[key] : sp[key].odds);
    rows.push('<span class="gm-ok">Spread</span>' + cell(sp.away.line, moved('away')) + cell(sp.home.line, moved('home')));
  }
  if (odds.moneyline) rows.push('<span class="gm-ok">Moneyline</span>' + cell(odds.moneyline.away) + cell(odds.moneyline.home));
  const total = [];
  if (odds.total != null) {
    total.push('<span><i>Total</i> <b>' + esc(odds.total) + '</b></span>');
    if (odds.totalOpen != null && odds.totalOpen !== odds.total) total.push('<span><i>Opened</i> ' + esc(odds.totalOpen) + '</span>');
    if (odds.overOdds) total.push('<span><i>Over</i> ' + esc(odds.overOdds) + '</span>');
    if (odds.underOdds) total.push('<span><i>Under</i> ' + esc(odds.underOdds) + '</span>');
  }
  if (!rows.length && !total.length) return '';
  const head = rows.length
    ? '<span class="gm-ok"></span><span class="gm-ov h">' + gmAbbr(game.away, looks.away) + '</span><span class="gm-ov h">' + gmAbbr(game.home, looks.home) + '</span>'
    : '';
  return '<section class="card gm-card"><div class="gm-ch"><h2>Odds</h2>' + (odds.provider ? '<span>' + esc(odds.provider) + '</span>' : '') + '</div>' +
    (rows.length ? '<div class="gm-og">' + head + rows.join('') + '</div>' : '') +
    (total.length ? '<div class="gm-ot">' + total.join('') + '</div>' : '') + '</section>';
}

// BPI win chance before tip-off, the in-game win probability while live.
function gmWinChanceHTML(game, looks) {
  const bpi = game.state === 'pre' ? game.predictor : null;
  const live = game.state === 'in' ? game.winProb : null;
  const chance = bpi || live;
  if (!chance || chance.away + chance.home <= 0) return '';
  const pct = (value) => (Math.round(value * 10) / 10).toFixed(1) + '%';
  const top = (key) => '<span class="gm-wp ' + key + '">' + gmAbbr(game[key], looks[key]) + '<b>' + esc(pct(chance[key])) + '</b></span>';
  return '<section class="card gm-card"><div class="gm-ch"><h2>Win chance</h2><span>' + (bpi ? 'ESPN BPI' : 'Live') + '</span></div>' +
    '<div class="gm-wp-top">' + top('away') + top('home') + '</div>' +
    '<div class="gm-split" role="img" aria-label="' + esc(game.away.abbr + ' ' + pct(chance.away) + ', ' + game.home.abbr + ' ' + pct(chance.home)) + '">' +
    '<i style="flex:' + chance.away + ';background:' + looks.away.fill + '"></i><i style="flex:' + chance.home + ';background:' + looks.home.fill + '"></i></div></section>';
}

function gmInjuriesHTML(game, looks) {
  // ESPN's list is the current report, not the report as of a finished game.
  if (game.state === 'post' || !game.injuries) return '';
  const col = (key) => {
    const list = game.injuries[key];
    const rows = list.length
      ? list.map((p) => {
        const back = p.returnDate ? formatDay(p.returnDate.replace(/-/g, '')) : '';
        const note = [p.detail, back ? 'back ' + back : ''].filter(Boolean).join(' · ');
        return '<div class="gm-ir"><span class="gm-in">' + esc(p.name) + (p.pos ? '<i>' + esc(p.pos) + '</i>' : '') + '</span>' +
          '<span class="gm-sx' + (/^out/i.test(p.status) ? ' out' : '') + '">' + esc(p.status || 'Listed') + '</span>' +
          (note ? '<span class="gm-idt">' + esc(note) + '</span>' : '') + '</div>';
      }).join('')
      : '<div class="gm-none">No injuries listed.</div>';
    return '<div class="gm-icol"><div class="gm-lh" style="--c:' + looks[key].fill + '">' + gmAbbr(game[key], looks[key]) + '<span>' + esc(game[key].name) + '</span></div>' + rows + '</div>';
  };
  return '<section class="card gm-card"><div class="gm-ch"><h2>Injuries</h2></div>' + col('away') + col('home') + '</section>';
}

function gmAtsHTML(game, looks) {
  if (!game.ats) return '';
  const col = (key) => {
    const list = game.ats[key];
    if (!list.length) return '';
    return '<div class="gm-icol"><div class="gm-lh" style="--c:' + looks[key].fill + '">' + gmAbbr(game[key], looks[key]) + '</div>' +
      list.map((r) => '<div class="gm-ar"><span>' + esc(r.label) + '</span><b>' + esc(r.summary) + '</b></div>').join('') + '</div>';
  };
  const cols = col('away') + col('home');
  return cols ? '<section class="card gm-card"><div class="gm-ch"><h2>Against the spread</h2></div>' + cols + '</section>' : '';
}

function gmPageHTML(game, parts) {
  const looks = parts.looks;
  const left = parts.tape + gmLeadersHTML(game, looks) + gmLineScoreHTML(game, looks) + gmSeriesHTML(parts.pre, game) + gmLastFiveHTML(game, parts.pre, looks);
  const right = gmOddsHTML(game, looks) + gmWinChanceHTML(game, looks) + gmInjuriesHTML(game, looks) + gmAtsHTML(game, looks);
  return '<div class="gm">' + gmBugHTML(game, looks) +
    (parts.live ? '<div class="gm-live">Live · updates every 30s</div>' : '') +
    '<div class="gm-cols' + (left && right ? ' two' : '') + '">' +
    (left ? '<div class="gm-col">' + left + '</div>' : '') + (right ? '<div class="gm-col">' + right + '</div>' : '') + '</div>' +
    (parts.box || '') +
    '<a class="cmp-link" href="#compare/' + esc(game.away.id) + '/' + esc(game.home.id) + '">Full comparison →</a></div>';
}

async function showPreGame(game, pre, token, colors) {
  const settled = await Promise.all([game.away.id, game.home.id].map((id) => teamBundle(id).catch(() => null)));
  if (token !== requestId) return;
  const looks = gmLooks(game, colors);
  const [away, home] = settled;

  setTitle(game.away.abbr + ' vs ' + game.home.abbr);

  const tape = away && home
    ? gmTapeHTML(COMPARE_ROWS, away, home, looks, game.away.abbr + ' at ' + game.home.abbr + ' season comparison', 'season')
    : '';
  app.innerHTML = gmPageHTML(game, { looks, tape, pre, live: false, box: '' });
}

function armGamePoll(id) {
  gameTimer = setTimeout(() => {
    const route = parseHash();
    if (route.view === 'game' && route.arg === String(id)) showGame(id, true);
  }, POLL_MS);
}

async function showGame(id, isRefresh = false) {
  stopPolling();
  const token = ++requestId;
  if (!isRefresh) app.innerHTML = loadingHTML();

  let json;
  let colors;
  try {
    [json, colors] = await Promise.all([fetchJSON(API + '/summary?event=' + encodeURIComponent(id)), getTeamColors()]);
  } catch (err) {
    if (token !== requestId) return;
    if (isRefresh) armGamePoll(id);
    else showError(() => showGame(id));
    return;
  }
  if (token !== requestId) return;

  const box = parseBoxScore(json);
  const game = parseGameExtras(json);
  const pre = parsePreGame(json);

  if (game.away && game.home && box.teams.length) {
    renderBoxScore(box, game, pre, colors);
    if (box.state === 'in') armGamePoll(id);
    return;
  }

  if (game.away && game.home && box.state === 'pre') {
    await showPreGame(game, pre, token, colors);
    return;
  }

  app.innerHTML = '<div class="state">No box score for this game.<br><a class="nav" href="#scores">Back to scores</a></div>';
}

// Team comparison from the box-score totals, for live and final games. Made -
// attempted lines are compared on the percentage the shot line implies and
// shown small under it. The last four rows are team counts from the summary.
const BOX_ROWS = [
  { label: 'FG%', value: (team) => team.shooting.fg, text: (team) => oneDecimal(team.shooting.fg), sub: (team) => team.totals.FG || '' },
  { label: '3P%', value: (team) => team.shooting.three, text: (team) => oneDecimal(team.shooting.three), sub: (team) => team.totals['3PT'] || '' },
  { label: 'FT%', value: (team) => team.shooting.ft, text: (team) => oneDecimal(team.shooting.ft), sub: (team) => team.totals.FT || '' },
  { label: 'REB', value: (team) => team.totals.REB, text: (team) => wholeNumber(team.totals.REB) },
  { label: 'AST', value: (team) => team.totals.AST, text: (team) => wholeNumber(team.totals.AST) },
  { label: 'TOV', value: (team) => team.totals.TO, text: (team) => wholeNumber(team.totals.TO), lower: true },
  { label: 'STL', value: (team) => team.totals.STL, text: (team) => wholeNumber(team.totals.STL) },
  { label: 'BLK', value: (team) => team.totals.BLK, text: (team) => wholeNumber(team.totals.BLK) },
  { label: 'Paint', value: (team) => team.counts && team.counts.paint, text: (team) => wholeNumber(team.counts && team.counts.paint) },
  { label: 'Fast break', value: (team) => team.counts && team.counts.fastBreak, text: (team) => wholeNumber(team.counts && team.counts.fastBreak) },
  { label: 'Pts off TO', value: (team) => team.counts && team.counts.offTurnovers, text: (team) => wholeNumber(team.counts && team.counts.offTurnovers) },
  { label: 'Max lead', value: (team) => team.counts && team.counts.largestLead, text: (team) => wholeNumber(team.counts && team.counts.largestLead) },
];

function renderBoxScore(box, game, pre, colors) {
  const looks = gmLooks(game, colors);
  const awayBox = box.teams.find((team) => team.abbr === game.away.abbr) || box.teams[0];
  const homeBox = box.teams.find((team) => team.abbr === game.home.abbr) || box.teams[1];
  const withCounts = (team, key) => ({ ...team, counts: game.counts ? game.counts[key] : null });

  setTitle(game.away.abbr + ' vs ' + game.home.abbr);

  const tape = awayBox && homeBox
    ? gmTapeHTML(BOX_ROWS, withCounts(awayBox, 'away'), withCounts(homeBox, 'home'), looks, game.away.abbr + ' vs ' + game.home.abbr + ' game stats', 'this game')
    : '';
  const tables = box.teams.map((team) => boxTableHTML(team, team.abbr === game.home.abbr ? looks.home : looks.away)).join('');
  app.innerHTML = gmPageHTML(game, { looks, tape, pre, live: box.state === 'in', box: '<h2 class="gm-sh">Box score</h2>' + tables });
}

/* ── Team page ──────────────────────────────────────────────────────────── */
function scheduleRowHTML(game) {
  const opponent = '<span class="ha">' + (game.homeAway === 'home' ? 'vs' : '@') + '</span>' +
    (game.opponent.logo ? '<img src="' + esc(smallImg(game.opponent.logo, 36, 36)) + '" alt="" width="18" height="18" loading="lazy" decoding="async">' : '') +
    esc(game.opponent.abbr || game.opponent.name);
  const result = game.result
    ? '<span class="res ' + (game.result === 'W' ? 'win' : 'loss') + '">' + game.result + ' ' + (game.score == null ? '' : esc(game.score) + (game.oppScore == null ? '' : '-' + esc(game.oppScore))) + '</span>'
    : '<span class="res upcoming">' + esc(formatWhen(game.startISO)) + '</span>';
  return '<a class="sched-row" href="#game/' + esc(game.id) + '">' +

function rosterRowHTML(player) {
  return '<div class="roster-row"><span class="jersey">' + esc(player.jersey || '—') + '</span>' +
    '<span class="name">' + (player.id ? '<a href="#player/' + esc(player.id) + '">' + esc(player.name) + '</a>' : esc(player.name)) + '</span>' +
    '<span class="pos">' + esc(player.pos || '—') + '</span>' +
    '<span class="age">' + esc(player.height || '') + (player.age ? ' · ' + esc(player.age) : '') + '</span></div>';
}

function teamStatsHTML(bundle) {
  const diff = bundle.ppg == null || bundle.oppPpg == null ? null : bundle.ppg - bundle.oppPpg;
  const cells = [
    ['PPG', oneDecimal(bundle.ppg)],
    ['Opp PPG', oneDecimal(bundle.oppPpg)],
    ['Diff', signedDecimal(diff)],
    ['FG%', oneDecimal(bundle.stats.fgPct)],
    ['3P%', oneDecimal(bundle.stats.threePct)],
    ['REB', oneDecimal(bundle.stats.reb)],
    ['AST', oneDecimal(bundle.stats.ast)],
    ['TOV', oneDecimal(bundle.stats.tov)],
  ];
  return '<section class="card team-stats"><h2>Season stats</h2><div class="stat-grid">' +
    cells.map(([label, value]) => '<div class="stat-cell"><span class="stat-lbl">' + esc(label) + '</span>' +
      '<span class="stat-val' + (label === 'Diff' && diff != null && diff > 0 ? ' diff-pos' : '') + '">' + esc(value) + '</span></div>').join('') +
    '</div></section>';

async function showTeam(id) {
  stopPolling();
  const token = ++requestId;
  app.innerHTML = loadingHTML();

  let bundle;
  let roster;
  try {
    const both = await Promise.all([
      teamBundle(id),
      fetchJSON(API + '/teams/' + encodeURIComponent(id) + '/roster').then(parseRoster),
    ]);
    bundle = both[0];
    roster = both[1];
  } catch (err) {
    if (token === requestId) showError(() => showTeam(id));
    return;
  }
  if (token !== requestId) return;

  const schedule = bundle.schedule;
  const team = schedule.team;
  setTitle(team.name);

  const head = '<div class="card team-head">' +
    (team.logo ? '<img src="' + esc(smallImg(team.logo, 104, 104)) + '" alt="" width="52" height="52" loading="lazy" decoding="async">' : '') +
    '<div class="team-meta"><h1>' + esc(team.name || 'Team') + '</h1>' +
    (team.record ? '<div class="record">' + esc(team.record) + '</div>' : '') + '</div>' +
    '<a class="cmp-link" href="#compare/' + esc(id) + '">Compare</a></div>';

  const scheduleList = schedule.games.length
    ? '<div class="card sched">' + schedule.games.map(scheduleRowHTML).join('') + '</div>'
    : '<div class="state">No games</div>';
  const rosterList = roster.length
    ? '<div class="card sched">' + roster.map(rosterRowHTML).join('') + '</div>'
    : '<div class="state">No roster</div>';

  app.innerHTML = head + teamStatsHTML(bundle) +
    '<div class="tabs-row" role="tablist">' +
    '<button class="tab" type="button" role="tab" data-panel="schedule" aria-selected="true">Schedule</button>' +
    '<button class="tab" type="button" role="tab" data-panel="roster" aria-selected="false">Roster</button>' +
    '</div>' +
    '<section data-view="schedule">' + scheduleList + '</section>' +
    '<section data-view="roster" hidden>' + rosterList + '</section>';

  const tabs = app.querySelectorAll('.tabs-row .tab');
  tabs.forEach((tab) => tab.addEventListener('click', () => {
    tabs.forEach((other) => other.setAttribute('aria-selected', String(other === tab)));
    app.querySelectorAll('section[data-view]').forEach((panel) => {
      panel.hidden = panel.getAttribute('data-view') !== tab.getAttribute('data-panel');
    });
  }));
}

/* ── Router ─────────────────────────────────────────────────────────────── */
function markNav(view) {
  document.querySelectorAll('[data-nav]').forEach((link) => {
    link.setAttribute('aria-current', link.getAttribute('data-nav') === view ? 'page' : 'false');
  });
}

function router() {
  stopPolling();
  const route = parseHash();
  markNav(route.view);
  // The scores view is three columns and needs more room than the other views.
  const onScores = !['standings', 'game', 'team', 'compare', 'leaders', 'players', 'player'].includes(route.view);
  document.body.classList.toggle('sc-wide', onScores);
  document.body.classList.toggle('gm-wide', route.view === 'game');

  if (route.view === 'standings') showStandings(route.args[0]);
  else if (route.view === 'game' && route.arg) showGame(route.arg);
  else if (route.view === 'team' && route.arg) showTeam(route.arg);
  else if (route.view === 'compare') showCompare(route.args[0], route.args[1]);
  else if (route.view === 'leaders') showLeaders();
  else if (route.view === 'players') showPlayers(route.args[0], route.args[1]);
  else if (route.view === 'player' && route.arg) showPlayer(route.arg);
  else showScores(route.view === 'scores' ? route.arg : '');
}

window.addEventListener('hashchange', router);
initSearch();
router();
</script>
</body>
</html>
