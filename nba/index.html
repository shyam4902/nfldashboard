<link rel="canonical" href="https://matchupboard.com/nba/">
<meta property="og:title" content="Matchup Board · NBA scores, matchups and stats">
<meta property="og:description" content="Live NBA scores, standings, team comparisons and player game logs.">
<meta property="og:url" content="https://matchupboard.com/nba/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://matchupboard.com/og-image.png">

<script src="https://cdn.tailwindcss.com"></script>
<script>
/* ── NFL26 pregame-studio palette ──────────────────────────────────────────
   The studio direction (home hero + schedule) is a warm charcoal base with a
   single gold accent. Remapping Tailwind's ramps here re-skins every utility
   class in the app at once, so `bg-slate-800` / `text-slate-400` and friends
   resolve to studio surfaces instead of the old navy-blue scale. Semantic
   families (green / red / steel) keep their meaning but drop the neon chroma.
   Guarded: the CDN above can fail (offline, blocked), and an unguarded
   assignment to `tailwind` would throw and abort the rest of the page. */
window.tailwind = window.tailwind || {};
tailwind.config = {
  theme: {
    extend: {
      colors: {
        /* Warm charcoal neutrals — replaces the navy `slate` scale */
        slate: {
          50: '#f4f2ef', 100: '#e9e7e3', 200: '#dbd9d4', 300: '#c9ccd1',
          400: '#8f9299', 500: '#868a91', 600: '#3d434c', 700: '#2b3037',
          800: '#16191f', 900: '#101215', 950: '#08090b',
        },
        /* Studio gold — the single accent */
        amber: {
          50: '#faf3e4', 100: '#f5e7c4', 200: '#eed9a2', 300: '#eecb86',
          400: '#d9a441', 500: '#d9a441', 600: '#c08f34', 700: '#a3782a',
          800: '#7f5d20', 900: '#5c4317', 950: '#33260d',
        },
        yellow: {
          300: '#eecb86', 400: '#d9a441', 500: '#d9a441', 600: '#c08f34',
        },
        orange: {
          300: '#eec08a', 400: '#d99a4d', 500: '#c8853a', 600: '#a96c2c',
        },
        /* Muted broadcast steel — link / secondary accent */
        blue: {
          50: '#eef2f6', 100: '#dde5ed', 200: '#c4d2e0', 300: '#a8bfd8',
          400: '#8fa6bf', 500: '#7590aa', 600: '#5c7490', 700: '#4a5e75',
          800: '#38485a', 900: '#28333f', 950: '#161c23',
        },
        sky: {
          200: '#c4d2e0', 300: '#a8bfd8', 400: '#8fa6bf', 500: '#7590aa',
          600: '#5c7490', 700: '#4a5e75',
        },
        cyan: {
          200: '#bfe2d9', 300: '#9fd3c7', 400: '#7ec0b0', 500: '#68ac9c',
          600: '#548b7e', 700: '#436f66',
        },
        teal: {
          300: '#9fd3c7', 400: '#7ec0b0', 500: '#68ac9c', 600: '#548b7e',
        },
        /* Field green — positive / value */
        emerald: {
          50: '#eef7f2', 100: '#d7ecdf', 200: '#b9dec9', 300: '#a3d9b8',
          400: '#7cc49b', 500: '#63b487', 600: '#4e9a70', 700: '#3e7c5a',
          800: '#316148', 900: '#254735', 950: '#12281c',
        },
        green: {
          300: '#a3d9b8', 400: '#7cc49b', 500: '#63b487', 600: '#4e9a70',
        },
        /* Muted crimson — negative / alert */
        red: {
          50: '#fbefed', 100: '#f7dbd7', 200: '#f2c3bc', 300: '#f2b0a8',
          400: '#e8877c', 500: '#d4635a', 600: '#b74e47', 700: '#963e39',
          800: '#78322e', 900: '#5a2523', 950: '#331413',
        },
        rose: {
          300: '#f2b0a8', 400: '#e8877c', 500: '#d4635a', 600: '#b74e47',
        },
        /* Desaturated violet — tertiary tags (draft rounds, etc.) */
        indigo: {
          300: '#c3badd', 400: '#a89ec9', 500: '#8f83b5', 600: '#746a97',
        },
        violet: {
          300: '#c3badd', 400: '#a89ec9', 500: '#8f83b5', 600: '#746a97',
        },
        purple: {
          300: '#c3badd', 400: '#a89ec9', 500: '#8f83b5', 600: '#746a97',
        },
      },
    },
  },
};
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Archivo:wght@600;700;800;900&display=swap');

:root {
  --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  /* Default Theme: NFL26 Pregame Studio — warm charcoal + a single gold accent.
     These surfaces match the home hero (.h2a-*) and schedule studio (.sch-*). */
  --bg-body: #0d0d0f;
  --bg-card: #161618;
  --bg-card-hover: #1e1e21;
  --bg-elevated: #1b1b1e;
  --bg-inset: #111113;
  --bg-header: rgba(22, 22, 24, 0.94);
  --border-card: #2e2e32;
  --border-muted: #28282c;
  --border-strong: #4a4a50;
  --text-main: #f2f2f3;
  --text-muted: #a3a3aa;
  --text-faint: #8c8c93;
  --accent-steel: #8fa6bf;
  --accent-positive: #7cc49b;
  --accent-positive-bg: rgba(124, 196, 155, 0.12);
  --accent-negative: #e8877c;
  --accent-negative-bg: rgba(232, 135, 124, 0.12);
  --accent-warning: #d9a441;
  --accent-warning-bg: rgba(217, 164, 65, 0.12);
  --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  /* Chrome accent: white on neutral greys. Gold is only for the brand word and
     the active tab / segmented-control state (--accent-brand, --tab-active-*).
     Tried all-white 2026-11-02; Shyam preferred the gold. */
  --accent-ui: #f2f2f3;
  --accent-ui-hover: #ffffff;
  --accent-ui-ink: #111113;
  --accent-ui-subtle: rgba(255, 255, 255, 0.08);
  --accent-brand: #d9a441;
  --tab-active-bg: #d9a441;
  --tab-active-text: #17140f;
}

html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  overflow-x: hidden;
  background: var(--bg-body);
  color: var(--text-main);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { display: block; }
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 12px; }

/* Accessible to a screen reader, never drawn. */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: absolute;
  left: 8px;
  top: -44px;
  z-index: 100;
  padding: 9px 12px;
  border-radius: 6px;
  background: var(--accent-ui);
  color: var(--accent-ui-ink);
  font: 700 12px/1 var(--font-sans);
}
.skip-link:focus { top: 8px; }
/* One focus ring for every interactive element, keyboard only. */
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent-ui);
  outline-offset: 2px;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
.nba-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg-header);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-card);
}
.nba-header .bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 52px;
}
.brand { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.brand-mark {
  font: 800 19px/1 var(--font-sans);
  letter-spacing: -0.02em;
  color: var(--accent-brand);
}
.brand-name { font: 800 19px/1 var(--font-sans); color: var(--text-main); }
.sport-switch { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.sport-switch a {
  font: 700 11px/1 var(--font-sans);
  letter-spacing: 0.04em;
  padding: 7px 10px;
  border-radius: 6px;
  border: 1px solid transparent;
  color: var(--text-muted);
}
.sport-switch a:hover { color: var(--text-main); background: var(--bg-card-hover); }
.sport-switch a[aria-current='page'] {
  color: var(--text-main);
  background: var(--bg-card-hover);
  border-color: var(--border-strong);
}
.nba-tabs { display: flex; gap: 2px; padding-bottom: 6px; overflow-x: auto; }
.nba-tabs a {
  font: 700 12px/1 var(--font-sans);
  padding: 7px 12px;
  border-radius: 6px;
  color: var(--text-muted);
  white-space: nowrap;
}
.nba-tabs a:hover { color: var(--text-main); background: var(--bg-card-hover); }
.nba-tabs a[aria-current='page'] { color: var(--tab-active-text); background: var(--tab-active-bg); }

main { padding: 14px 0 48px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 10px;
  box-shadow: var(--card-shadow);
}
h1, h2 { margin: 0; }
h2 { font: 700 12px/1.2 var(--font-sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }

/* ── States ─────────────────────────────────────────────────────────────── */
.state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 48px 16px;
  color: var(--text-muted);
  font: 500 13px/1.4 var(--font-sans);
  text-align: center;
}
.state .pulse { width: 7px; height: 7px; border-radius: 999px; background: var(--accent-ui); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
.retry {
  font: 700 12px/1 var(--font-sans);
  color: var(--tab-active-text);
  background: var(--accent-ui);
  border: 0;
  border-radius: 6px;
  padding: 9px 16px;
  cursor: pointer;
}
.retry:hover { background: var(--accent-ui-hover); }

/* ── Date bar ───────────────────────────────────────────────────────────── */
.date-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.date-bar .nav {
  font: 700 12px/1 var(--font-sans);
  color: var(--text-muted);
  background: var(--bg-elevated);
  border: 1px solid var(--border-card);
  border-radius: 6px;
  padding: 8px 10px;
  white-space: nowrap;
}
.date-bar .nav:hover { color: var(--text-main); border-color: var(--border-strong); }
.date-bar .nav.today { color: var(--accent-ui); }
.date-bar .day { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.date-bar .day strong { font: 700 14px/1.2 var(--font-sans); white-space: nowrap; }
.date-bar .day span { font: 500 10px/1 var(--font-mono); color: var(--text-faint); letter-spacing: 0.04em; }

/* ── Score cards ────────────────────────────────────────────────────────── */
.games { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (min-width: 640px) { .games { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.game-card {
  display: block;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 10px;
  box-shadow: var(--card-shadow);
  padding: 10px 12px;
  transition: border-color 0.15s, background-color 0.15s;
}
.game-card:hover { border-color: var(--border-strong); background: var(--bg-card-hover); }
.game-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.game-card-top .game-meta {
  min-width: 0;
  font: 500 10px/1 var(--font-mono);
  color: var(--text-faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.game-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font: 700 10px/1 var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-left: auto;
  white-space: nowrap;
}
.game-status.live { color: var(--text-main); }
.game-status .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
.game-status.live .dot { animation: pulse 1.1s ease-in-out infinite; }
.team-row {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}
.team-row .logo { width: 22px; height: 22px; object-fit: contain; }
.team-row .team-id { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.team-row .abbr { font: 800 14px/1 var(--font-sans); letter-spacing: -0.01em; }
.team-row .record { font: 500 10px/1 var(--font-mono); color: var(--text-faint); }
.team-row .score { font: 700 16px/1 var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--text-muted); }
.team-row.winner .abbr, .team-row.winner .score { color: var(--text-main); font-weight: 700; }
.team-row.loser .abbr, .team-row.loser .score { color: var(--text-muted); }
.game-meta { font: 500 10px/1 var(--font-mono); color: var(--text-faint); }

/* ── Tables ─────────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 0 0 10px 10px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
thead th {
  font: 700 10px/1 var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-faint);
  border-bottom: 1px solid var(--border-muted);
}
tbody td { font: 500 12px/1.3 var(--font-mono); color: var(--text-muted); border-bottom: 1px solid var(--border-muted); }
tbody tr:last-child td { border-bottom: 0; }

.standings-block { margin-bottom: 12px; overflow: hidden; }
.standings-block h2 { padding: 10px 12px 0; }
.standings { min-width: 580px; font-variant-numeric: tabular-nums; }
.standings td { color: var(--text-main); }
.standings th.seed, .standings td.seed { text-align: right; color: var(--text-faint); font-weight: 700; width: 34px; }
.standings th.team, .standings td.team { text-align: left; }
.standings td.team { display: flex; align-items: center; gap: 7px; min-width: 0; }
.standings td.team img { width: 18px; height: 18px; object-fit: contain; }
.standings td.team a { font: 600 12px/1.3 var(--font-sans); overflow: hidden; text-overflow: ellipsis; }
.standings td.team a:hover { color: var(--accent-ui); }
.standings tr.cut td { border-bottom: 2px solid var(--accent-ui-subtle); }

/* ── Game / box score ───────────────────────────────────────────────────── */
.box-block { margin-bottom: 12px; overflow: hidden; }
.box-block .box-title { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; }
.box-block .box-title img { width: 22px; height: 22px; object-fit: contain; }
.box-block .box-title h2 { color: var(--text-main); font-size: 13px; }
.box { min-width: 560px; }
.box th.player-col, .box td.player-col {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--bg-card);
  text-align: left;
  min-width: 130px;
  box-shadow: 1px 0 0 var(--border-muted);
}
.box thead th.player-col { background: var(--bg-card); }
.box td.player-col { font: 600 12px/1.3 var(--font-sans); color: var(--text-main); }
.box td.player-col .pos { font: 500 9px/1 var(--font-mono); color: var(--text-faint); margin-left: 5px; }
.box tr.bench-start td { border-top: 1px solid var(--border-card); }
.box tr.totals td { background: var(--bg-inset); color: var(--text-main); font-weight: 700; border-top: 1px solid var(--border-strong); }
.box tr.totals td.player-col { background: var(--bg-inset); }
.dnp { padding: 8px 12px 12px; font: 500 11px/1.5 var(--font-sans); color: var(--text-faint); }
.dnp b { color: var(--text-muted); font-weight: 700; }

/* ── Team page ──────────────────────────────────────────────────────────── */
.team-head { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 12px; }
.team-head img { width: 52px; height: 52px; object-fit: contain; }
.team-head .team-meta { min-width: 0; }
.team-head h1 { font: 800 20px/1.15 var(--font-sans); letter-spacing: -0.02em; }
.team-head .record { font: 500 11px/1 var(--font-mono); color: var(--text-muted); margin-top: 4px; }
.tabs-row { display: flex; gap: 4px; margin-bottom: 10px; }
.tabs-row .tab {
  font: 700 12px/1 var(--font-sans);
  color: var(--text-muted);
  background: transparent;
  border: 1px solid var(--border-card);
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
}
.tabs-row .tab[aria-selected='true'] { color: var(--tab-active-text); background: var(--tab-active-bg); border-color: transparent; }
.sched { overflow: hidden; }
.sched-row {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border-muted);
  font: 500 11px/1.3 var(--font-mono);
  color: var(--text-muted);
}
.sched-row:last-child { border-bottom: 0; }
.sched-row:hover { background: var(--bg-card-hover); }
.sched-row .sched-opp { display: flex; align-items: center; gap: 6px; font: 700 12px/1 var(--font-sans); color: var(--text-main); min-width: 0; }
.sched-row .sched-opp img { width: 18px; height: 18px; object-fit: contain; }
.sched-row .sched-opp .ha { font: 600 10px/1 var(--font-mono); color: var(--text-faint); }
.sched-row .res { font-weight: 700; }
.sched-row .res.win { color: var(--accent-positive); }
.sched-row .res.loss { color: var(--accent-negative); }
.sched-row .res.upcoming { color: var(--text-faint); font-weight: 500; }
.roster-row {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border-muted);
  font: 500 11px/1.3 var(--font-mono);
  color: var(--text-muted);
}
.roster-row:last-child { border-bottom: 0; }
.roster-row .jersey { color: var(--text-faint); }
.roster-row .name { font: 600 12px/1.3 var(--font-sans); color: var(--text-main); overflow: hidden; text-overflow: ellipsis; }
.roster-row .pos { font-weight: 700; color: var(--text-muted); }
@media (max-width: 420px) {
  .roster-row { grid-template-columns: 30px minmax(0, 1fr) auto; }
  .roster-row .age { display: none; }
}

/* ── Compare, matchup and player ────────────────────────────────────────── */
.cmp-pickers {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: 8px;
  align-items: end;
  padding: 12px;
  margin-bottom: 12px;
}
.cmp-pickers label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
  font: 700 10px/1 var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-faint);
}
.cmp-pickers select {
  width: 100%;
  min-width: 0;
  font: 600 13px/1 var(--font-sans);
  color: var(--text-main);
  background: var(--bg-elevated);
  border: 1px solid var(--border-card);
  border-radius: 6px;
  padding: 9px 8px;
}
.cmp-swap {
  font: 700 12px/1 var(--font-sans);
  color: var(--text-muted);
  background: var(--bg-elevated);
  border: 1px solid var(--border-card);
  border-radius: 6px;
  padding: 9px 10px;
  cursor: pointer;
}
.cmp-swap:hover { color: var(--text-main); border-color: var(--border-strong); }
.cmp-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  padding: 12px;
  margin-bottom: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 10px;
  box-shadow: var(--card-shadow);
}
.cmp-head.flat { background: none; border: 0; box-shadow: none; border-radius: 0; padding: 0; margin: 0 0 10px; }
.cmp-side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cmp-side.right { flex-direction: row-reverse; text-align: right; }
.cmp-side img { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
.cmp-side .cmp-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cmp-side .cmp-abbr { font: 800 16px/1 var(--font-sans); }
.cmp-side .cmp-name {
  font: 500 10px/1.2 var(--font-sans);
  color: var(--text-faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cmp-side .cmp-rec { font: 500 10px/1 var(--font-mono); color: var(--text-muted); }
.cmp-vs { font: 700 10px/1 var(--font-mono); color: var(--text-faint); }
.cmp-table td.cmp-lbl {
  text-align: center;
  font: 700 10px/1.1 var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-faint);
  white-space: nowrap;
}
.cmp-table td.cmp-val { text-align: right; font: 600 12px/1.2 var(--font-mono); color: var(--text-main); }
.cmp-table td.cmp-val.right { text-align: left; }
.cmp-table td.cmp-val.better { color: var(--accent-ui); font-weight: 700; }
.list-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-muted);
  font: 500 11px/1.4 var(--font-mono);
  color: var(--text-muted);
}
.list-row:last-child { border-bottom: 0; }
.list-row .lr-main { font: 600 12px/1.3 var(--font-sans); color: var(--text-main); min-width: 0; }
.list-row .lr-sub { color: var(--text-faint); font: 500 10px/1.3 var(--font-mono); }
.cmp-link { display: block; padding: 12px; text-align: center; font: 700 12px/1 var(--font-sans); color: var(--accent-ui); }
.cmp-link:hover { color: var(--accent-ui-hover); }
.team-head .cmp-link { flex-shrink: 0; padding: 8px 0 8px 10px; }
.player-head { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 12px; }
.player-head img { width: 64px; height: 64px; border-radius: 8px; background: var(--bg-inset); object-fit: cover; flex-shrink: 0; }
.player-head .p-meta { min-width: 0; }
.player-head h1 { font: 800 20px/1.15 var(--font-sans); letter-spacing: -0.02em; }
.player-head .p-sub { font: 500 11px/1.5 var(--font-mono); color: var(--text-muted); margin-top: 4px; overflow-wrap: anywhere; }
.player-head .p-sub a { color: var(--accent-ui); font-weight: 700; }
.log { min-width: 520px; }
.log th.sticky-col, .log td.sticky-col {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--bg-card);
  text-align: left;
  min-width: 72px;
  box-shadow: 1px 0 0 var(--border-muted);
}
.log td.sticky-col { font: 600 11px/1.3 var(--font-mono); color: var(--text-main); }
.avg td:first-child { font: 700 11px/1.3 var(--font-sans); color: var(--text-main); }
.box td.player-col a:hover, .roster-row .name a:hover, .standings td.team a:hover { color: var(--accent-ui); }

/* ── Search, leaders, standings diffs, date picker ──────────────────────── */
.nba-search { position: relative; display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; max-width: 240px; }
.search-input {
  width: 100%;
  min-width: 0;
  font: 500 12px/1 var(--font-sans);
  color: var(--text-main);
  background: var(--bg-elevated);
  border: 1px solid var(--border-card);
  border-radius: 6px;
  padding: 8px 10px;
}
.search-input:focus { border-color: var(--border-strong); }
.search-toggle {
  display: none;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  font: 700 14px/1 var(--font-sans);
  color: var(--text-muted);
  background: var(--bg-elevated);
  border: 1px solid var(--border-card);
  border-radius: 6px;
  cursor: pointer;
}
.search-results {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  z-index: 30;
  margin: 0;
  padding: 4px;
  list-style: none;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 8px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
  max-height: 60vh;
  overflow-y: auto;
}
.search-results li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 6px;
  font: 600 12px/1.3 var(--font-sans);
  color: var(--text-main);
  cursor: pointer;
}
.search-results li[aria-selected='true'] { background: var(--bg-card-hover); }
.search-results img { width: 24px; height: 24px; border-radius: 999px; object-fit: cover; background: var(--bg-inset); }
.search-results .sr-team { margin-left: auto; font: 500 10px/1 var(--font-mono); color: var(--text-faint); }
.search-results .sr-empty { padding: 8px; font: 500 11px/1.4 var(--font-sans); color: var(--text-muted); }
.leader-row {
  display: grid;
  grid-template-columns: 20px 26px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--border-muted);
}
.leader-row:last-child { border-bottom: 0; }
.leader-row .rank { font: 700 10px/1 var(--font-mono); color: var(--text-faint); text-align: right; }
.leader-row img { width: 26px; height: 26px; border-radius: 999px; object-fit: cover; background: var(--bg-inset); }
.leader-row .who { min-width: 0; }
.leader-row .who a { font: 600 12px/1.3 var(--font-sans); color: var(--text-main); }
.leader-row .who a:hover { color: var(--accent-ui); }
.leader-row .team { font: 500 10px/1.2 var(--font-mono); color: var(--text-faint); }
.leader-row .val { text-align: right; font: 700 13px/1 var(--font-mono); color: var(--text-main); }
.leader-row .gp { font: 500 9px/1 var(--font-mono); color: var(--text-faint); }
.standings-switch { display: flex; gap: 6px; margin-bottom: 10px; }
.standings-switch a {
  font: 700 11px/1 var(--font-sans);
  letter-spacing: 0.04em;
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--border-card);
  color: var(--text-muted);
  background: var(--bg-elevated);
}
.standings-switch a:hover { color: var(--text-main); border-color: var(--border-strong); }
.standings-switch a[aria-current='page'] { color: var(--tab-active-text); background: var(--tab-active-bg); border-color: transparent; }
.standings td.diff-pos { color: var(--accent-ui); font-weight: 700; }
.standings td.diff-neg { color: var(--text-faint); }
.date-bar .date-pick {
  font: 600 11px/1 var(--font-mono);
  color: var(--text-main);
  background: var(--bg-elevated);
  border: 1px solid var(--border-card);
  border-radius: 6px;
  padding: 7px 6px;
  max-width: 132px;
}
@media (max-width: 560px) {
  .nba-header .search-input { display: none; }
  .search-toggle { display: inline-flex; }
  .nba-search { flex: 0 0 auto; max-width: none; }
  .nba-search.open {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    max-width: none;
    z-index: 30;
    padding: 8px 12px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border-card);
  }
  .nba-search.open .search-input { display: block; }
  .nba-search.open .search-results { left: 12px; right: 12px; }
  .leader-row { grid-template-columns: 18px 24px minmax(0, 1fr) auto; gap: 6px; }
  .leader-row .gp { display: none; }
  .ps-fields { grid-template-columns: 1fr; }
}
/* One row at 375px: prev, date, next and Today. The date field shrinks to a
   tappable calendar button instead of pushing the next arrow onto a new line. */
@media (max-width: 480px) {
  .date-bar { flex-wrap: nowrap; gap: 6px; padding: 8px; }
  .date-bar .nav { padding: 7px 8px; }
  .date-bar .day { flex: 1 1 auto; min-width: 0; }
  .date-bar .day strong { font-size: 12px; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .date-bar .day span { display: none; }
  .date-bar .date-pick {
    flex: 0 0 auto;
    width: 36px;
    min-width: 36px;
    max-width: 36px;
    padding: 7px 0;
    text-align: center;
    overflow: hidden;
  }
  .date-bar .date-pick::-webkit-datetime-edit { display: none; }
  .date-bar .date-pick::-webkit-calendar-picker-indicator { margin: 0 auto; }
}

/* ── Polish: card leaders, avatars, team stats, player compare ───────────── */
.game-leader {
  padding: 0 0 2px 32px;
  font: 500 10px/1.35 var(--font-mono);
  color: var(--text-faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.game-leader b { font-weight: 700; color: var(--text-muted); }
.avatar {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 999px;
  background: var(--bg-inset);
  overflow: hidden;
  flex-shrink: 0;
}
.avatar .avatar-ini { font: 700 9px/1 var(--font-mono); color: var(--text-muted); letter-spacing: 0.02em; }
.avatar img { position: absolute; inset: 0; width: 26px; height: 26px; object-fit: cover; background: var(--bg-inset); }
.team-stats { padding: 10px 12px; margin-bottom: 12px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat-lbl { font: 700 9px/1 var(--font-sans); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }
.stat-val { font: 700 14px/1 var(--font-mono); color: var(--text-main); }
.stat-val.diff-pos { color: var(--accent-ui); }
.ps-fields {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 8px;
  padding: 12px;
  margin-bottom: 12px;
}
.ps-field { position: relative; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.ps-field label {
  font: 700 10px/1 var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-faint);
}
.player-cmp-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  padding: 12px;
  margin-bottom: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 10px;
}
.player-cmp-head .ps-side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.player-cmp-head .ps-side.right { flex-direction: row-reverse; text-align: right; }
.player-cmp-head img { width: 44px; height: 44px; border-radius: 999px; object-fit: cover; background: var(--bg-inset); flex-shrink: 0; }
.player-cmp-head .ps-name { display: block; font: 700 14px/1.2 var(--font-sans); color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-cmp-head .ps-team { font: 500 10px/1.2 var(--font-mono); color: var(--text-faint); }
.player-head .cmp-link { flex-shrink: 0; padding: 8px 0 8px 10px; }

/* ── Scores: Inspector (ins-*) ──────────────────────────────────────────────
   Three columns on desktop (standings rail, dotted canvas of frames, panel for
   the selected game), canvas plus panel on tablets, frames only on phones. */
body.sc-wide .wrap { max-width: 1440px; }
.ins-shell { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
.ins-rail, .ins-panel { display: none; }
@media (min-width: 721px) {
  .ins-shell { grid-template-columns: minmax(0, 1fr) 280px; }
  .ins-panel { display: block; }
}
@media (min-width: 1100px) {
  .ins-shell { grid-template-columns: 224px minmax(0, 1fr) 292px; }
  .ins-rail { display: block; }
}
.ins-rail, .ins-panel {
  position: sticky;
  top: 96px;
  max-height: calc(100vh - 110px);
  overflow-y: auto;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 10px;
  box-shadow: var(--card-shadow);
}
.ins-ph {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 10px 12px 8px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border-muted);
  font: 700 11px/1.2 var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}
.ins-ph span { font: 500 10px/1.2 var(--font-mono); text-transform: none; letter-spacing: 0; color: var(--text-faint); }
.ins-grp { padding: 6px 0; }
.ins-grp + .ins-grp { border-top: 1px solid var(--border-muted); }
.ins-gh { padding: 4px 12px; font: 700 10px/1.2 var(--font-sans); letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-faint); }
.ins-lr {
  display: grid;
  grid-template-columns: 12px 34px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 4px 12px;
}
.ins-lr:hover { background: var(--bg-card-hover); }
.ins-lr.on { background: var(--accent-ui-subtle); }
.ins-lr .sw { width: 12px; height: 12px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16); }
.ins-lr .ab { font: 700 12px/1.2 var(--font-sans); }
.ins-lr .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 11px/1.2 var(--font-sans); color: var(--text-muted); }
.ins-lr .rc { font: 500 11px/1.2 var(--font-mono); color: var(--text-muted); font-variant-numeric: tabular-nums; }

.ins-canvas {
  min-width: 0;
  padding: 22px 22px 28px;
  background-color: var(--bg-inset);
  background-image: radial-gradient(#2a2e35 1px, transparent 1px);
  background-size: 16px 16px;
  background-position: -8px -8px;
  border: 1px solid var(--border-card);
  border-radius: 10px;
}
.ins-slate { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 22px 20px; align-items: start; }
.ins-frame {
  position: relative;
  z-index: 1;
  display: block;
  min-width: 0;
  cursor: pointer;
  outline: none;
  border-radius: 8px;
  transition: z-index 0s linear 0.28s;
}
.ins-frame:focus-visible .ins-fbody { outline: 2px solid var(--accent-ui); outline-offset: 3px; }
.ins-fl { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; white-space: nowrap; min-height: 12px; }
.ins-st {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  font: 700 10px/1 var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
}
.ins-st.live { color: var(--text-main); }
.ins-st .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; animation: pulse 1.1s ease-in-out infinite; flex-shrink: 0; }
.ins-odds { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 600 12px/1 var(--font-mono); color: var(--text-muted); }
.ins-odds b { font-weight: 800; color: var(--text-main); }
.ins-fwrap {
  position: relative;
  border-radius: 8px;
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), filter 0.25s ease-out;
}
.ins-fbody {
  border-radius: 8px;
  overflow: hidden;
  background: #000;
  display: grid;
  gap: 1px;
  transition: border-radius 0.25s ease-out;
}
.ins-band {
  position: relative;
  display: grid;
  gap: 8px;
  padding: 10px 12px 9px;
  overflow: hidden;
  transition: filter 0.25s ease-out;
}
.ins-band::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.18) 50%, transparent 70%);
  transform: translateX(-100%);
  transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
}
.ins-bh { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 9px; }
.ins-band .ab { font: 800 26px/1 var(--font-sans); letter-spacing: -0.03em; }
.ins-band .rc { min-width: 0; font: 600 11px/1 var(--font-mono); opacity: 0.88; }
.ins-band .sc { font: 700 34px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.ins-band.lost { filter: saturate(0.35) brightness(0.62); }
.ins-ld {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 3px 10px;
  padding-top: 7px;
  border-top: 1px solid rgba(255, 255, 255, 0.2);
  border-top: 1px solid color-mix(in srgb, currentColor 24%, transparent);
}
.ins-ld .cap { grid-column: 1 / -1; font: 700 9px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.72; }
.ins-ld .c { min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 5px; align-items: baseline; }
.ins-ld .lk { font: 700 9px/1 var(--font-sans); letter-spacing: 0.06em; opacity: 0.72; }
.ins-ld .c b { font: 700 13px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; }
.ins-ld .nm { grid-column: 1 / -1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 10.5px/1.25 var(--font-sans); opacity: 0.92; }
.ins-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
}
.ins-logo img { width: 22px; height: 22px; object-fit: contain; }
.ins-logo-none { background: rgba(255, 255, 255, 0.18); }
.ins-frame { cursor: pointer; }
.ins-frame.sel .ins-fbody { outline: 1.5px solid var(--accent-ui); outline-offset: 3px; }
.ins-frame:not(.sel):hover .ins-fbody { outline: 1px solid var(--border-strong); outline-offset: 3px; }

/* Detail drawer. Height animates 0fr to 1fr, so the content is never measured
   in JS. Wide screens lay it over what is below the frame (absolute, no reflow),
   phones push the list down instead. */
.ins-more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.26s cubic-bezier(0.22, 1, 0.36, 1); }
.ins-more-in { min-height: 0; overflow: hidden; visibility: hidden; transition: visibility 0s linear 0.26s; }
.ins-dt {
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-top: 0;
  border-radius: 0 0 8px 8px;
  padding: 10px 12px 0;
}
.ins-dg { display: grid; grid-template-columns: 38px minmax(0, 1fr) minmax(0, 1fr); gap: 6px 10px; align-items: baseline; }
.ins-dg .hd { padding-bottom: 4px; font: 800 12px/1 var(--font-sans); letter-spacing: -0.01em; color: var(--text-main); }
.ins-dg .dc { grid-column: 1 / -1; margin-top: 2px; font: 700 9px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }
.ins-dg .k { font: 700 9px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); }
.ins-dg .v { min-width: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font: 500 11px/1.25 var(--font-sans); color: var(--text-muted); }
.ins-dg .v span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ins-dg .v b { flex: none; font: 700 11px/1.25 var(--font-mono); color: var(--text-main); font-variant-numeric: tabular-nums; }
.ins-dg .v.rel b { color: var(--text-main); }
.ins-dg .v:not(.rel):not(.ld) b { color: var(--text-muted); font-weight: 600; }
.ins-dopen { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: 8px; font: 700 12px/1 var(--font-sans); color: var(--text-main); }
.ins-dopen:hover { border-color: var(--text-muted); background: var(--accent-ui-subtle); }
.ins-dopen:focus-visible { outline: 2px solid var(--accent-ui); outline-offset: -2px; border-radius: 0 0 8px 8px; }
.ins-frame.no-anim, .ins-frame.no-anim * { transition: none !important; }
@media (min-width: 721px) {
  .ins-more { position: absolute; left: 0; right: 0; top: 100%; z-index: 3; }
}

/* Expanded: pinned by tap or Enter on any device, by hover or keyboard focus
   where the device has a hover (and a canvas wide enough to overlay into). */
.ins-frame.open .ins-more {
  grid-template-rows: 1fr;
}
.ins-frame.open .ins-more-in {
  visibility: visible;
  transition-delay: 0s;
}
.ins-frame.open .ins-band {
  filter: brightness(1.1);
}
.ins-frame.open .ins-band.lost {
  filter: saturate(0.85) brightness(0.9);
}
.ins-frame.open .ins-fbody {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}
.ins-frame.open .ins-fwrap {
  filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.55));
}
.ins-frame.open {
  z-index: 6;
  transition-delay: 0s;
}
@media (hover: hover) and (min-width: 721px) {
  .ins-frame:hover .ins-more,
  .ins-frame:focus-visible .ins-more {
    grid-template-rows: 1fr;
  }
  .ins-frame:hover .ins-more-in,
  .ins-frame:focus-visible .ins-more-in {
    visibility: visible;
    transition-delay: 0s;
  }
  .ins-frame:hover .ins-band,
  .ins-frame:focus-visible .ins-band {
    filter: brightness(1.1);
  }
  .ins-frame:hover .ins-band.lost,
  .ins-frame:focus-visible .ins-band.lost {
    filter: saturate(0.85) brightness(0.9);
  }
  .ins-frame:hover .ins-fbody,
  .ins-frame:focus-visible .ins-fbody {

.standings-block .st-sort:focus-visible { outline: 2px solid var(--accent-ui); outline-offset: 3px; border-radius: 2px; }

/* ── Standings: Mosaic (mz-*) ───────────────────────────────────────────── */
.mz { padding: 12px; margin-bottom: 12px; }
.mz-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

  font: 700 11px/1 var(--font-sans);
  color: var(--text-muted);

  border: 0;
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
}
.mz-ctrl button:hover { color: var(--text-main); }
.mz-ctrl button[aria-pressed='true'] { background: var(--tab-active-bg); color: var(--tab-active-text); }

@media (max-width: 480px) {

/* ── Game page (gm-*) ─────────────────────────────────────────────────────
   Scorebug header, tale of the tape, leaders and market blocks. The page keeps
   its dark chrome; team colours carry the colour. Gold stays on tabs. */
body.gm-wide .wrap { max-width: 1240px; }
.gm-bug {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(190px, 250px) minmax(0, 1fr);
  grid-template-areas: 'away mid home';
  margin-bottom: 12px;
  border: 1px solid var(--border-card);
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg-card);
}
.gm-team {
  display: grid;

  min-width: 0;
  padding: 22px 24px;
}

.gm-team.sc.home { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: 'sc id' 'sc nm' 'sc rc'; column-gap: 14px; }
.gm-id { grid-area: id; display: flex; align-items: center; gap: 12px; min-width: 0; }

}

.gm-ab { font: 900 clamp(40px, 5vw, 66px)/0.9 'Archivo', var(--font-sans); letter-spacing: -0.03em; text-transform: uppercase; }
.gm-nm { grid-area: nm; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 13px/1.2 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; }
.gm-rec { grid-area: rc; min-width: 0; font: 600 12px/1.2 var(--font-mono); opacity: 0.88; }
.gm-rec i { margin-left: 8px; font-style: normal; opacity: 0.8; }
.gm-sc { grid-area: sc; align-self: center; font: 700 clamp(44px, 6vw, 76px)/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
.gm-team.lost .gm-sc { opacity: 0.6; }
.gm-team:focus-visible { outline-offset: -3px; }
.gm-mid {
  grid-area: mid;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 0;
  padding: 16px 14px;
  text-align: center;
  font: 500 12px/1.3 var(--font-mono);
  color: var(--text-muted);
}
.gm-day { font: 700 10px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }
.gm-st { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font: 800 19px/1.15 var(--font-sans); letter-spacing: -0.01em; color: var(--text-main); text-wrap: balance; }
.gm-st .dot { flex: none; width: 7px; height: 7px; border-radius: 999px; background: currentColor; animation: pulse 1.1s ease-in-out infinite; }
.gm-meta { max-width: 100%; overflow-wrap: anywhere; }
.gm-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px 10px;
  width: 100%;
  margin-top: 3px;
  padding-top: 10px;
  border-top: 1px solid var(--border-muted);
  font: 600 12px/1.2 var(--font-mono);
  color: var(--text-muted);
}
.gm-line b { font-weight: 800; color: var(--text-main); }
.gm-live { margin: -4px 0 12px; font: 500 10px/1 var(--font-mono); letter-spacing: 0.04em; color: var(--text-faint); text-align: center; }

.gm-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; margin-bottom: 12px; }
.gm-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.gm-card { min-width: 0; padding: 14px 16px 16px; }
.gm-ch { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.gm-ch span { font: 500 10px/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint); }
.gm-abbr { font: 900 15px/1 'Archivo', var(--font-sans); letter-spacing: -0.01em; }

.gm-sh { margin: 4px 0 10px; }
.gm-none { padding: 8px 0; font: 500 11px/1.4 var(--font-sans); color: var(--text-faint); }

/* Tale of the tape. Values on the outside, bars grow from the centre. */
.gm-th { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: baseline; gap: 10px; margin-bottom: 8px; }
.gm-th .b { text-align: right; }
.gm-tr {
  display: grid;
  grid-template-columns: 62px minmax(0, 1fr) 78px minmax(0, 1fr) 62px;
  align-items: center;
  column-gap: 8px;
  padding: 7px 0;
  border-top: 1px solid var(--border-muted);
}
.gm-v { display: flex; flex-direction: column; gap: 2px; font: 700 17px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-faint); }
.gm-v.a { align-items: flex-start; text-align: left; }
.gm-v.b { align-items: flex-end; text-align: right; }
.gm-v.lead { color: var(--text-main); }
.gm-v small { font: 500 10px/1.1 var(--font-mono); color: var(--text-faint); }
.gm-k { text-align: center; font: 700 10px/1.2 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
.gm-bar { display: flex; height: 12px; border-radius: 2px; background: var(--bg-inset); overflow: hidden; }
.gm-bar.a { justify-content: flex-end; }
.gm-bar i { display: block; height: 100%; border-radius: 2px; opacity: 0.6; }
.gm-bar.lead i { opacity: 1; }

/* Leaders */
.gm-ld { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.gm-lcol, .gm-icol, .gm-l5c { min-width: 0; }
.gm-lh { display: flex; align-items: baseline; gap: 8px; min-width: 0; padding-bottom: 7px; border-bottom: 3px solid var(--c); }
.gm-lh > span:not(.gm-abbr) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 11px/1 var(--font-sans); color: var(--text-faint); }
.gm-lr { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-muted); }
.gm-lr:last-child { border-bottom: 0; }
.gm-hs { width: 44px; height: 44px; border-radius: 999px; overflow: hidden; background: var(--bg-inset); background: color-mix(in srgb, var(--c) 38%, var(--bg-inset)); }
.gm-hs img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
.gm-lw { min-width: 0; }
.gm-ln, .gm-ls { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gm-ln { font: 700 13px/1.25 var(--font-sans); color: var(--text-main); }
.gm-ln a:hover { text-decoration: underline; }
.gm-ls { margin-top: 2px; font: 500 10px/1.3 var(--font-mono); color: var(--text-faint); }
.gm-lv { text-align: right; }
.gm-lv b { display: block; font: 700 22px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-main); }
.gm-lv i { display: block; margin-top: 3px; font: 700 9px/1 var(--font-sans); font-style: normal; letter-spacing: 0.08em; color: var(--text-faint); }

/* Line score */
.gm-ls-wrap { overflow-x: auto; }
.gm-lsc { width: 100%; border-collapse: collapse; font: 600 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.gm-lsc th, .gm-lsc td { padding: 8px 6px; text-align: center; color: var(--text-muted); }
.gm-lsc thead th { font: 700 10px/1 var(--font-sans); letter-spacing: 0.06em; color: var(--text-faint); }
.gm-lsc th.tm { display: flex; align-items: center; gap: 8px; text-align: left; font: 800 13px/1 var(--font-sans); color: var(--text-main); }
.gm-lsc .sw { width: 10px; height: 10px; border-radius: 2px; }
.gm-lsc .t { color: var(--text-main); font-weight: 800; }
.gm-lsc tbody tr { border-top: 1px solid var(--border-muted); }

/* Season series and last five */
.gm-sr { display: grid; grid-template-columns: 86px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border-muted); font: 500 11px/1.3 var(--font-mono); color: var(--text-muted); }
.gm-sr:last-child { border-bottom: 0; }
.gm-sr:hover { color: var(--text-main); }
.gm-sr.now .d { color: var(--text-main); font-weight: 700; }
.gm-sr .m { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.gm-sr .m i { font-style: normal; color: var(--text-faint); }
.gm-sr .r { font-weight: 700; }
.gm-sr .r.up { color: var(--text-faint); font-weight: 500; }
.gm-st2 { font: 700 12px/1.3 var(--font-mono); color: var(--text-muted); white-space: nowrap; }
.gm-st2.w { color: var(--text-main); }
.gm-st2.l { color: var(--text-faint); font-weight: 500; }
.gm-l5 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.gm-chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.gm-g { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; padding: 7px 2px 6px; border-top: 2px solid var(--border-strong); border-radius: 4px; background: var(--bg-inset); text-align: center; font: 500 9px/1.2 var(--font-mono); color: var(--text-faint); }
.gm-g > * { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gm-g b { font: 800 14px/1 var(--font-sans); }
.gm-g.W { border-top-color: var(--accent-positive); }
.gm-g.W b { color: var(--accent-positive); }
.gm-g.L { border-top-color: var(--accent-negative); }
.gm-g.L b { color: var(--accent-negative); }
.gm-g:hover { background: var(--bg-card-hover); }
.gm-g .dt { opacity: 0.8; }

/* Odds, win chance, injuries, ATS */
.gm-og { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); align-items: center; }
.gm-og > span { padding: 9px 0; border-top: 1px solid var(--border-muted); }
.gm-og > .h, .gm-og > .gm-ok:first-child { padding-top: 0; border-top: 0; }
.gm-ok { padding-right: 14px; font: 700 10px/1.2 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
.gm-ov { text-align: right; }
.gm-ov b { display: block; font: 700 15px/1.15 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-main); }
.gm-ov b.none { color: var(--text-faint); }
.gm-ov small { display: block; margin-top: 2px; font: 500 10px/1.2 var(--font-mono); color: var(--text-faint); }

.gm-sx { padding: 3px 6px; border: 1px solid var(--border-strong); border-radius: 4px; font: 700 9px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); white-space: nowrap; }
.gm-sx.out { border-color: rgba(232, 135, 124, 0.45); background: var(--accent-negative-bg); color: var(--accent-negative); }
.gm-idt { grid-column: 1 / -1; font: 500 10px/1.3 var(--font-mono); color: var(--text-faint); }

  .gm-line { width: auto; margin: 0; padding: 0; border-top: 0; }

  .gm-tr { grid-template-columns: 50px minmax(0, 1fr) 52px minmax(0, 1fr) 50px; column-gap: 6px; }

<header class="nba-header">

    </a>

    </nav>
  </div>
</header>

<main class="wrap">
  <div id="app" tabindex="-1">
    <div class="state"><span class="pulse"></span>Loading…</div>
  </div>
</main>

<script type="module">
import {
  barShares,
  contrastRatio,
  etDate,
  parseAthlete,
  parseBoxScore,
  parseGameExtras,
  parseGameLog,
  parseLeaders,
  parsePlayerOverview,
  parsePreGame,
  parseRoster,
  parseScoreboard,
  parseSearch,
  parseStandings,
  parseTeamSchedule,
  parseTeams,
  parseTeamStats,
  readableOn,
  smallImg,
  teamFill,
  textOn,
} from './nba.js';

const API = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const STANDINGS_API = 'https://site.api.espn.com/apis/v2/sports/basketball/nba/standings';
const SEARCH_API = 'https://site.web.api.espn.com/apis/common/v3/search?query=';
const POLL_MS = 30000;
const COLUMNS = ['MIN', 'PTS', 'FG', '3PT', 'FT', 'REB', 'AST', 'TO', 'STL', 'BLK', 'PF', '+/-'];

const app = document.getElementById('app');
// A headshot that fails to load is dropped; the tinted circle behind it stays.
app.addEventListener('error', (event) => {
  const img = event.target;
  if (img && img.tagName === 'IMG' && img.classList.contains('gm-hsimg')) img.remove();
}, true);
let requestId = 0;
let pollTimer = 0;
let gameTimer = 0;
// Debounce timers owned by the player-compare pickers. Every hash change runs
// stopPolling(), which closes them, so a pending callback can never write into
// a node that a re-render already replaced.
let pickerClosers = [];

const SITE = 'Matchup Board';
const DEFAULT_TITLE = SITE + ' · NBA scores, matchups and stats';
let currentTitle = '';

// Tabs, history and shared links get the view's name once its data has loaded;
// the default title stays put while a view is still fetching.
function setTitle(text) {
  const next = text ? text + ' · ' + SITE : DEFAULT_TITLE;
  if (next === currentTitle) return;
  currentTitle = next;
  if (typeof document !== 'undefined' && document) document.title = next;
}

function lastName(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  while (parts.length > 1 && /^(jr|sr|ii|iii|iv|v)$/i.test(parts[parts.length - 1])) parts.pop();
  return parts[parts.length - 1] || '';
}

const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ESCAPES[ch]);

function stopPolling() {
  if (pollTimer) {
    clearTimeout(pollTimer);
    pollTimer = 0;
  }
  if (gameTimer) {
    clearTimeout(gameTimer);
    gameTimer = 0;
  }
  pickerClosers.forEach((close) => close());
  pickerClosers = [];
}

function loadingHTML() {
  return '<div class="state"><span class="pulse"></span>Loading…</div>';
}

function showError(retry) {
  app.innerHTML = '<div class="state"><span>Couldn\'t reach ESPN.</span><button class="retry" type="button">Retry</button></div>';
  app.querySelector('.retry').addEventListener('click', retry);
}

async function fetchJSON(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('ESPN HTTP ' + res.status);
  return res.json();
}

function parseHash() {
  const raw = (location.hash || '').replace(/^#/, '');
  const parts = raw.split('/').filter(Boolean);
  return { view: parts[0] || 'scores', arg: parts[1] || '', args: parts.slice(1) };
}

/* ── Dates ──────────────────────────────────────────────────────────────── */
function todayET() {
  return etDate(new Date());
}

function isoOfDay(yyyymmdd) {
  return yyyymmdd.slice(0, 4) + '-' + yyyymmdd.slice(4, 6) + '-' + yyyymmdd.slice(6, 8) + 'T12:00:00Z';
}

function isValidDay(value) {
  return /^\d{8}$/.test(String(value || ''));
}

function shiftDay(yyyymmdd, offset) {
  const day = new Date(isoOfDay(yyyymmdd));
  day.setUTCDate(day.getUTCDate() + offset);
  const y = day.getUTCFullYear();
  const m = String(day.getUTCMonth() + 1).padStart(2, '0');
  const d = String(day.getUTCDate()).padStart(2, '0');
  return y + m + d;
}

function formatDay(yyyymmdd) {
  const day = new Date(isoOfDay(yyyymmdd));
  if (Number.isNaN(day.getTime())) return yyyymmdd;
  return day.toLocaleDateString('en-US', {
    timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric',
  });
}

function formatWhen(iso) {
  const day = new Date(iso);
  if (Number.isNaN(day.getTime())) return '';
  return day.toLocaleString('en-US', {
    timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit',
  }) + ' ET';
}

function formatPct(pct) {
  if (pct == null || Number.isNaN(pct)) return '—';
  if (pct >= 1) return '1.000';
  return '.' + String(Math.round(pct * 1000)).padStart(3, '0');
}

/* ── Scores ─────────────────────────────────────────────────────────────── */
/* Inspector layout: team colours, standings rail, selected-game panel. Colours
   come from the ESPN teams endpoint, fetched once per page load. A failed fetch
   is not cached (the next view retries) and leaves teams a neutral grey. */
// ponytail: static snapshot, ESPN /teams has no CORS header. Refresh by hand on a rebrand.
const TEAMS_API = '/nba/teams.json';
const PAGE_BG = '#0d0d0f';
const PANEL_BG = '#161618';
let teamColorsPromise = null;

function getTeamColors() {
  if (!teamColorsPromise) {
    teamColorsPromise = fetchJSON(TEAMS_API).then(parseTeams).catch(() => {
      teamColorsPromise = null;
      return { byAbbr: {}, byId: {} };
    });
  }
  return teamColorsPromise;
}

// Fill, text colour and logo for one team. `colors` is the parseTeams result.
function teamLook(colors, abbr, id, logo) {
  const entry = (colors && (colors.byAbbr[abbr] || colors.byId[String(id)])) || {};
  const fill = teamFill(entry, PAGE_BG);
  return { fill: fill.fill, ink: fill.ink, usedAlt: fill.usedAlt, logo: logo || entry.logo || '' };
}

function tipOff(iso) {
  const day = new Date(iso);
  if (Number.isNaN(day.getTime())) return '';
  return day.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' }) + ' ET';
}

function recordText(row, side) {
  if (row && row.wins != null && row.losses != null) return row.wins + '-' + row.losses;
  return (side && side.record) || '';
}

const LEADER_ROWS = [['PTS', 'pts'], ['REB', 'reb'], ['AST', 'ast']];

// Season per-game leaders before tip-off, the game's own counts once it starts.
// Past days are not "tonight", so a finished game from another day says so.
function leaderCaption(kind, game) {
  if (kind === 'season') return 'Season avg';
  if (game.state === 'in' || etDate(game.startISO) === todayET()) return 'Tonight';
  return 'In this game';
}

function insBandHTML(side, game, colors) {
  const state = game.state;
  const look = teamLook(colors, side.abbr, side.id, side.logo);
  const lost = state === 'post' && !side.winner;
  const logo = look.logo
    ? '<span class="ins-logo"><img src="' + esc(smallImg(look.logo, 56, 56)) + '" alt="" width="22" height="22" decoding="async"></span>'
    : '<span class="ins-logo ins-logo-none"></span>';
  const score = state === 'pre' || side.score == null ? '' : esc(side.score);
  const lead = side.leaders;
  const cells = lead
    ? LEADER_ROWS.filter(([, key]) => lead[key]).map(([label, key]) =>
      '<span class="c"><span class="lk">' + label + '</span><b>' + esc(lead[key].value) + '</b><span class="nm">' + esc(lead[key].short) + '</span></span>').join('')
    : '';
  return '<div class="ins-band' + (lost ? ' lost' : '') + '" style="background:' + look.fill + ';color:' + look.ink + '">' +
    '<div class="ins-bh">' + logo + '<span class="ab">' + esc(side.abbr) + '</span>' +
    '<span class="rc">' + esc(side.record) + '</span><span class="sc">' + score + '</span></div>' +
    (cells ? '<div class="ins-ld"><span class="cap">' + esc(leaderCaption(lead.kind, game)) + '</span>' + cells + '</div>' : '') + '</div>';
}

function oddsHeadHTML(game) {
  const odds = game.odds;
  if (odds) {
    const parts = [];
    if (odds.details) parts.push('<b>' + esc(odds.details) + '</b>');
    if (odds.total != null) parts.push('O/U ' + esc(odds.total));
    if (parts.length) return '<span class="ins-odds">' + parts.join(' · ') + '</span>';
  }
  return game.broadcast ? '<span class="ins-odds">' + esc(game.broadcast) + '</span>' : '';
}

// The drawer under a frame: both teams' full leader lines, the moneyline,
// home/road records, then last 10 and streak from the standings payload.
function insDetailHTML(game, standings, colors) {
  const sides = [game.away, game.home].map((side) => ({
    side,
    row: standings ? standingFor(standings, side.id) : null,
    look: teamLook(colors, side.abbr, side.id, side.logo),
  }));
  const [A, H] = sides;
  const cell = (inner, cls) => '<span class="v' + (cls ? ' ' + cls : '') + '">' + inner + '</span>';
  const rowHTML = (label, a, b) => (a || b)
    ? '<span class="k">' + esc(label) + '</span>' + (a || cell('<span>—</span>')) + (b || cell('<span>—</span>'))
    : '';
  const plain = (value) => (value ? cell('<b>' + esc(value) + '</b>') : '');

  const heads = '<span class="hd"></span>' + sides.map((t) =>
    '<span class="hd" style="box-shadow:inset 0 -2px 0 ' + t.look.fill + '">' + esc(t.side.abbr) + '</span>').join('');

  const leadLines = LEADER_ROWS.map(([label, key]) => {
    const one = (t) => (t.side.leaders && t.side.leaders[key]
      ? cell('<span>' + esc(t.side.leaders[key].name) + '</span><b>' + esc(t.side.leaders[key].value) + '</b>', 'ld')
      : '');
    return rowHTML(label, one(A), one(H));
  }).join('');
  const kind = (A.side.leaders && A.side.leaders.kind) || (H.side.leaders && H.side.leaders.kind) || '';
  const leadCap = leadLines ? '<span class="dc">Leaders · ' + esc(leaderCaption(kind, game).toLowerCase()) + '</span>' : '';

  const ml = game.odds && game.odds.moneyline ? rowHTML('ML', plain(game.odds.moneyline.away), plain(game.odds.moneyline.home)) : '';
  const road = rowHTML('Road', A.side.roadRecord ? cell('<b>' + esc(A.side.roadRecord) + '</b>', 'rel') : '', H.side.roadRecord ? plain(H.side.roadRecord) : '');
  const home = rowHTML('Home', A.side.homeRecord ? plain(A.side.homeRecord) : '', H.side.homeRecord ? cell('<b>' + esc(H.side.homeRecord) + '</b>', 'rel') : '');
  const l10 = rowHTML('L10', plain(A.row && A.row.last10), plain(H.row && H.row.last10));
  const strk = rowHTML('STRK', plain(A.row && A.row.streak), plain(H.row && H.row.streak));
  const recCap = road || home ? '<span class="dc">Records</span>' : '';
  const formCap = l10 || strk ? '<span class="dc">Form</span>' : '';
  const mlCap = ml ? '<span class="dc">Moneyline</span>' : '';

  return '<div class="ins-more"><div class="ins-more-in"><div class="ins-dt"><div class="ins-dg">' +
    heads + leadCap + leadLines + mlCap + ml + recCap + road + home + formCap + l10 + strk +
    '</div><a class="ins-dopen" href="#game/' + esc(game.id) + '"><span>Game details</span><span aria-hidden="true">→</span></a></div></div></div>';
}

function gameCardHTML(game, colors, selected, standings) {
  const live = game.state === 'in';
  const status = game.state === 'pre' ? tipOff(game.startISO) || 'Scheduled' : (game.statusText || 'Final');
  return '<div class="ins-frame' + (selected ? ' sel' : '') + '" role="group" tabindex="0" data-game="' + esc(game.id) + '"' +
    (selected ? ' aria-current="true"' : '') +
    ' aria-label="' + esc(game.away.name + ' at ' + game.home.name) + '">' +
    '<div class="ins-fl"><span class="ins-st' + (live ? ' live' : '') + '">' + (live ? '<i class="dot"></i>' : '') + esc(status) + '</span>' +
    oddsHeadHTML(game) + '</div>' +
    '<div class="ins-fwrap"><div class="ins-fbody">' + insBandHTML(game.away, game, colors) + insBandHTML(game.home, game, colors) + '</div>' +
    
    insDetailHTML(game, standings, colors) + '</div></div>';
}

function insRailHTML(standings, colors, game) {
  if (!standings) return '';
  const active = new Set(game ? [game.away.id, game.home.id] : []);
  const group = (title, rows) => '<div class="ins-grp"><div class="ins-gh">' + esc(title) + '</div>' + rows.map((row) => {
    const look = teamLook(colors, row.abbr, row.teamId, row.logo);
    const rec = row.wins != null && row.losses != null ? row.wins + '-' + row.losses : '—';
    return '<a class="ins-lr' + (active.has(row.teamId) ? ' on' : '') + '" href="#team/' + esc(row.teamId) + '" data-team="' + esc(row.teamId) + '" title="' + esc(row.name) + '">' +
      '<span class="sw" style="background:' + look.fill + '"></span><span class="ab">' + esc(row.abbr) + '</span>' +
      '<span class="nm">' + esc(row.name) + '</span><span class="rc">' + esc(rec) + '</span></a>';
  }).join('') + '</div>';
  return '<div class="ins-ph">Standings</div>' + group('Eastern Conference', standings.East) + group('Western Conference', standings.West);
}

function insRow(label, a, b, better) {
  // better: 'a', 'b' or '' for the side that leads on this line.
  return '<span class="k">' + esc(label) + '</span>' +
    '<b class="' + (better === 'a' ? 'lead' : '') + '">' + esc(a) + '</b>' +
    '<b class="' + (better === 'b' ? 'lead' : '') + '">' + esc(b) + '</b>';
}

function leadSide(a, b, lower) {
  if (a == null || b == null || a === b) return '';
  return (lower ? a < b : a > b) ? 'a' : 'b';
}

function insPanelHTML(game, standings, colors) {
  if (!game) return '<div class="ins-ph">Inspector</div><p class="ins-foot">Pick a game.</p>';
  const rowOf = (side) => (standings ? [...standings.East, ...standings.West].find((r) => r.teamId === side.id) || null : null);
  const A = { side: game.away, row: rowOf(game.away), look: teamLook(colors, game.away.abbr, game.away.id, game.away.logo) };
  const H = { side: game.home, row: rowOf(game.home), look: teamLook(colors, game.home.abbr, game.home.id, game.home.logo) };
  const started = game.state !== 'pre';
  const status = game.state === 'pre' ? 'Scheduled' : (game.statusText || '');
  const pctA = A.row && A.row.pct != null ? A.row.pct : null;
  const pctH = H.row && H.row.pct != null ? H.row.pct : null;

  const vs = '<div class="ins-ib"><div class="ins-vs">' +
    '<div class="t"><b style="color:' + readableOn(A.look.fill, PANEL_BG) + '">' + esc(game.away.abbr) + '</b><span>' + esc(game.away.name) + '</span></div>' +
    '<span class="at">at</span>' +
    '<div class="t r"><b style="color:' + readableOn(H.look.fill, PANEL_BG) + '">' + esc(game.home.abbr) + '</b><span>' + esc(game.home.name) + '</span></div></div>' +
    (started ? '<div class="ins-score"><span>' + (game.away.score == null ? '' : esc(game.away.score)) + '</span><span></span><span>' + (game.home.score == null ? '' : esc(game.home.score)) + '</span></div>' : '') +
    (pctA != null && pctH != null && pctA + pctH > 0
      ? '<div class="ins-meter" title="Win percentage"><span style="flex:' + (pctA || 0.01) + ';background:' + A.look.fill + '"></span><span style="flex:' + (pctH || 0.01) + ';background:' + H.look.fill + '"></span></div>' +
        '<div class="ins-meter-cap"><span>' + esc(pctA.toFixed(3).replace(/^0/, '')) + '</span><i>WIN %</i><span>' + esc(pctH.toFixed(3).replace(/^0/, '')) + '</span></div>'
      : '') + '</div>';

  const dA = A.row ? pointDiff(A.row) : null;
  const dH = H.row ? pointDiff(H.row) : null;
  const winA = A.row ? A.row.pct : null;
  const winH = H.row ? H.row.pct : null;
  const rows = [];
  const recA = recordText(A.row, game.away);
  const recH = recordText(H.row, game.home);
  if (recA || recH) rows.push(insRow('Record', recA || '—', recH || '—', leadSide(winA, winH)));
  if (winA != null || winH != null) rows.push(insRow('Win %', formatPct(winA), formatPct(winH), leadSide(winA, winH)));
  if ((A.row && A.row.ppg != null) || (H.row && H.row.ppg != null)) rows.push(insRow('PPG', oneDecimal(A.row && A.row.ppg), oneDecimal(H.row && H.row.ppg), leadSide(A.row && A.row.ppg, H.row && H.row.ppg)));
  if ((A.row && A.row.oppPpg != null) || (H.row && H.row.oppPpg != null)) rows.push(insRow('Opp PPG', oneDecimal(A.row && A.row.oppPpg), oneDecimal(H.row && H.row.oppPpg), leadSide(A.row && A.row.oppPpg, H.row && H.row.oppPpg, true)));
  if (dA != null || dH != null) rows.push(insRow('Diff', signedDecimal(dA), signedDecimal(dH), leadSide(dA, dH)));
  if ((A.row && A.row.streak) || (H.row && H.row.streak)) rows.push(insRow('Streak', (A.row && A.row.streak) || '—', (H.row && H.row.streak) || '—', ''));
  if ((A.row && A.row.last10) || (H.row && H.row.last10)) rows.push(insRow('Last 10', (A.row && A.row.last10) || '—', (H.row && H.row.last10) || '—', ''));
  const season = rows.length
    ? '<div class="ins-ib"><h3>Season</h3><div class="ins-kv"><span class="k"></span><b class="hd">' + esc(game.away.abbr) + '</b><b class="hd">' + esc(game.home.abbr) + '</b>' + rows.join('') + '</div></div>'
    : '';

  const when = formatWhen(game.startISO);
  const tip = '<div class="ins-ib"><h3>Tip-off</h3><div class="ins-kv ins-kv2">' +
    (status ? '<span class="k">Status</span><b>' + esc(status) + '</b>' : '') +
    (when ? '<span class="k">When</span><b>' + esc(when) + '</b>' : '') +
    (game.venue ? '<span class="k">Where</span><b class="sans">' + esc(game.venue) + '</b>' : '') +
    (game.broadcast ? '<span class="k">TV</span><b class="sans">' + esc(game.broadcast) + '</b>' : '') + '</div></div>';

  const lead = game.leaders && game.state !== 'pre' && (game.leaders.away || game.leaders.home)
    ? '<div class="ins-ib"><h3>Leading scorers</h3><div class="ins-kv ins-kv2">' +
      [[game.away, game.leaders.away], [game.home, game.leaders.home]].filter(([, l]) => l && l.name).map(([side, l]) =>
        '<span class="k">' + esc(side.abbr) + '</span><b class="sans">' + esc(l.name) + ' ' + esc(l.line) + '</b>').join('') + '</div></div>'
    : '';

  return '<div class="ins-ph">Inspector<span>' + esc(status) + '</span></div>' + vs + season + tip + lead +
    '<a class="ins-open" href="#game/' + esc(game.id) + '"><span>Game details</span><span aria-hidden="true">→</span></a>' +
    (season ? '<p class="ins-foot">Records and averages are season to date from the ESPN standings.</p>' : '');
}

// The selected game survives live polling: each refresh re-renders the view
// but keeps this id while the game is still on the slate.
let scSelected = '';
let scState = null;

function scheduleScoresPoll(date, games) {
  if (!games.some((game) => game.state === 'in')) return;
  pollTimer = setTimeout(() => {
    const route = parseHash();
    if (route.view === 'scores' && (route.arg || todayET()) === date) showScores(date, true);
  }, POLL_MS);
}

function selectGame(id) {
  if (!scState) return;
  const game = scState.games.find((entry) => entry.id === id);
  if (!game) return;
  scSelected = id;
  app.querySelectorAll('.ins-frame').forEach((frame) => {
    const on = frame.getAttribute('data-game') === id;
    frame.classList.toggle('sel', on);
    if (on) frame.setAttribute('aria-current', 'true');
    else frame.removeAttribute('aria-current');
  });
  const panel = document.getElementById('insPanel');
  if (panel) panel.innerHTML = insPanelHTML(game, scState.standings, scState.colors);
  const active = new Set([game.away.id, game.home.id]);
  app.querySelectorAll('.ins-lr').forEach((row) => row.classList.toggle('on', active.has(row.getAttribute('data-team'))));
}

let scOpen = '';

function wireInspector() {
  const slate = document.getElementById('insSlate');
  if (!slate) return;
  const narrow = () => window.matchMedia('(max-width: 720px)').matches;
  const hovers = () => window.matchMedia('(hover: hover)').matches;
  const idOf = (frame) => frame.getAttribute('data-game');

  // One frame is pinned open at a time: a tap or Enter pins it, the same again
  // (or Escape, or another frame) lets it go.
  function setOpen(frame, on) {
    slate.querySelectorAll('.ins-frame.open').forEach((other) => { if (other !== frame) other.classList.remove('open'); });
    frame.classList.toggle('open', on);
    scOpen = on ? idOf(frame) : '';
  }

  slate.addEventListener('click', (event) => {
    // "Open game" and any other link inside the drawer navigate as normal.
    if (event.target.closest('a')) return;
    const frame = event.target.closest('.ins-frame');
    if (!frame) return;
    if (!narrow()) selectGame(idOf(frame));
    // Touch has no hover: the first tap expands the frame.
    if (!hovers() || narrow()) setOpen(frame, !frame.classList.contains('open'));
  });

  slate.addEventListener('keydown', (event) => {
    const frame = event.target.closest('.ins-frame');
    if (!frame || event.target !== frame) return;
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      if (!narrow()) selectGame(idOf(frame));
      setOpen(frame, !frame.classList.contains('open'));
    } else if (event.key === 'Escape') {
      setOpen(frame, false);
      frame.blur();
    }
  });
}

async function showScores(dateArg, isRefresh = false) {
  stopPolling();
  const token = ++requestId;
  const date = isValidDay(dateArg) ? dateArg : todayET();
  if (!isRefresh) app.innerHTML = loadingHTML();

  // A pointer resting on a frame (or a frame holding keyboard focus) is mid
  // animation; swapping the DOM under it would replay the expand. Wait a beat.
  if (isRefresh && app.querySelector('.ins-frame:hover, .ins-frame:focus-visible')) {
    pollTimer = setTimeout(() => {
      const route = parseHash();
      if (route.view === 'scores' && (route.arg || todayET()) === date) showScores(date, true);
    }, 4000);
    return;
  }

  let games;
  let standings;
  let colors;
  try {
    // Standings and colours are extras: either failing leaves the scores intact.
    [games, standings, colors] = await Promise.all([
      fetchJSON(API + '/scoreboard?dates=' + date).then(parseScoreboard),
      getStandingsFresh(TEAM_TTL).catch(() => standingsCache),
      getTeamColors(),
    ]);
  } catch (err) {
    if (token === requestId) {
      if (!isRefresh) {
        showError(() => showScores(date));
      } else {
        pollTimer = setTimeout(() => {
          const route = parseHash();
          if (route.view === 'scores' && (route.arg || todayET()) === date) showScores(date, true);
        }, POLL_MS);
      }
    }
    return;
  }
  if (token !== requestId) return;

  const order = { in: 0, pre: 1, post: 2 };
  const sorted = games.slice().sort((a, b) => (order[a.state] ?? 3) - (order[b.state] ?? 3));

  // Keep the pick while its game is still listed; otherwise the first live
  // game, else the first game on the slate.
  if (!sorted.some((game) => game.id === scSelected)) scSelected = sorted.length ? sorted[0].id : '';
  if (!isRefresh || !sorted.some((game) => game.id === scOpen)) scOpen = '';
  scState = { games: sorted, standings, colors };
  const selectedGame = sorted.find((game) => game.id === scSelected) || null;

  setTitle('NBA Scores · ' + formatDay(date));

  const scrollY = isRefresh ? window.scrollY : 0;
  const hadFocus = isRefresh && document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('ins-frame')
    ? document.activeElement.getAttribute('data-game') : '';
  app.innerHTML = dateBarHTML(date) + (sorted.length
    ? '<div class="ins-shell">' +
      '<aside class="ins-rail" aria-label="Standings by conference">' + insRailHTML(standings, colors, selectedGame) + '</aside>' +
      '<section class="ins-canvas" aria-label="Games"><div class="ins-slate" id="insSlate">' +
      sorted.map((game) => gameCardHTML(game, colors, game.id === scSelected, standings)).join('') + '</div></section>' +
      '<aside class="ins-panel" id="insPanel" aria-label="Game inspector">' + insPanelHTML(selectedGame, standings, colors) + '</aside></div>'
    : '<div class="state">No games</div>');
  if (isRefresh) window.scrollTo(0, scrollY);
  // Put a pinned or focused frame back without replaying its animation.
  if (scOpen || hadFocus) {
    const find = (id) => id && app.querySelector('.ins-frame[data-game="' + id + '"]');
    const open = find(scOpen);
    const focus = find(hadFocus);
    [open, focus].forEach((frame) => frame && frame.classList.add('no-anim'));
    if (open) open.classList.add('open');
    if (focus) focus.focus({ preventScroll: true });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      [open, focus].forEach((frame) => frame && frame.classList.remove('no-anim'));
    }));
  }
  wireDatePicker();
  wireInspector();

  scheduleScoresPoll(date, games);
}

/* ── Standings ──────────────────────────────────────────────────────────── */
/* Sortable standings. Every column the payload gives us can be sorted; the
   sort state is shared by the tables on the page. */
const ST_COLS = [
  { key: 'seed', label: '#', cls: 'seed', dir: 'asc' },
  { key: 'team', label: 'Team', cls: 'team', dir: 'asc' },
  { key: 'w', label: 'W', dir: 'desc' },
  { key: 'l', label: 'L', dir: 'asc' },
  { key: 'pct', label: 'PCT', dir: 'desc' },
  { key: 'gb', label: 'GB', dir: 'asc' },
  { key: 'ppg', label: 'PPG', dir: 'desc' },
  { key: 'opp', label: 'OPP', dir: 'asc' },
  { key: 'diff', label: 'DIFF', dir: 'desc' },
  { key: 'l10', label: 'L10', dir: 'desc' },
  { key: 'strk', label: 'STRK', dir: 'desc' },
];
let stSort = { key: 'seed', dir: 'asc' };

function streakNumber(text) {
  const match = /^([WL])\s*(\d+)/i.exec(String(text || ''));
  return match ? (match[1].toUpperCase() === 'W' ? 1 : -1) * Number(match[2]) : null;
}

function gbNumber(text) {
  const value = String(text || '').trim();
  if (!value) return null;
  if (value === '-') return 0;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function last10Wins(text) {
  const match = /^(\d+)\s*-\s*\d+/.exec(String(text || ''));
  return match ? Number(match[1]) : null;
}

function stSortValue(key, entry) {
  const row = entry.row;
  switch (key) {
    case 'seed': return entry.rank;
    case 'team': return row.name;
    case 'w': return row.wins;
    case 'l': return row.losses;
    case 'pct': return row.pct;
    case 'gb': return gbNumber(row.gb);
    case 'ppg': return row.ppg;
    case 'opp': return row.oppPpg;
    case 'diff': return pointDiff(row);
    case 'l10': return last10Wins(row.last10);
    case 'strk': return streakNumber(row.streak);
    default: return null;
  }
}

function sortEntries(entries, sort) {
  const sign = sort.dir === 'desc' ? -1 : 1;
  return entries.slice().sort((a, b) => {
    const x = stSortValue(sort.key, a);
    const y = stSortValue(sort.key, b);
    // Rows with no value for this column always go last, whichever way it sorts.
    if (x == null && y != null) return 1;
    if (x != null && y == null) return -1;
    if (x != null && y != null && x !== y) {
      const cmp = typeof x === 'string' ? x.localeCompare(y) : x - y;
      if (cmp !== 0) return cmp * sign;
    }
    return a.rank - b.rank;
  });
}

function standingsTableHTML(title, rows, options = {}) {

  return '<section class="card standings-block"><h2>' + esc(title) + '</h2>' +

}

/* Mosaic: a squarified treemap, conference > division > team. Divisions are a
   fixed fact of the league and are not in the standings payload, so they are
   keyed by ESPN abbreviation here. A team missing from this map lands in an
   "Other" block of its conference instead of disappearing. */
const NBA_DIVISIONS = [
  ['East', 'Atlantic', ['BOS', 'BKN', 'NY', 'PHI', 'TOR']],
  ['East', 'Central', ['CHI', 'CLE', 'DET', 'IND', 'MIL']],
  ['East', 'Southeast', ['ATL', 'CHA', 'MIA', 'ORL', 'WSH']],
  ['West', 'Northwest', ['DEN', 'MIN', 'OKC', 'POR', 'UTAH']],
  ['West', 'Pacific', ['GS', 'LAC', 'LAL', 'PHX', 'SAC']],
  ['West', 'Southwest', ['DAL', 'HOU', 'MEM', 'NO', 'SA']],
];

function mosaicGroups(standings) {
  return ['East', 'West'].map((conf) => {
    const rows = standings[conf];
    const used = new Set();
    const divisions = NBA_DIVISIONS.filter((entry) => entry[0] === conf).map(([, name, abbrs]) => {
      const teams = rows.filter((row) => abbrs.includes(row.abbr));
      teams.forEach((row) => used.add(row.teamId));
      return { name, teams };
    });
    const other = rows.filter((row) => !used.has(row.teamId));
    if (other.length) divisions.push({ name: 'Other', teams: other });
    return { conf, title: conf === 'East' ? 'Eastern Conference' : 'Western Conference', divisions: divisions.filter((d) => d.teams.length) };
  });
}

// Squarified treemap (Bruls, Huizing, van Wijk): fill the short side with rows
// whose worst aspect ratio keeps improving. Items need v > 0.
function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((sum, item) => sum + item.v, 0);
  if (!total || w <= 0 || h <= 0) return out;
  const scale = (w * h) / total;
  let rest = items.map((item) => ({ ...item, a: item.v * scale }));
  while (rest.length) {
    const short = Math.min(w, h);
    let row = [];
    let best = Infinity;
    for (const item of rest) {
      const next = [...row, item];
      const sum = next.reduce((acc, z) => acc + z.a, 0);
      const max = Math.max(...next.map((z) => z.a));
      const min = Math.min(...next.map((z) => z.a));
      const worst = Math.max((short * short * max) / (sum * sum), (sum * sum) / (short * short * min));
      if (worst > best) break;
      best = worst;
      row = next;
    }
    const sum = row.reduce((acc, z) => acc + z.a, 0);
    if (w >= h) {
      const colW = sum / h;
      let cy = y;
      for (const item of row) {
        const ch = item.a / colW;
        out.push({ ...item, x, y: cy, w: colW, h: ch });
        cy += ch;
      }
      x += colW;
      w -= colW;
    } else {
      const rowH = sum / w;
      let cx = x;
      for (const item of row) {
        const cw = item.a / rowH;
        out.push({ ...item, x: cx, y, w: cw, h: rowH });
        cx += cw;
      }
      y += rowH;
      h -= rowH;
    }
    rest = rest.slice(row.length);
  }
  return out;
}
