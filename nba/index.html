<script src="https://cdn.tailwindcss.com"></script>
<script>
/* ── NFL26 pregame-studio palette ──────────────────────────────────────────
   The studio direction (home hero + schedule) is a warm charcoal base with a
   single gold accent. Remapping Tailwind's ramps here re-skins every utility
   class in the app at once, so `bg-slate-800` / `text-slate-400` and friends
   resolve to studio surfaces instead of the old navy-blue scale. Semantic
   families (green / red / steel) keep their meaning but drop the neon chroma.
   Guarded: the CDN above can fail (offline, blocked), and an unguarded
   assignment to `tailwind` would throw and abort the rest of the page. */
window.tailwind = window.tailwind || {};
tailwind.config = {
  theme: {
    extend: {
      colors: {
        /* Warm charcoal neutrals — replaces the navy `slate` scale */
        slate: {
          50: '#f4f2ef', 100: '#e9e7e3', 200: '#dbd9d4', 300: '#c9ccd1',
          400: '#8f9299', 500: '#868a91', 600: '#3d434c', 700: '#2b3037',
          800: '#16191f', 900: '#101215', 950: '#08090b',
        },
        /* Studio gold — the single accent */
        amber: {
          50: '#faf3e4', 100: '#f5e7c4', 200: '#eed9a2', 300: '#eecb86',
          400: '#d9a441', 500: '#d9a441', 600: '#c08f34', 700: '#a3782a',
          800: '#7f5d20', 900: '#5c4317', 950: '#33260d',
        },
        yellow: {
          300: '#eecb86', 400: '#d9a441', 500: '#d9a441', 600: '#c08f34',
        },
        orange: {
          300: '#eec08a', 400: '#d99a4d', 500: '#c8853a', 600: '#a96c2c',
        },
        /* Muted broadcast steel — link / secondary accent */
        blue: {
          50: '#eef2f6', 100: '#dde5ed', 200: '#c4d2e0', 300: '#a8bfd8',
          400: '#8fa6bf', 500: '#7590aa', 600: '#5c7490', 700: '#4a5e75',
          800: '#38485a', 900: '#28333f', 950: '#161c23',
        },
        sky: {
          200: '#c4d2e0', 300: '#a8bfd8', 400: '#8fa6bf', 500: '#7590aa',
          600: '#5c7490', 700: '#4a5e75',
        },
        cyan: {
          200: '#bfe2d9', 300: '#9fd3c7', 400: '#7ec0b0', 500: '#68ac9c',
          600: '#548b7e', 700: '#436f66',
        },
        teal: {
          300: '#9fd3c7', 400: '#7ec0b0', 500: '#68ac9c', 600: '#548b7e',
        },
        /* Field green — positive / value */
        emerald: {
          50: '#eef7f2', 100: '#d7ecdf', 200: '#b9dec9', 300: '#a3d9b8',
          400: '#7cc49b', 500: '#63b487', 600: '#4e9a70', 700: '#3e7c5a',
          800: '#316148', 900: '#254735', 950: '#12281c',
        },
        green: {
          300: '#a3d9b8', 400: '#7cc49b', 500: '#63b487', 600: '#4e9a70',
        },
        /* Muted crimson — negative / alert */
        red: {
          50: '#fbefed', 100: '#f7dbd7', 200: '#f2c3bc', 300: '#f2b0a8',
          400: '#e8877c', 500: '#d4635a', 600: '#b74e47', 700: '#963e39',
          800: '#78322e', 900: '#5a2523', 950: '#331413',
        },
        rose: {
          300: '#f2b0a8', 400: '#e8877c', 500: '#d4635a', 600: '#b74e47',
        },
        /* Desaturated violet — tertiary tags (draft rounds, etc.) */
        indigo: {
          300: '#c3badd', 400: '#a89ec9', 500: '#8f83b5', 600: '#746a97',
        },
        violet: {
          300: '#c3badd', 400: '#a89ec9', 500: '#8f83b5', 600: '#746a97',
        },
        purple: {
          300: '#c3badd', 400: '#a89ec9', 500: '#8f83b5', 600: '#746a97',
        },
      },
    },
  },
};
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Archivo:wght@600;700;800;900&display=swap');

:root {
  --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  /* Default Theme: NFL26 Pregame Studio — warm charcoal + a single gold accent.
     These surfaces match the home hero (.h2a-*) and schedule studio (.sch-*). */
  --bg-body: #0b0d10;
  --bg-card: #14161a;
  --bg-card-hover: #1a1d22;
  --bg-elevated: #16191f;
  --bg-inset: #111317;
  --bg-header: rgba(11, 13, 16, 0.92);
  --border-card: #2b3037;
  --border-muted: #262a31;
  --border-strong: #474d57;
  --text-main: #e9e7e3;
  --text-muted: #8f9299;
  --text-faint: #868a91;
  --accent-brand: #d9a441;
  --accent-brand-hover: #e6b556;
  --accent-brand-ink: #17140f;
  --accent-brand-subtle: rgba(217, 164, 65, 0.12);
  --accent-steel: #8fa6bf;
  --accent-positive: #7cc49b;
  --accent-positive-bg: rgba(124, 196, 155, 0.12);
  --accent-negative: #e8877c;
  --accent-negative-bg: rgba(232, 135, 124, 0.12);
  --accent-warning: #d9a441;
  --accent-warning-bg: rgba(217, 164, 65, 0.12);
  --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  --tab-active-bg: #d9a441;
  --tab-active-text: #17140f;
}

html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  overflow-x: hidden;
  background: var(--bg-body);
  color: var(--text-main);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { display: block; }
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 12px; }

/* ── Header ─────────────────────────────────────────────────────────────── */
.nba-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg-header);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-card);
}
.nba-header .bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 52px;
}
.brand { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.brand-mark {
  font: 800 19px/1 var(--font-sans);
  letter-spacing: -0.02em;
  color: var(--accent-brand);
}
.brand-name { font: 800 19px/1 var(--font-sans); color: var(--text-main); }
.sport-switch { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.sport-switch a {
  font: 700 11px/1 var(--font-sans);
  letter-spacing: 0.04em;
  padding: 7px 10px;
  border-radius: 6px;
  border: 1px solid transparent;
  color: var(--text-muted);
}
.sport-switch a:hover { color: var(--text-main); background: var(--bg-card-hover); }
.sport-switch a[aria-current='page'] {
  color: var(--tab-active-text);
  background: var(--tab-active-bg);
}
.nba-tabs { display: flex; gap: 2px; padding-bottom: 6px; overflow-x: auto; }
.nba-tabs a {
  font: 700 12px/1 var(--font-sans);
  padding: 7px 12px;
  border-radius: 6px;
  color: var(--text-muted);
  white-space: nowrap;
}
.nba-tabs a:hover { color: var(--text-main); background: var(--bg-card-hover); }
.nba-tabs a[aria-current='page'] { color: var(--text-main); background: var(--bg-card); border: 1px solid var(--border-card); }

main { padding: 14px 0 48px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 10px;
  box-shadow: var(--card-shadow);
}
h1, h2 { margin: 0; }
h2 { font: 700 12px/1.2 var(--font-sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }

/* ── States ─────────────────────────────────────────────────────────────── */
.state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 48px 16px;
  color: var(--text-muted);
  font: 500 13px/1.4 var(--font-sans);
  text-align: center;
}
.state .pulse { width: 7px; height: 7px; border-radius: 999px; background: var(--accent-brand); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
.retry {
  font: 700 12px/1 var(--font-sans);
  color: var(--tab-active-text);
  background: var(--accent-brand);
  border: 0;
  border-radius: 6px;
  padding: 9px 16px;
  cursor: pointer;
}
.retry:hover { background: var(--accent-brand-hover); }

/* ── Date bar ───────────────────────────────────────────────────────────── */
.date-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.date-bar .nav {
  font: 700 12px/1 var(--font-sans);
  color: var(--text-muted);
  background: var(--bg-elevated);
  border: 1px solid var(--border-card);
  border-radius: 6px;
  padding: 8px 10px;
  white-space: nowrap;
}
.date-bar .nav:hover { color: var(--text-main); border-color: var(--border-strong); }
.date-bar .nav.today { color: var(--accent-brand); }
.date-bar .day { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.date-bar .day strong { font: 700 14px/1.2 var(--font-sans); white-space: nowrap; }
.date-bar .day span { font: 500 10px/1 var(--font-mono); color: var(--text-faint); letter-spacing: 0.04em; }

/* ── Score cards ────────────────────────────────────────────────────────── */
.games { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 640px) { .games { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.game-card {
  display: block;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 10px;
  box-shadow: var(--card-shadow);
  padding: 10px 12px;
  transition: border-color 0.15s, background-color 0.15s;
}
.game-card:hover { border-color: var(--border-strong); background: var(--bg-card-hover); }
.game-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.game-card-top .game-meta {
  font: 500 10px/1 var(--font-mono);
  color: var(--text-faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.game-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font: 700 10px/1 var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-left: auto;
  white-space: nowrap;
}
.game-status.live { color: var(--accent-brand); }
.game-status .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
.game-status.live .dot { animation: pulse 1.1s ease-in-out infinite; }
.team-row {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}
.team-row .logo { width: 22px; height: 22px; object-fit: contain; }
.team-row .team-id { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.team-row .abbr { font: 800 14px/1 var(--font-sans); letter-spacing: -0.01em; }
.team-row .record { font: 500 10px/1 var(--font-mono); color: var(--text-faint); }
.team-row .score { font: 700 16px/1 var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--text-muted); }
.team-row.winner .abbr, .team-row.winner .score { color: var(--text-main); font-weight: 700; }
.team-row.loser .abbr, .team-row.loser .score { color: var(--text-muted); }
.game-meta { font: 500 10px/1 var(--font-mono); color: var(--text-faint); }

/* ── Tables ─────────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 0 0 10px 10px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
thead th {
  font: 700 10px/1 var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-faint);
  border-bottom: 1px solid var(--border-muted);
}
tbody td { font: 500 12px/1.3 var(--font-mono); color: var(--text-muted); border-bottom: 1px solid var(--border-muted); }
tbody tr:last-child td { border-bottom: 0; }

.standings-block { margin-bottom: 12px; overflow: hidden; }
.standings-block h2 { padding: 10px 12px 0; }
.standings { min-width: 580px; font-variant-numeric: tabular-nums; }
.standings td { color: var(--text-main); }
.standings th.seed, .standings td.seed { text-align: right; color: var(--text-faint); font-weight: 700; width: 34px; }
.standings th.team, .standings td.team { text-align: left; }
.standings td.team { display: flex; align-items: center; gap: 7px; min-width: 0; }
.standings td.team img { width: 18px; height: 18px; object-fit: contain; }
.standings td.team a { font: 600 12px/1.3 var(--font-sans); overflow: hidden; text-overflow: ellipsis; }
.standings td.team a:hover { color: var(--accent-brand); }
.standings tr.cut td { border-bottom: 2px solid var(--accent-brand-subtle); }

/* ── Game / box score ───────────────────────────────────────────────────── */
.game-head { padding: 12px; margin-bottom: 12px; }
.gh-status { font: 700 10px/1 var(--font-sans); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 10px; }
.gh-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gh-team { display: flex; align-items: center; gap: 8px; min-width: 0; }
.gh-team img { width: 34px; height: 34px; object-fit: contain; }
.gh-team .gh-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gh-team .gh-abbr { font: 800 15px/1 var(--font-sans); }
.gh-team .gh-score { font: 700 22px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.box-block { margin-bottom: 12px; overflow: hidden; }
.box-block .box-title { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; }
.box-block .box-title img { width: 22px; height: 22px; object-fit: contain; }
.box-block .box-title h2 { color: var(--text-main); font-size: 13px; }
.box { min-width: 560px; }
.box th.player-col, .box td.player-col {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--bg-card);
  text-align: left;
  min-width: 130px;
  box-shadow: 1px 0 0 var(--border-muted);
}
.box thead th.player-col { background: var(--bg-card); }
.box td.player-col { font: 600 12px/1.3 var(--font-sans); color: var(--text-main); }
.box td.player-col .pos { font: 500 9px/1 var(--font-mono); color: var(--text-faint); margin-left: 5px; }
.box tr.bench-start td { border-top: 1px solid var(--border-card); }
.box tr.totals td { background: var(--bg-inset); color: var(--text-main); font-weight: 700; border-top: 1px solid var(--border-strong); }
.box tr.totals td.player-col { background: var(--bg-inset); }
.dnp { padding: 8px 12px 12px; font: 500 11px/1.5 var(--font-sans); color: var(--text-faint); }
.dnp b { color: var(--text-muted); font-weight: 700; }

/* ── Team page ──────────────────────────────────────────────────────────── */
.team-head { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 12px; }
.team-head img { width: 52px; height: 52px; object-fit: contain; }
.team-head .team-meta { min-width: 0; }
.team-head h1 { font: 800 20px/1.15 var(--font-sans); letter-spacing: -0.02em; }
.team-head .record { font: 500 11px/1 var(--font-mono); color: var(--text-muted); margin-top: 4px; }
.tabs-row { display: flex; gap: 4px; margin-bottom: 10px; }
.tabs-row .tab {
  font: 700 12px/1 var(--font-sans);
  color: var(--text-muted);
  background: transparent;
  border: 1px solid var(--border-card);
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
}
.tabs-row .tab[aria-selected='true'] { color: var(--tab-active-text); background: var(--tab-active-bg); border-color: transparent; }
.sched { overflow: hidden; }
.sched-row {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border-muted);
  font: 500 11px/1.3 var(--font-mono);
  color: var(--text-muted);
}
.sched-row:last-child { border-bottom: 0; }
.sched-row:hover { background: var(--bg-card-hover); }
.sched-row .sched-opp { display: flex; align-items: center; gap: 6px; font: 700 12px/1 var(--font-sans); color: var(--text-main); min-width: 0; }
.sched-row .sched-opp img { width: 18px; height: 18px; object-fit: contain; }
.sched-row .sched-opp .ha { font: 600 10px/1 var(--font-mono); color: var(--text-faint); }
.sched-row .res { font-weight: 700; }
.sched-row .res.win { color: var(--accent-positive); }
.sched-row .res.loss { color: var(--accent-negative); }
.sched-row .res.upcoming { color: var(--text-faint); font-weight: 500; }
.roster-row {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border-muted);
  font: 500 11px/1.3 var(--font-mono);
  color: var(--text-muted);
}
.roster-row:last-child { border-bottom: 0; }
.roster-row .jersey { color: var(--text-faint); }
.roster-row .name { font: 600 12px/1.3 var(--font-sans); color: var(--text-main); overflow: hidden; text-overflow: ellipsis; }
.roster-row .pos { font-weight: 700; color: var(--text-muted); }
@media (max-width: 420px) {
  .roster-row { grid-template-columns: 30px minmax(0, 1fr) auto; }
  .roster-row .age { display: none; }
  .gh-team img { width: 28px; height: 28px; }
  .gh-team .gh-score { font-size: 19px; }
}

/* ── Compare, matchup and player ────────────────────────────────────────── */
.cmp-pickers {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: 8px;
  align-items: end;
  padding: 12px;
  margin-bottom: 12px;
}
.cmp-pickers label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
  font: 700 10px/1 var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-faint);
}
.cmp-pickers select {
  width: 100%;
  min-width: 0;
  font: 600 13px/1 var(--font-sans);
  color: var(--text-main);
  background: var(--bg-elevated);
  border: 1px solid var(--border-card);
  border-radius: 6px;
  padding: 9px 8px;
}
.cmp-swap {
  font: 700 12px/1 var(--font-sans);
  color: var(--text-muted);
  background: var(--bg-elevated);
  border: 1px solid var(--border-card);
  border-radius: 6px;
  padding: 9px 10px;
  cursor: pointer;
}
.cmp-swap:hover { color: var(--text-main); border-color: var(--border-strong); }
.cmp-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  padding: 12px;
  margin-bottom: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 10px;
  box-shadow: var(--card-shadow);
}
.cmp-head.flat { background: none; border: 0; box-shadow: none; border-radius: 0; padding: 0; margin: 0 0 10px; }
.cmp-side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cmp-side.right { flex-direction: row-reverse; text-align: right; }
.cmp-side img { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
.cmp-side .cmp-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cmp-side .cmp-abbr { font: 800 16px/1 var(--font-sans); }
.cmp-side .cmp-name {
  font: 500 10px/1.2 var(--font-sans);
  color: var(--text-faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cmp-side .cmp-rec { font: 500 10px/1 var(--font-mono); color: var(--text-muted); }
.cmp-vs { font: 700 10px/1 var(--font-mono); color: var(--text-faint); }
.cmp-table td.cmp-lbl {
  text-align: center;
  font: 700 10px/1.1 var(--font-sans);
  text-transform: uppercase;

<body>

<header class="nba-header">
  <div class="wrap bar">
    <a class="brand" href="#scores">
      <span class="brand-mark">Matchup</span><span class="brand-name">Board</span>
    </a>
    <div class="nba-search" id="nbaSearch">
      <button class="search-toggle" type="button" id="searchToggle" aria-label="Search NBA players" aria-expanded="false">⌕</button>
      <input class="search-input" id="searchInput" type="search" placeholder="Search players" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="searchResults" aria-autocomplete="list" aria-label="Search NBA players">
      <ul class="search-results" id="searchResults" role="listbox" aria-label="Player search results" hidden></ul>
    </div>
    <nav class="sport-switch" aria-label="Sport">
      <a href="/">NFL</a>
      <a href="/nba/" aria-current="page">NBA</a>
    </nav>
  </div>
  <div class="wrap">
    <nav class="nba-tabs" aria-label="NBA sections">
      <a href="#scores" data-nav="scores">Scores</a>
      <a href="#standings" data-nav="standings">Standings</a>
      <a href="#leaders" data-nav="leaders">Leaders</a>
      <a href="#compare" data-nav="compare">Compare</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="app">
    <div class="state"><span class="pulse"></span>Loading…</div>
  </div>
</main>

<script type="module">
import {
  etDate,
  parseAthlete,
  parseBoxScore,
  parseGameLog,
  parseLeaders,
  parsePlayerOverview,
  parsePreGame,
  parseRoster,
  parseScoreboard,
  parseSearch,
  parseStandings,
  parseTeamSchedule,
  parseTeamStats,
} from './nba.js';

const API = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const STANDINGS_API = 'https://site.api.espn.com/apis/v2/sports/basketball/nba/standings';
const SEARCH_API = 'https://site.web.api.espn.com/apis/common/v3/search?query=';
const POLL_MS = 30000;
const COLUMNS = ['MIN', 'PTS', 'FG', '3PT', 'FT', 'REB', 'AST', 'TO', 'STL', 'BLK', 'PF', '+/-'];

const app = document.getElementById('app');
let requestId = 0;
let pollTimer = 0;
let gameTimer = 0;

const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ESCAPES[ch]);

function stopPolling() {
  if (pollTimer) {
    clearTimeout(pollTimer);
    pollTimer = 0;
  }
  if (gameTimer) {
    clearTimeout(gameTimer);
    gameTimer = 0;
  }
}

function loadingHTML() {
  return '<div class="state"><span class="pulse"></span>Loading…</div>';
}

function showError(retry) {
  app.innerHTML = '<div class="state"><span>Couldn\'t reach ESPN.</span><button class="retry" type="button">Retry</button></div>';
  app.querySelector('.retry').addEventListener('click', retry);
}

async function fetchJSON(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('ESPN HTTP ' + res.status);
  return res.json();
}

function parseHash() {
  const raw = (location.hash || '').replace(/^#/, '');
  const parts = raw.split('/').filter(Boolean);
  return { view: parts[0] || 'scores', arg: parts[1] || '', args: parts.slice(1) };
}

/* ── Dates ──────────────────────────────────────────────────────────────── */
function todayET() {
  return etDate(new Date());
}

function isoOfDay(yyyymmdd) {
  return yyyymmdd.slice(0, 4) + '-' + yyyymmdd.slice(4, 6) + '-' + yyyymmdd.slice(6, 8) + 'T12:00:00Z';
}

function isValidDay(value) {
  return /^\d{8}$/.test(String(value || ''));
}

function shiftDay(yyyymmdd, offset) {
  const day = new Date(isoOfDay(yyyymmdd));
  day.setUTCDate(day.getUTCDate() + offset);
  const y = day.getUTCFullYear();
  const m = String(day.getUTCMonth() + 1).padStart(2, '0');
  const d = String(day.getUTCDate()).padStart(2, '0');
  return y + m + d;
}

function formatDay(yyyymmdd) {
  const day = new Date(isoOfDay(yyyymmdd));
  if (Number.isNaN(day.getTime())) return yyyymmdd;
  return day.toLocaleDateString('en-US', {
    timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric',
  });
}

function formatWhen(iso) {
  const day = new Date(iso);
  if (Number.isNaN(day.getTime())) return '';
  return day.toLocaleString('en-US', {
    timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit',
  }) + ' ET';
}

function formatPct(pct) {
  if (pct == null || Number.isNaN(pct)) return '—';
  if (pct >= 1) return '1.000';
  return '.' + String(Math.round(pct * 1000)).padStart(3, '0');
}

/* ── Scores ─────────────────────────────────────────────────────────────── */
function teamRowHTML(side, state) {
  const rank = side.winner ? ' winner' : (state === 'post' ? ' loser' : '');
  const logo = side.logo ? '<img class="logo" src="' + esc(side.logo) + '" alt="" loading="lazy">' : '<span class="logo"></span>';
  return '<div class="team-row' + rank + '">' + logo +
    '<div class="team-id"><span class="abbr">' + esc(side.abbr) + '</span>' +
    (side.record ? '<span class="record">' + esc(side.record) + '</span>' : '') + '</div>' +
    '<span class="score">' + (side.score == null ? '–' : esc(side.score)) + '</span></div>';
}

function leaderLineHTML(game, side) {
  if (!game.leaders || game.state === 'pre') return '';
  const entry = side === 'home' ? game.leaders.home : game.leaders.away;
  if (!entry || !entry.name) return '';
  return '<div class="game-leader">' + esc(entry.name) + ' <b>' + esc(entry.line) + '</b></div>';
}

function gameCardHTML(game) {
  const live = game.state === 'in';
  return '<a class="game-card" href="#game/' + esc(game.id) + '">' +
    '<div class="game-card-top">' +
    (game.broadcast ? '<span class="game-meta">' + esc(game.broadcast) + '</span>' : '<span></span>') +
    '<div class="game-status' + (live ? ' live' : '') + '"><span class="dot"></span>' + esc(game.statusText || 'Scheduled') + '</div>' +
    '</div>' +
    teamRowHTML(game.away, game.state) + leaderLineHTML(game, 'away') +
    teamRowHTML(game.home, game.state) + leaderLineHTML(game, 'home') +
    '</a>';
}

function isoDayValue(yyyymmdd) {
  return yyyymmdd.slice(0, 4) + '-' + yyyymmdd.slice(4, 6) + '-' + yyyymmdd.slice(6, 8);
}

function dateBarHTML(date) {
  const isToday = date === todayET();
  return '<div class="card date-bar">' +
    '<a class="nav" href="#scores/' + shiftDay(date, -1) + '" aria-label="Previous day">‹</a>' +
    '<div class="day"><strong>' + esc(isToday ? 'Today · ' + formatDay(date) : formatDay(date)) + '</strong><span>' + esc(date) + '</span></div>' +
    '<input type="date" class="date-pick" id="datePick" value="' + esc(isoDayValue(date)) + '" aria-label="Choose a date">' +
    '<a class="nav today" href="#scores"' + (isToday ? ' aria-current="date"' : '') + '>Today</a>' +
    '<a class="nav" href="#scores/' + shiftDay(date, 1) + '" aria-label="Next day">›</a>' +
    '</div>';
}

function wireDatePicker() {
  const picker = document.getElementById('datePick');
  if (!picker) return;
  picker.addEventListener('change', () => {
    const value = String(picker.value || '').replace(/-/g, '');
    if (isValidDay(value)) location.hash = '#scores/' + value;
  });
}

async function showScores(dateArg, isRefresh = false) {
  stopPolling();
  const token = ++requestId;
  const date = isValidDay(dateArg) ? dateArg : todayET();
  if (!isRefresh) app.innerHTML = loadingHTML();

  let games;
  try {
    games = parseScoreboard(await fetchJSON(API + '/scoreboard?dates=' + date));
  } catch (err) {
    if (token === requestId) {
      if (!isRefresh) {
        showError(() => showScores(date));
      } else {
        pollTimer = setTimeout(() => {
          const route = parseHash();
          if (route.view === 'scores' && (route.arg || todayET()) === date) showScores(date, true);
        }, POLL_MS);
      }
    }
    return;
  }
  if (token !== requestId) return;

  const order = { in: 0, pre: 1, post: 2 };
  const sorted = games.slice().sort((a, b) => (order[a.state] ?? 3) - (order[b.state] ?? 3));

  app.innerHTML = dateBarHTML(date) + (sorted.length
    ? '<div class="games">' + sorted.map(gameCardHTML).join('') + '</div>'
    : '<div class="state">No games</div>');
  wireDatePicker();

  if (games.some((game) => game.state === 'in')) {
    pollTimer = setTimeout(() => {
      const route = parseHash();
      if (route.view === 'scores' && (route.arg || todayET()) === date) showScores(date, true);
    }, POLL_MS);
  }
}

/* ── Standings ──────────────────────────────────────────────────────────── */
function standingsTableHTML(title, rows) {
  const body = rows.map((row, index) => {
    const cut = index === 5 || index === 9 ? ' class="cut"' : '';
    const logo = row.logo ? '<img src="' + esc(row.logo) + '" alt="" loading="lazy">' : '';
    const diff = row.ppg == null || row.oppPpg == null ? null : row.ppg - row.oppPpg;
    return '<tr' + cut + '>' +
      '<td class="seed">' + esc(row.seed ?? index + 1) + '</td>' +
      '<td class="team">' + logo + '<a href="#team/' + esc(row.teamId) + '">' + esc(row.name) + '</a></td>' +
      '<td>' + (row.wins == null ? '—' : esc(row.wins)) + '</td>' +
      '<td>' + (row.losses == null ? '—' : esc(row.losses)) + '</td>' +
      '<td>' + esc(formatPct(row.pct)) + '</td>' +
      '<td>' + esc(row.gb && row.gb !== '-' ? row.gb : '—') + '</td>' +
      '<td>' + esc(oneDecimal(row.ppg)) + '</td>' +
      '<td>' + esc(oneDecimal(row.oppPpg)) + '</td>' +
      '<td class="' + (diff == null ? '' : diff > 0 ? 'diff-pos' : diff < 0 ? 'diff-neg' : '') + '">' + esc(signedDecimal(diff)) + '</td>' +
      '<td>' + esc(row.last10 || '—') + '</td>' +
      '<td>' + esc(row.streak || '—') + '</td>' +
      '</tr>';
  }).join('');

  return '<section class="card standings-block"><h2>' + esc(title) + '</h2>' +
    '<div class="table-wrap"><table class="standings"><thead><tr>' +
    '<th class="seed">#</th><th class="team">Team</th><th>W</th><th>L</th><th>PCT</th><th>GB</th>' +
    '<th>PPG</th><th>OPP</th><th>DIFF</th><th>L10</th><th>STRK</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table></div></section>';
}

async function showStandings() {
  stopPolling();
  const token = ++requestId;
  app.innerHTML = loadingHTML();

  let standings;
  try {
    standings = parseStandings(await fetchJSON(STANDINGS_API));
  } catch (err) {
    if (token === requestId) showError(() => showStandings());
    return;
  }
  if (token !== requestId) return;

  app.innerHTML = standingsTableHTML('Eastern Conference', standings.East) +
    standingsTableHTML('Western Conference', standings.West);
}

/* ── Compare ────────────────────────────────────────────────────────────── */
const WEB = 'https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba';
let standingsCache = null;

async function getStandings() {
  if (!standingsCache) standingsCache = parseStandings(await fetchJSON(STANDINGS_API));
  return standingsCache;
}

function allTeams(standings) {
  return [...standings.East, ...standings.West].slice().sort((a, b) => a.name.localeCompare(b.name));
}

function standingFor(standings, id) {
  const key = String(id);
  return [...standings.East, ...standings.West].find((row) => row.teamId === key) || null;
}

// One team, everything the compare table needs: standings row (record, points
// for and against), season averages and the schedule (last five, head to head).
const TEAM_TTL = 5 * 60 * 1000;
const teamCache = new Map();

// One team cache (statistics + schedule, five minutes) shared by compare,
// pre-game and the team page.
async function teamData(id) {
  const key = String(id);
  const hit = teamCache.get(key);
  if (hit && Date.now() - hit.at < TEAM_TTL) return hit.value;
  const [statsJson, scheduleJson] = await Promise.all([
    fetchJSON(API + '/teams/' + encodeURIComponent(key) + '/statistics'),
    fetchJSON(API + '/teams/' + encodeURIComponent(key) + '/schedule'),
  ]);
  const value = { stats: parseTeamStats(statsJson), schedule: parseTeamSchedule(scheduleJson) };
  teamCache.set(key, { at: Date.now(), value });
  return value;
}

async function teamBundle(id) {
  const key = String(id);
  const [standings, team] = await Promise.all([getStandings(), teamData(key)]);
  const stats = team.stats;
  const schedule = team.schedule;
  const row = standingFor(standings, key);
  const wins = row ? row.wins : null;
  const losses = row ? row.losses : null;
  return {
    id: key,
    abbr: (row && row.abbr) || schedule.team.abbr,
    name: (row && row.name) || schedule.team.name,
    logo: (row && row.logo) || schedule.team.logo,
    wins,
    losses,
    record: wins != null && losses != null ? wins + '-' + losses : (schedule.team.record || ''),
    ppg: row ? row.ppg : null,
    oppPpg: row ? row.oppPpg : null,
    stats,
    schedule,
  };
}

function oneDecimal(value) {
  if (value == null || Number.isNaN(value)) return '—';
  return (Math.round(value * 10) / 10).toFixed(1);
}

function signedDecimal(value) {
  if (value == null || Number.isNaN(value)) return '—';
  const rounded = Math.round(value * 10) / 10;
  return (rounded > 0 ? '+' : '') + rounded.toFixed(1);
}

function ratioDecimal(value) {
  if (value == null || Number.isNaN(value)) return '—';
  return (Math.round(value * 100) / 100).toFixed(2);
}

const COMPARE_ROWS = [
  {
    label: 'Record',
    value: (team) => (team.wins != null && team.losses != null && team.wins + team.losses > 0
      ? team.wins / (team.wins + team.losses)
      : null),
    text: (team) => team.record || '—',
  },
  { label: 'PPG', value: (team) => team.ppg, text: (team) => oneDecimal(team.ppg) },
  { label: 'Opp PPG', value: (team) => team.oppPpg, text: (team) => oneDecimal(team.oppPpg), lower: true },
  {
    label: 'Diff',
    value: (team) => (team.ppg == null || team.oppPpg == null ? null : team.ppg - team.oppPpg),
    text: (team) => signedDecimal(team.ppg == null || team.oppPpg == null ? null : team.ppg - team.oppPpg),
  },
  { label: 'FG%', value: (team) => team.stats.fgPct, text: (team) => oneDecimal(team.stats.fgPct) },
  { label: '3P%', value: (team) => team.stats.threePct, text: (team) => oneDecimal(team.stats.threePct) },
  { label: 'FT%', value: (team) => team.stats.ftPct, text: (team) => oneDecimal(team.stats.ftPct) },
  { label: 'REB', value: (team) => team.stats.reb, text: (team) => oneDecimal(team.stats.reb) },
  { label: 'AST', value: (team) => team.stats.ast, text: (team) => oneDecimal(team.stats.ast) },
  { label: 'TOV', value: (team) => team.stats.tov, text: (team) => oneDecimal(team.stats.tov), lower: true },
  { label: 'STL', value: (team) => team.stats.stl, text: (team) => oneDecimal(team.stats.stl) },
  { label: 'BLK', value: (team) => team.stats.blk, text: (team) => oneDecimal(team.stats.blk) },
  { label: 'AST/TO', value: (team) => team.stats.astTo, text: (team) => ratioDecimal(team.stats.astTo) },
];

function compareTableHTML(left, right, rowSet = COMPARE_ROWS) {
  const rows = rowSet.map((row) => {
    const a = row.value(left);
    const b = row.value(right);
    let aBetter = false;
    let bBetter = false;
    if (a != null && b != null && a !== b) {
      const aWins = row.lower ? a < b : a > b;
      aBetter = aWins;
      bBetter = !aWins;
    }
    return '<tr><td class="cmp-val' + (aBetter ? ' better' : '') + '">' + esc(row.text(left)) + '</td>' +
      '<td class="cmp-lbl">' + esc(row.label) + '</td>' +
      '<td class="cmp-val right' + (bBetter ? ' better' : '') + '">' + esc(row.text(right)) + '</td></tr>';
  }).join('');

  return '<section class="card standings-block"><div class="table-wrap"><table class="cmp-table"><tbody>' +
    rows + '</tbody></table></div></section>';
}

function compareHeadHTML(left, right, flat) {
  const side = (team, cls) => '<a class="cmp-side' + (cls ? ' ' + cls : '') + '" href="#team/' + esc(team.id) + '">' +
    (team.logo ? '<img src="' + esc(team.logo) + '" alt="" loading="lazy">' : '') +
    '<span class="cmp-id"><span class="cmp-abbr">' + esc(team.abbr) + '</span>' +
    '<span class="cmp-name">' + esc(team.name) + '</span>' +
    '<span class="cmp-rec">' + esc(team.record || '—') + '</span></span></a>';
  return '<div class="cmp-head' + (flat ? ' flat' : '') + '">' + side(left, '') +
    '<span class="cmp-vs">vs</span>' + side(right, 'right') + '</div>';
}

function comparePickerHTML(teams, a, b) {
  const options = (selected) => '<option value="">Select team…</option>' + teams.map((row) =>
    '<option value="' + esc(row.teamId) + '"' + (row.teamId === selected ? ' selected' : '') + '>' +
    esc(row.name) + '</option>').join('');
  return '<div class="card cmp-pickers">' +
    '<label>Team A<select id="cmpA">' + options(a) + '</select></label>' +
    '<button class="cmp-swap" type="button" id="cmpSwap" title="Swap teams">⇄</button>' +
    '<label>Team B<select id="cmpB">' + options(b) + '</select></label></div>';
}

function hashForCompare(a, b) {
  return '#compare' + (a ? '/' + a : '') + (a && b ? '/' + b : '');
}

function wireComparePicker(a, b) {
  const selectA = document.getElementById('cmpA');
  const selectB = document.getElementById('cmpB');
  const go = (nextA, nextB) => {
    const hash = hashForCompare(nextA, nextB);
    if (location.hash === hash) return;
    location.hash = hash;
  };
  selectA.addEventListener('change', () => go(selectA.value, selectB.value));
  selectB.addEventListener('change', () => go(selectA.value, selectB.value));
  document.getElementById('cmpSwap').addEventListener('click', () => go(b, a));
}

function recentGames(games, count) {
  return games.filter((game) => game.result !== null)
    .slice()
    .sort((x, y) => new Date(y.startISO) - new Date(x.startISO))
    .slice(0, count);
}

async function showCompare(idA, idB) {
  stopPolling();
  const token = ++requestId;
  app.innerHTML = loadingHTML();

  let standings;
  try {
    standings = await getStandings();
  } catch (err) {
    if (token === requestId) showError(() => showCompare(idA, idB));
    return;
  }
  if (token !== requestId) return;

  const teams = allTeams(standings);
  const wanted = (id) => (teams.some((row) => row.teamId === String(id || '')) ? String(id) : '');
  const a = wanted(idA);
  const b = wanted(idB);

  if (!a || !b) {
    app.innerHTML = comparePickerHTML(teams, a, b) + '<div class="state">' +
      esc(a ? 'Pick the second team to compare.' : 'Pick two teams to compare their season so far.') + '</div>';
    wireComparePicker(a, b);
    return;
  }

  let left;
  let right;
  try {
    [left, right] = await Promise.all([teamBundle(a), teamBundle(b)]);
  } catch (err) {
    if (token === requestId) showError(() => showCompare(a, b));
    return;
  }
  if (token !== requestId) return;

  const rivalIds = new Set(right.schedule.games.map((game) => game.id));
  const headToHead = left.schedule.games
    .filter((game) => rivalIds.has(game.id))
    .sort((x, y) => new Date(x.startISO) - new Date(y.startISO));
  const lastFive = (team) => {
    const played = recentGames(team.schedule.games, 5);
    return '<section class="card standings-block"><h2>Last 5 · ' + esc(team.abbr) + '</h2>' +
      (played.length
        ? '<div class="sched">' + played.map(scheduleRowHTML).join('') + '</div>'
        : '<div class="state">No games played yet</div>') +
      '</section>';
  };

  app.innerHTML = comparePickerHTML(teams, a, b) +
    compareHeadHTML(left, right) +
    compareTableHTML(left, right) +
    lastFive(left) + lastFive(right) +
    '<section class="card standings-block"><h2>This season · head to head</h2>' +
    (headToHead.length
      ? '<div class="sched">' + headToHead.map(scheduleRowHTML).join('') + '</div>'
      : '<div class="state">No games meet both schedules.</div>') +
    '</section>';

  wireComparePicker(a, b);
}

/* ── Player search ──────────────────────────────────────────────────────── */
let searchTimer = 0;
let searchAbort = null;
let searchResults = [];
let searchActive = -1;

function highlightSearchResult() {
  const list = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');
  if (!list || !input) return;
  list.querySelectorAll('[role="option"]').forEach((option, index) => {
    option.setAttribute('aria-selected', String(index === searchActive));
    if (index === searchActive) input.setAttribute('aria-activedescendant', option.id);
  });
}

function searchOptionHTML(player, prefix) {
  return '<li role="option"' + (prefix ? ' id="' + esc(prefix) + esc(player.id) + '"' : '') +
    ' data-id="' + esc(player.id) + '" aria-selected="false">' +
    (player.headshot ? '<img src="' + esc(player.headshot) + '" alt="" loading="lazy">' : '') +
    '<span>' + esc(player.name) + '</span>' +
    (player.teamAbbr ? '<span class="sr-team">' + esc(player.teamAbbr) + '</span>' : '') +
    '</li>';
}

async function searchPlayers(query, signal) {
  const response = await fetch(SEARCH_API + encodeURIComponent(query) + '&limit=10&type=player', { cache: 'no-store', signal });
  if (!response.ok) throw new Error('ESPN HTTP ' + response.status);
  return parseSearch(await response.json()).slice(0, 8);
}

function paintSearchMessage(message) {
  const list = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');
  if (!list || !input) return;
  searchResults = [];
  searchActive = -1;
  list.innerHTML = '<li class="sr-empty" role="presentation">' + esc(message) + '</li>';
  list.hidden = false;
  input.setAttribute('aria-expanded', 'true');
}

function paintSearchResults(items) {
  const list = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');
  if (!list || !input) return;
  searchResults = items;
  searchActive = items.length ? 0 : -1;
  list.innerHTML = items.length
    ? items.map((player) => searchOptionHTML(player, 'search-opt-')).join('')
    : '<li class="sr-empty" role="presentation">No NBA players found</li>';
  list.hidden = false;
  input.setAttribute('aria-expanded', 'true');
  highlightSearchResult();
}

function closeSearch() {
  if (searchTimer) {
    clearTimeout(searchTimer);
    searchTimer = 0;
  }
  if (searchAbort) {
    searchAbort.abort();
    searchAbort = null;
  }
  const list = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');
  const toggle = document.getElementById('searchToggle');
  const shell = document.getElementById('nbaSearch');
  if (list) {
    list.hidden = true;
    list.innerHTML = '';
  }
  if (input) input.setAttribute('aria-expanded', 'false');
  if (toggle) toggle.setAttribute('aria-expanded', 'false');
  if (shell) shell.classList.remove('open');
  searchResults = [];
  searchActive = -1;
}

function openPlayer(id) {
  if (!id) return;
  closeSearch();
  location.hash = '#player/' + id;
}

async function runSearch(query) {
  if (searchAbort) searchAbort.abort();
  searchAbort = new AbortController();
  const signal = searchAbort.signal;
  paintSearchMessage('Searching…');
  try {
    const players = await searchPlayers(query, signal);
    if (signal.aborted) return;
    paintSearchResults(players);
  } catch (err) {
    if (signal.aborted || (err && err.name === 'AbortError')) return;
    paintSearchResults([]);
  }
}

function initSearch() {
  const input = document.getElementById('searchInput');
  const toggle = document.getElementById('searchToggle');
  const list = document.getElementById('searchResults');
  const shell = document.getElementById('nbaSearch');
  if (!input || !toggle || !list || !shell) return;

  input.addEventListener('input', () => {
    if (searchTimer) clearTimeout(searchTimer);
    const query = input.value.trim();
    if (query.length < 2) {
      if (searchAbort) searchAbort.abort();
      closeSearch();
      return;
    }
    searchTimer = setTimeout(() => runSearch(query), 250);
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      closeSearch();
      return;
    }
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      if (!searchResults.length) return;
      event.preventDefault();
      const step = event.key === 'ArrowDown' ? 1 : -1;
      searchActive = (searchActive + step + searchResults.length) % searchResults.length;
      highlightSearchResult();
      return;
    }
    if (event.key === 'Enter' && searchResults.length) {
      event.preventDefault();
      const picked = searchResults[Math.max(0, searchActive)];
      if (picked) openPlayer(picked.id);
    }
  });

  list.addEventListener('click', (event) => {
    const option = event.target.closest('[data-id]');
    if (option) openPlayer(option.getAttribute('data-id'));
  });

  toggle.addEventListener('click', () => {
    const open = !shell.classList.contains('open');
    shell.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', String(open));
    if (open) input.focus();
    else closeSearch();
  });

  // Tapping anywhere outside the search closes it, so the brand and the sport
  // switch stay reachable while the phone overlay is open.
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('click', (event) => {
      if (shell.contains && shell.contains(event.target)) return;
      closeSearch();
    });
  }
}

function formatLogDate(iso) {
  const day = new Date(iso);
  if (Number.isNaN(day.getTime())) return '';
  return day.toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
}

function averagesHTML(overview) {
  if (!overview.labels.length) return '<div class="state">No averages for this player.</div>';
  const row = (title, values) => '<tr><td>' + esc(title) + '</td>' +
    overview.labels.map((label) => '<td>' + (values[label] == null ? '—' : esc(values[label])) + '</td>').join('') +
    '</tr>';
  return '<div class="table-wrap"><table class="log avg"><thead><tr><th class="sticky-col">Split</th>' +
    overview.labels.map((label) => '<th>' + esc(label) + '</th>').join('') +
    '</tr></thead><tbody>' + row('Season', overview.season) + row('Career', overview.career) +
    '</tbody></table></div>';
}

function seasonTableHTML(labels, games) {
  const head = '<th class="sticky-col">Date</th><th>Opp</th><th>Result</th>' +
    labels.map((label) => '<th>' + esc(label) + '</th>').join('');

    '<td>' + esc((game.atVs ? game.atVs + ' ' : '') + game.opponentAbbr) + '</td>' +
    '<td>' + esc((game.result ? game.result + ' ' : '') + game.score) + '</td>' +
    labels.map((label) => '<td>' + (game.stats[label] == null ? '—' : esc(game.stats[label])) + '</td>').join('') +
    '</tr>').join('');
  return '<div class="table-wrap"><table class="log"><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';

function gameLogHTML(log) {
  if (!log.seasons.length) return '<div class="state">No games logged this season.</div>';
  const found = log.seasons.findIndex((season) => /regular season/i.test(season.name));
  const active = found >= 0 ? found : 0;
  const tabs = log.seasons.map((season, index) =>
    '<button class="tab" type="button" role="tab" data-season="' + index + '" aria-selected="' + (index === active) + '">' + esc(season.name) + '</button>').join('');
  const panels = log.seasons.map((season, index) =>
    '<section data-season-panel="' + index + '"' + (index === active ? '' : ' hidden') + '>' +
    (season.games.length ? seasonTableHTML(log.labels, season.games) : '<div class="state">No games</div>') +
    '</section>').join('');
  return '<div class="tabs-row" role="tablist">' + tabs + '</div>' + panels;
}

function wireSeasonTabs() {
  const tabs = app.querySelectorAll('.tabs-row .tab[data-season]');
  tabs.forEach((tab) => tab.addEventListener('click', () => {
    tabs.forEach((other) => other.setAttribute('aria-selected', String(other === tab)));
    app.querySelectorAll('section[data-season-panel]').forEach((panel) => {
      panel.hidden = panel.getAttribute('data-season-panel') !== tab.getAttribute('data-season');
    });
  }));
}

    '<input class="search-input" id="' + id + '" type="search" autocomplete="off" role="combobox" ' +
    'aria-expanded="false" aria-controls="' + listId + '" aria-autocomplete="list" aria-label="' + label + '">' +
    '<ul class="search-results" id="' + listId + '" role="listbox" aria-label="' + label + ' results" hidden></ul></div>';
  return '<div class="card ps-fields">' + field('psA', 'psListA', 'Player A') + field('psB', 'psListB', 'Player B') + '</div>';
}

function playerCompareHeadHTML(left, right) {
  const side = (entry, cls) => '<a class="ps-side' + (cls ? ' ' + cls : '') + '" href="#player/' + esc(entry.id) + '">' +
    avatarHTML(entry.athlete.headshot, entry.athlete.name) +
    '<span><span class="ps-name">' + esc(entry.athlete.name || 'Player') + '</span>' +
    '<span class="ps-team">' + esc(entry.athlete.team.abbr || '') + '</span></span></a>';
  return '<div class="player-cmp-head">' + side(left, '') +
    '<span class="cmp-vs">vs</span>' + side(right, 'right') + '</div>';
}

// Same search component as the header, mounted on a picker field.
function bindPlayerSearch(inputId, listId, onPick) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if (!input || !list) return;
  let timer = 0;
  let controller = null;
  let results = [];
  let active = -1;

  const close = () => {
    if (timer) clearTimeout(timer);
    if (controller) controller.abort();
    list.hidden = true;
    list.innerHTML = '';
    results = [];
    active = -1;
    input.setAttribute('aria-expanded', 'false');
  };

  const paint = () => {
    list.innerHTML = results.length
      ? results.map((player) => searchOptionHTML(player, inputId + '-opt-')).join('')
      : '<li class="sr-empty" role="presentation">No NBA players found</li>';
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    list.querySelectorAll('[role="option"]').forEach((option, index) => {
      option.setAttribute('aria-selected', String(index === active));
    });
  };

  input.addEventListener('input', () => {
    if (timer) clearTimeout(timer);
    if (controller) controller.abort();
    const query = input.value.trim();
    if (query.length < 2) {
      close();
      return;
    }
    list.innerHTML = '<li class="sr-empty" role="presentation">Searching…</li>';
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    timer = setTimeout(async () => {
      controller = new AbortController();
      const signal = controller.signal;
      try {
        results = await searchPlayers(query, signal);
        if (signal.aborted) return;
        active = results.length ? 0 : -1;
        paint();
      } catch (err) {
        if (signal.aborted) return;
        results = [];
        active = -1;
        paint();
      }
    }, 250);
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      close();
      return;
    }
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      if (!results.length) return;
      event.preventDefault();
      active = (active + (event.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length;
      paint();
      return;
    }
    if (event.key === 'Enter' && results.length) {
      event.preventDefault();
      const picked = results[Math.max(0, active)];
      if (picked) onPick(picked.id);
    }
  });

  list.addEventListener('click', (event) => {
    const option = event.target.closest('[data-id]');
    if (option) onPick(option.getAttribute('data-id'));
  });
}

async function playerEntry(id) {
  const [athleteJson, overviewJson] = await Promise.all([
    fetchJSON(WEB + '/athletes/' + encodeURIComponent(id)),
    fetchJSON(WEB + '/athletes/' + encodeURIComponent(id) + '/overview'),
  ]);
  return {
    id: String(id),
    athlete: parseAthlete(athleteJson),
    season: parsePlayerOverview(overviewJson).season,
  };
}

function playersHash(a, b) {
  return '#players' + (a ? '/' + a : '') + (a && b ? '/' + b : '');
}

async function showPlayers(idA, idB) {
  stopPolling();
  const token = ++requestId;
  const a = String(idA || '');
  const b = String(idB || '');
  const go = (nextA, nextB) => {
    const hash = playersHash(nextA, nextB);
    if (location.hash !== hash) location.hash = hash;
  };

  if (!a || !b) {
    app.innerHTML = playerPickerHTML() + '<div class="state">' +
      esc(a || b ? 'Pick the second player to compare.' : 'Search for two players to compare their season averages.') + '</div>';
    bindPlayerSearch('psA', 'psListA', (id) => go(id, b));
    bindPlayerSearch('psB', 'psListB', (id) => go(a, id));
    return;
  }

  app.innerHTML = playerPickerHTML() + loadingHTML();
  bindPlayerSearch('psA', 'psListA', (id) => go(id, b));
  bindPlayerSearch('psB', 'psListB', (id) => go(a, id));

  let left;
  let right;
  try {
    [left, right] = await Promise.all([playerEntry(a), playerEntry(b)]);
  } catch (err) {
    if (token === requestId) showError(() => showPlayers(a, b));
    return;
  }
  if (token !== requestId) return;

  app.innerHTML = playerPickerHTML() + playerCompareHeadHTML(left, right) +
    compareTableHTML(left, right, PLAYER_COMPARE_ROWS);
  bindPlayerSearch('psA', 'psListA', (id) => go(id, b));
  bindPlayerSearch('psB', 'psListB', (id) => go(a, id));
}

/* ── Game / box score ───────────────────────────────────────────────────── */
function playerNameHTML(player) {
  const name = esc(player.name);
  return player.id ? '<a href="#player/' + esc(player.id) + '">' + name + '</a>' : name;
}

function playerRowHTML(player) {
  const cells = COLUMNS.map((label) => {
    const value = player.stats[label];
    return '<td>' + (value == null || value === '' ? '—' : esc(value)) + '</td>';
  }).join('');
  return '<tr><td class="player-col">' + playerNameHTML(player) +
    (player.pos ? '<span class="pos">' + esc(player.pos) + '</span>' : '') + '</td>' + cells + '</tr>';
}

function boxTableHTML(team) {
  const totals = '<tr class="totals"><td class="player-col">Totals</td>' +
    COLUMNS.map((label) => {
      const value = team.totals[label];
      return '<td>' + (value == null || value === '' ? '—' : esc(value)) + '</td>';
    }).join('') + '</tr>';

  const bench = team.bench.map((player, index) => {
    const row = playerRowHTML(player);
    return index === 0 ? row.replace('<tr>', '<tr class="bench-start">') : row;
  }).join('');

  const dnp = team.dnp.length
    ? '<div class="dnp"><b>DNP:</b> ' + team.dnp.map((player) => playerNameHTML(player) + ' (' + esc(player.reason) + ')').join(' · ') + '</div>'
    : '';

  return '<section class="card box-block">' +
    '<div class="box-title">' + (team.logo ? '<img src="' + esc(team.logo) + '" alt="" loading="lazy">' : '') + '<h2>' + esc(team.name) + '</h2></div>' +
    '<div class="table-wrap"><table class="box"><thead><tr>' +
    '<th class="player-col">Player</th>' + COLUMNS.map((label) => '<th>' + esc(label) + '</th>').join('') +
    '</tr></thead><tbody>' + team.starters.map(playerRowHTML).join('') + bench + totals + '</tbody></table></div>' + dnp + '</section>';
}

/* ── Pre-game matchup ───────────────────────────────────────────────────── */
function seriesTeamHTML(abbr, score, winnerAbbr) {
  const cls = !winnerAbbr ? '' : abbr === winnerAbbr ? ' winner' : ' loser';
  return '<span class="ss-team' + cls + '">' + esc(abbr) + ' <b>' + esc(score) + '</b></span>';
}

function seriesHTML(pre) {
  if (!pre.seasonSeries.length) return '<div class="state">No games in this series yet.</div>';
  const rows = pre.seasonSeries.map((game) => {
    const body = game.state === 'post'
      ? '<span class="sched-opp ss-wrap">' +
          seriesTeamHTML(game.away, game.awayScore, game.winnerAbbr) +
          '<span class="ha">@</span>' +
          seriesTeamHTML(game.home, game.homeScore, game.winnerAbbr) +
        '</span>' +
        '<span class="res">Final</span>'
      : '<span class="sched-opp">' + esc(game.away + ' @ ' + game.home) + '</span>' +
        '<span class="res upcoming">Upcoming</span>';
    return '<a class="sched-row" href="#game/' + esc(game.id) + '">' +
      '<span class="sched-date">' + esc(formatDay(etDate(game.date) || '')) + '</span>' + body + '</a>';
  }).join('');
  return '<div class="sched">' + rows + '</div>';
}

function lastFiveHTML(pre, abbr) {
  const games = pre.lastFive[abbr] || [];
  if (!games.length) return '<div class="state">No recent games.</div>';
  return '<div class="sched">' + games.map((game) => '<a class="sched-row" href="#game/' + esc(game.id) + '">' +
    '<span class="sched-date">' + esc(formatDay(etDate(game.date) || '')) + '</span>' +
    '<span class="sched-opp"><span class="ha">' + esc(game.atVs) + '</span>' + esc(game.opponentAbbr) + '</span>' +
    '<span class="res ' + (game.result === 'W' ? 'win' : 'loss') + '">' + esc(game.result + ' ' + game.score) + '</span>' +
    '</a>').join('') + '</div>';
}

function injuriesHTML(pre, abbr) {
  const players = pre.injuries[abbr] || [];
  if (!players.length) return '<div class="state">No injuries reported.</div>';
  return '<div class="sched">' + players.map((player) => '<div class="list-row">' +
    '<span class="lr-main">' + esc(player.name) +
    (player.pos ? ' <span class="lr-sub">' + esc(player.pos) + '</span>' : '') + '</span>' +
    '<span class="lr-sub">' + esc(player.status) +
    (player.detail ? ' · ' + esc(player.detail) : '') + '</span></div>').join('') + '</div>';
}

function leadersHTML(pre, abbr) {
  const leaders = pre.leaders[abbr] || [];
  if (!leaders.length) return '<div class="state">No team leaders yet.</div>';
  return '<div class="sched">' + leaders.map((leader) => '<div class="list-row">' +
    '<span class="lr-sub">' + esc(leader.category) + '</span>' +
    '<span class="lr-main">' + esc(leader.name) +
    ' <span class="lr-sub">' + esc(leader.value) + '</span></span></div>').join('') + '</div>';
}

async function showPreGame(pre, token) {
  let away;
  let home;
  try {
    [away, home] = await Promise.all([teamBundle(pre.away.id), teamBundle(pre.home.id)]);
  } catch (err) {
    if (token === requestId) showError(() => showGame(pre.id));
    return;
  }
  if (token !== requestId) return;

  const section = (title, body) => '<section class="card standings-block"><h2>' + esc(title) + '</h2>' + body + '</section>';

  app.innerHTML =
    '<div class="card mu-head">' + compareHeadHTML(away, home, true) +
      '<div class="mu-when"><b>' + esc(formatWhen(pre.startISO)) + '</b>' +
      (pre.venue ? ' · ' + esc(pre.venue) : '') +
      (pre.broadcast ? ' · ' + esc(pre.broadcast) : '') + '</div></div>' +
    compareTableHTML(away, home) +
    section('Season series', seriesHTML(pre)) +
    section('Last 5 · ' + pre.away.abbr, lastFiveHTML(pre, pre.away.abbr)) +
    section('Last 5 · ' + pre.home.abbr, lastFiveHTML(pre, pre.home.abbr)) +
    section('Injuries · ' + pre.away.abbr, injuriesHTML(pre, pre.away.abbr)) +
    section('Injuries · ' + pre.home.abbr, injuriesHTML(pre, pre.home.abbr)) +
    section('Team leaders · ' + pre.away.abbr, leadersHTML(pre, pre.away.abbr)) +
    section('Team leaders · ' + pre.home.abbr, leadersHTML(pre, pre.home.abbr)) +
    '<a class="cmp-link" href="#compare/' + esc(pre.away.id) + '/' + esc(pre.home.id) + '">Full comparison →</a>';
}

function armGamePoll(id) {
  gameTimer = setTimeout(() => {
    const route = parseHash();
    if (route.view === 'game' && route.arg === String(id)) showGame(id, true);
  }, POLL_MS);
}

async function showGame(id, isRefresh = false) {
  stopPolling();
  const token = ++requestId;
  if (!isRefresh) app.innerHTML = loadingHTML();

  let json;
  try {
    json = await fetchJSON(API + '/summary?event=' + encodeURIComponent(id));
  } catch (err) {
    if (token !== requestId) return;
    if (isRefresh) armGamePoll(id);
    else showError(() => showGame(id));
    return;
  }
  if (token !== requestId) return;

  const box = parseBoxScore(json);
  if (box.teams.length) {
    renderBoxScore(box, box.state === 'in');
    if (box.state === 'in') armGamePoll(id);
    return;
  }

  const pre = parsePreGame(json);
  if (box.state === 'pre' && pre.away && pre.home) {
    await showPreGame(pre, token);
    return;
  }

  app.innerHTML = '<div class="state">No box score for this game.<br><a class="nav" href="#scores">Back to scores</a></div>';
}

function renderBoxScore(box, live) {
  const teams = box.teams.map((team) => '<div class="gh-team">' +
    (team.logo ? '<img src="' + esc(team.logo) + '" alt="" loading="lazy">' : '') +
    '<div class="gh-id"><span class="gh-abbr">' + esc(team.abbr) + '</span>' +
    '<span class="gh-score">' + (team.score == null ? '–' : esc(team.score)) + '</span></div></div>').join('');

  app.innerHTML = '<div class="card game-head"><div class="gh-status">' + esc(box.statusText || 'Game') + '</div>' +
    '<div class="gh-teams">' + teams + '</div>' +
    (live ? '<div class="gh-live">Live · updates every 30s</div>' : '') + '</div>' +
    box.teams.map(boxTableHTML).join('');
}

/* ── Team page ──────────────────────────────────────────────────────────── */
function scheduleRowHTML(game) {
  const opponent = '<span class="ha">' + (game.homeAway === 'home' ? 'vs' : '@') + '</span>' +
    (game.opponent.logo ? '<img src="' + esc(game.opponent.logo) + '" alt="" loading="lazy">' : '') +
    esc(game.opponent.abbr || game.opponent.name);
  const result = game.result
    ? '<span class="res ' + (game.result === 'W' ? 'win' : 'loss') + '">' + game.result + ' ' + (game.score == null ? '' : esc(game.score) + (game.oppScore == null ? '' : '-' + esc(game.oppScore))) + '</span>'
    : '<span class="res upcoming">' + esc(formatWhen(game.startISO)) + '</span>';
  return '<a class="sched-row" href="#game/' + esc(game.id) + '">' +
    '<span class="sched-date">' + esc(formatDay(etDate(game.startISO) || '')) + '</span>' +
    '<span class="sched-opp">' + opponent + '</span>' + result + '</a>';
}

function rosterRowHTML(player) {
  return '<div class="roster-row"><span class="jersey">' + esc(player.jersey || '—') + '</span>' +
    '<span class="name">' + (player.id ? '<a href="#player/' + esc(player.id) + '">' + esc(player.name) + '</a>' : esc(player.name)) + '</span>' +
    '<span class="pos">' + esc(player.pos || '—') + '</span>' +
    '<span class="age">' + esc(player.height || '') + (player.age ? ' · ' + esc(player.age) : '') + '</span></div>';
}

function teamStatsHTML(bundle) {
  const diff = bundle.ppg == null || bundle.oppPpg == null ? null : bundle.ppg - bundle.oppPpg;
  const cells = [
    ['PPG', oneDecimal(bundle.ppg)],
    ['Opp PPG', oneDecimal(bundle.oppPpg)],
    ['Diff', signedDecimal(diff)],
    ['FG%', oneDecimal(bundle.stats.fgPct)],
    ['3P%', oneDecimal(bundle.stats.threePct)],
    ['REB', oneDecimal(bundle.stats.reb)],
    ['AST', oneDecimal(bundle.stats.ast)],
    ['TOV', oneDecimal(bundle.stats.tov)],
  ];
  return '<section class="card team-stats"><h2>Season stats</h2><div class="stat-grid">' +
    cells.map(([label, value]) => '<div class="stat-cell"><span class="stat-lbl">' + esc(label) + '</span>' +
      '<span class="stat-val' + (label === 'Diff' && diff != null && diff > 0 ? ' diff-pos' : '') + '">' + esc(value) + '</span></div>').join('') +
    '</div></section>';
}

async function showTeam(id) {
  stopPolling();
  const token = ++requestId;
  app.innerHTML = loadingHTML();

  let bundle;
  let roster;
  try {
    const both = await Promise.all([
      teamBundle(id),
      fetchJSON(API + '/teams/' + encodeURIComponent(id) + '/roster').then(parseRoster),
    ]);
    bundle = both[0];
    roster = both[1];
  } catch (err) {
    if (token === requestId) showError(() => showTeam(id));
    return;
  }
  if (token !== requestId) return;

  const schedule = bundle.schedule;
  const team = schedule.team;
  const head = '<div class="card team-head">' +
    (team.logo ? '<img src="' + esc(team.logo) + '" alt="" loading="lazy">' : '') +
    '<div class="team-meta"><h1>' + esc(team.name || 'Team') + '</h1>' +
    (team.record ? '<div class="record">' + esc(team.record) + '</div>' : '') + '</div>' +
    '<a class="cmp-link" href="#compare/' + esc(id) + '">Compare</a></div>';

  const scheduleList = schedule.games.length
    ? '<div class="card sched">' + schedule.games.map(scheduleRowHTML).join('') + '</div>'
    : '<div class="state">No games</div>';
  const rosterList = roster.length
    ? '<div class="card sched">' + roster.map(rosterRowHTML).join('') + '</div>'
    : '<div class="state">No roster</div>';

  app.innerHTML = head + teamStatsHTML(bundle) +
    '<div class="tabs-row" role="tablist">' +
    '<button class="tab" type="button" role="tab" data-panel="schedule" aria-selected="true">Schedule</button>' +
    '<button class="tab" type="button" role="tab" data-panel="roster" aria-selected="false">Roster</button>' +
    '</div>' +
    '<section data-view="schedule">' + scheduleList + '</section>' +
    '<section data-view="roster" hidden>' + rosterList + '</section>';

  const tabs = app.querySelectorAll('.tabs-row .tab');
  tabs.forEach((tab) => tab.addEventListener('click', () => {
    tabs.forEach((other) => other.setAttribute('aria-selected', String(other === tab)));
    app.querySelectorAll('section[data-view]').forEach((panel) => {
      panel.hidden = panel.getAttribute('data-view') !== tab.getAttribute('data-panel');
    });
  }));
}

/* ── Router ─────────────────────────────────────────────────────────────── */
function markNav(view) {
  document.querySelectorAll('[data-nav]').forEach((link) => {
    link.setAttribute('aria-current', link.getAttribute('data-nav') === view ? 'page' : 'false');
  });
}

function router() {
  stopPolling();
  const route = parseHash();
  markNav(route.view);

  if (route.view === 'standings') showStandings();
  else if (route.view === 'game' && route.arg) showGame(route.arg);
  else if (route.view === 'team' && route.arg) showTeam(route.arg);
  else if (route.view === 'compare') showCompare(route.args[0], route.args[1]);
  else if (route.view === 'leaders') showLeaders();
  else if (route.view === 'players') showPlayers(route.args[0], route.args[1]);
  else if (route.view === 'player' && route.arg) showPlayer(route.arg);
  else showScores(route.view === 'scores' ? route.arg : '');
}

window.addEventListener('hashchange', router);
initSearch();
router();
</script>
