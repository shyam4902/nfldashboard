// Same search component as the header, mounted on a picker field.
function bindPlayerSearch(inputId, listId, onPick) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if (!input || !list) return;
  let timer = 0;
  let controller = null;
  let results = [];
  let active = -1;

  const close = () => {
    if (timer) clearTimeout(timer);
    if (controller) controller.abort();
    list.hidden = true;
    list.innerHTML = '';
    results = [];
    active = -1;
    input.setAttribute('aria-expanded', 'false');
  };

  const paint = () => {
    list.innerHTML = results.length
      ? results.map((player) => searchOptionHTML(player, inputId + '-opt-')).join('')
      : '<li class="sr-empty" role="presentation">No NBA players found</li>';
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    list.querySelectorAll('[role="option"]').forEach((option, index) => {
      option.setAttribute('aria-selected', String(index === active));
    });
  };

  input.addEventListener('input', () => {
    if (timer) clearTimeout(timer);
    if (controller) controller.abort();
    const query = input.value.trim();
    if (query.length < 2) {
      close();
      return;
    }
    list.innerHTML = '<li class="sr-empty" role="presentation">Searching…</li>';
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    timer = setTimeout(async () => {
      controller = new AbortController();
      const signal = controller.signal;
      try {
        results = await searchPlayers(query, signal);
        if (signal.aborted) return;
        active = results.length ? 0 : -1;
        paint();
      } catch (err) {
        if (signal.aborted) return;
        results = [];
        active = -1;
        paint();
      }
    }, 250);
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      close();
      return;
    }
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      if (!results.length) return;
      event.preventDefault();
      active = (active + (event.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length;
      paint();
      return;
    }
    if (event.key === 'Enter' && results.length) {
      event.preventDefault();
      const picked = results[Math.max(0, active)];
      if (picked) onPick(picked.id);
    }
  });

  list.addEventListener('click', (event) => {
    const option = event.target.closest('[data-id]');
    if (option) onPick(option.getAttribute('data-id'));
  });

  // Registered so stopPolling() (every hash change) closes this picker too.
  pickerClosers.push(close);
}

async function playerEntry(id) {
  const [athleteJson, overviewJson] = await Promise.all([
    fetchJSON(WEB + '/athletes/' + encodeURIComponent(id)),
    fetchJSON(WEB + '/athletes/' + encodeURIComponent(id) + '/overview'),
  ]);
  return {
    id: String(id),
    athlete: parseAthlete(athleteJson),
    season: parsePlayerOverview(overviewJson).season,
  };
}

function playersHash(a, b) {
  return '#players' + (a ? '/' + a : '') + (a && b ? '/' + b : '');
}

async function showPlayers(idA, idB) {
  stopPolling();
  const token = ++requestId;
  const a = String(idA || '');
  const b = String(idB || '');
  const go = (nextA, nextB) => {
    const hash = playersHash(nextA, nextB);
    if (location.hash !== hash) location.hash = hash;
  };

  if (!a || !b) {
    app.innerHTML = playerPickerHTML() + '<div class="state">' +
      esc(a || b ? 'Pick the second player to compare.' : 'Search for two players to compare their season averages.') + '</div>';
    bindPlayerSearch('psA', 'psListA', (id) => go(id, b));
    bindPlayerSearch('psB', 'psListB', (id) => go(a, id));
    return;
  }

  app.innerHTML = playerPickerHTML() + loadingHTML();
  bindPlayerSearch('psA', 'psListA', (id) => go(id, b));
  bindPlayerSearch('psB', 'psListB', (id) => go(a, id));

  let left;
  let right;
  let colors;
  try {
    [left, right, colors] = await Promise.all([playerEntry(a), playerEntry(b), getTeamColors()]);
  } catch (err) {
    if (token === requestId) showError(() => showPlayers(a, b));
    return;
  }
  if (token !== requestId) return;

  setTitle(lastName(left.athlete.name) + ' vs ' + lastName(right.athlete.name));

  const team = (entry) => ({ id: entry.athlete.team.id, abbr: entry.athlete.team.abbr, logo: '' });
  const looks = gmLooks({ away: team(left), home: team(right) }, colors);
  const named = (entry) => ({ ...entry, abbr: lastName(entry.athlete.name) || 'Player' });
  const tape = gmTapeHTML(PLAYER_COMPARE_ROWS, named(left), named(right), looks,
    lastName(left.athlete.name) + ' vs ' + lastName(right.athlete.name) + ' · season averages', 'season averages');

  app.innerHTML = playerPickerHTML(left.athlete.name, right.athlete.name) +
    '<div class="pl pl-cmpw"><div class="pl-bug">' + plSideHTML(left, looks.away, 'away') + '<span class="pl-vs">vs</span>' +
    plSideHTML(right, looks.home, 'home') + '</div>' + (tape || '<div class="state">No averages to compare.</div>') + '</div>';
  bindPlayerSearch('psA', 'psListA', (id) => go(id, b));
  bindPlayerSearch('psB', 'psListB', (id) => go(a, id));
}

/* ── Game page: scorebug, tale of the tape, leaders, market blocks (gm-*) ──
   One layout for pre-game, live and final. Every block returns '' when its
   data is missing, so a payload with no BPI or no injuries just drops them. */
function gmLooks(game, colors) {
  const away = teamLook(colors, game.away.abbr, game.away.id, game.away.logo);
  const home = teamLook(colors, game.home.abbr, game.home.id, game.home.logo);
  // Two near-identical colours (both blue, say) make the bars unreadable, so
  // the home side moves to its alternate colour when that separates them.
  if (contrastRatio(away.fill, home.fill) < 1.35) {
    const entry = (colors && (colors.byAbbr[game.home.abbr] || colors.byId[String(game.home.id)])) || {};
    if (entry.alt && contrastRatio(away.fill, entry.alt) >= 1.35) {
      home.fill = entry.alt;
      home.ink = textOn(entry.alt);
    }
  }
  return { away, home };
}

function gmAbbr(side, look) {
  return '<span class="gm-abbr" style="color:' + readableOn(look.fill, PANEL_BG) + '">' + esc(side.abbr) + '</span>';
}

function gmBlockHTML(side, look, which, game) {
  const started = game.state !== 'pre' && side.score != null;
  const lost = game.state === 'post' && !side.winner;
  const split = which === 'home'
    ? (side.homeRecord ? side.homeRecord + ' home' : '')
    : (side.roadRecord ? side.roadRecord + ' road' : '');
  const logo = look.logo
    ? '<span class="gm-logo"><img src="' + esc(smallImg(look.logo, 72, 72)) + '" alt="" width="36" height="36" decoding="async"></span>'
    : '';
  return '<a class="gm-team ' + which + (started ? ' sc' : '') + (lost ? ' lost' : '') + '" href="#team/' + esc(side.id) + '" style="background:' + look.fill + ';color:' + look.ink + '">' +
    '<span class="gm-id">' + logo + '<span class="gm-ab">' + esc(side.abbr) + '</span></span>' +
    '<span class="gm-nm">' + esc(side.name) + '</span>' +
    '<span class="gm-rec">' + esc(side.record) + (split ? '<i>' + esc(split) + '</i>' : '') + restChipHTML(side.id, etDate(game.startISO)) + '</span>' +
    (started ? '<span class="gm-sc">' + esc(side.score) + '</span>' : '') + '</a>';
}

function gmMidHTML(game) {
  const live = game.state === 'in';
  const dayKey = etDate(game.startISO);
  const day = dayKey ? formatDay(dayKey) : '';
  const status = game.state === 'pre' ? (tipOff(game.startISO) || game.statusText || 'Scheduled') : (game.statusText || 'Final');
  const odds = game.odds;
  const line = [];
  if (odds && odds.details) line.push('<b>' + esc(odds.details) + '</b>');
  if (odds && odds.total != null) line.push('<span>O/U ' + esc(odds.total) + '</span>');
  return '<div class="gm-mid">' +
    (day ? '<span class="gm-day">' + esc(day) + '</span>' : '') +
    '<span class="gm-st' + (live ? ' live' : '') + '">' + (live ? '<i class="dot"></i>' : '') + esc(status) + '</span>' +
    (game.venue ? '<span class="gm-meta">' + esc(game.venue) + '</span>' : '') +
    (game.broadcast ? '<span class="gm-meta">' + esc(game.broadcast) + '</span>' : '') +
    (line.length ? '<span class="gm-line">' + line.join('') + '</span>' : '') + '</div>';
}

function gmBugHTML(game, looks) {
  return '<div class="gm-bug" data-rest-scope>' + gmBlockHTML(game.away, looks.away, 'away', game) + gmMidHTML(game) + gmBlockHTML(game.home, looks.home, 'home', game) + '</div>';
}

// Tale of the tape: values on the outside, bars grow from the centre in each
// team's colour. The better value gets the full bar; `lower` rows (turnovers,
// points allowed) flip which side is better. Rows with no data are dropped.
function gmTapeHTML(rows, left, right, looks, title, kind) {
  let shown = 0;
  const body = rows.map((row) => {
    const a = row.value(left);
    const b = row.value(right);
    if (a == null && b == null) return '';
    shown += 1;
    const share = barShares(a, b, row.lower);
    const lead = a != null && b != null && a !== b ? ((row.lower ? a < b : a > b) ? 'a' : 'b') : '';
    const val = (team, side) => {
      const sub = row.sub ? row.sub(team) : '';
      return '<b class="gm-v ' + side + (lead === side ? ' lead' : '') + '">' + esc(row.text(team)) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</b>';
    };
    const bar = (side, amount, fill) => '<span class="gm-bar ' + side + (lead === side ? ' lead' : '') + '"><i style="width:' + Math.round(amount * 100) + '%;background:' + fill + '"></i></span>';
    return '<div class="gm-tr">' + val(left, 'a') + bar('a', share.a, looks.away.fill) +
      '<span class="gm-k">' + esc(row.label) + '</span>' + bar('b', share.b, looks.home.fill) + val(right, 'b') + '</div>';
  }).join('');
  if (!shown) return '';
  return '<section class="card gm-card gm-tape" aria-label="' + esc(title) + '">' +
    '<div class="gm-th"><span class="a">' + gmAbbr(left, looks.away) + '</span><h2>Tale of the tape · ' + esc(kind) + '</h2><span class="b">' + gmAbbr(right, looks.home) + '</span></div>' +
    body + '</section>';
}

// Steals and blocks only exist for live and final games (from the box score).
const GM_LEADER_ROWS = [...LEADER_ROWS, ['STL', 'stl'], ['BLK', 'blk']];

function gmLeadersHTML(game, looks) {
  const leaders = game.leaders;
  if (!leaders) return '';
  const kind = (leaders.away && leaders.away.kind) || (leaders.home && leaders.home.kind);
  const col = (key) => {
    const lead = leaders[key];
    const side = game[key];
    const look = looks[key];
    if (!lead) return '';
    const rows = GM_LEADER_ROWS.filter(([, field]) => lead[field]).map(([label, field]) => {
      const p = lead[field];
      const shot = p.headshot
        ? '<img class="gm-hsimg" src="' + esc(smallImg(p.headshot, 120, 88)) + '" alt="" width="44" height="44" loading="lazy" decoding="async">'
        : '';
      const name = p.id ? '<a href="#player/' + esc(p.id) + '">' + esc(p.name) + '</a>' : esc(p.name);
      const sub = [p.pos, p.jersey ? '#' + p.jersey : '', lead.kind === 'game' ? p.line : ''].filter(Boolean).join(' · ');
      return '<div class="gm-lr"><span class="gm-hs" style="--c:' + look.fill + '">' + shot + '</span>' +
        '<span class="gm-lw"><span class="gm-ln">' + name + '</span><span class="gm-ls">' + esc(sub) + '</span></span>' +
        '<span class="gm-lv"><b>' + esc(p.value) + '</b><i>' + label + '</i></span></div>';
    }).join('');
    if (!rows) return '';
    return '<div class="gm-lcol"><div class="gm-lh" style="--c:' + look.fill + '">' + gmAbbr(side, look) + '<span>' + esc(side.name) + '</span></div>' + rows + '</div>';
  };
  const cols = col('away') + col('home');
  if (!cols) return '';
  return '<section class="card gm-card"><div class="gm-ch"><h2>Leaders</h2><span>' + esc(leaderCaption(kind, game)) + '</span></div><div class="gm-ld">' + cols + '</div></section>';
}

function gmLineScoreHTML(game, looks) {
  if (game.state === 'pre') return '';
  const n = Math.max(game.away.linescores.length, game.home.linescores.length);
  if (!n) return '';
  const label = (i) => (i < 4 ? String(i + 1) : 'OT' + (i > 4 ? i - 3 : ''));
  const head = '<tr><th></th>' + Array.from({ length: n }, (_, i) => '<th>' + label(i) + '</th>').join('') + '<th class="t">T</th></tr>';
  const row = (key) => {
    const side = game[key];
    return '<tr><th class="tm"><span class="sw" style="background:' + looks[key].fill + '"></span>' + esc(side.abbr) + '</th>' +
      Array.from({ length: n }, (_, i) => '<td>' + (side.linescores[i] == null ? '—' : esc(side.linescores[i])) + '</td>').join('') +
      '<td class="t">' + (side.score == null ? '—' : esc(side.score)) + '</td></tr>';
  };
  return '<section class="card gm-card"><div class="gm-ch"><h2>Line score</h2></div><div class="gm-ls-wrap"><table class="gm-lsc"><caption class="sr-only">Score by period</caption><thead>' +
    head + '</thead><tbody>' + row('away') + row('home') + '</tbody></table></div></section>';
}

function gmSeriesHTML(pre, game) {
  if (!pre || !pre.seasonSeries.length) return '';
  const team = (abbr, score, winner) => '<span class="gm-st2' + (!winner ? '' : abbr === winner ? ' w' : ' l') + '">' + esc(abbr) + ' <b>' + esc(score) + '</b></span>';
  const rows = pre.seasonSeries.map((g) => {
    const done = g.state === 'post';
    return '<a class="gm-sr' + (String(g.id) === String(game.id) ? ' now' : '') + '" href="#game/' + esc(g.id) + '">' +
      '<span class="d">' + esc(formatDay(etDate(g.date) || '')) + '</span>' +
      (done
        ? '<span class="m">' + team(g.away, g.awayScore, g.winnerAbbr) + '<i>@</i>' + team(g.home, g.homeScore, g.winnerAbbr) + '</span><span class="r">Final</span>'
        : '<span class="m"><span class="gm-st2">' + esc(g.away) + '</span><i>@</i><span class="gm-st2">' + esc(g.home) + '</span></span><span class="r up">' + (String(g.id) === String(game.id) ? 'This game' : 'Upcoming') + '</span>') +
      '</a>';
  }).join('');
  return '<section class="card gm-card"><div class="gm-ch"><h2>Season series</h2></div><div class="gm-srs">' + rows + '</div></section>';
}

function gmLastFiveHTML(game, pre, looks) {
  if (!pre) return '';
  const col = (key) => {
    const side = game[key];
    const games = pre.lastFive[side.abbr] || [];
    if (!games.length) return '';
    const chips = games.map((g) => {
      const date = formatDay(etDate(g.date) || '').replace(/^\w+,\s*/, '');
      return '<a class="gm-g ' + (g.result === 'W' ? 'W' : 'L') + '" href="#game/' + esc(g.id) + '" title="' + esc(date) + '">' +
        '<b>' + esc(g.result || '–') + '</b><span>' + esc(g.atVs + ' ' + g.opponentAbbr) + '</span><span>' + esc(g.score) + '</span><span class="dt">' + esc(date) + '</span></a>';
    }).join('');
    return '<div class="gm-l5c"><div class="gm-lh" style="--c:' + looks[key].fill + '">' + gmAbbr(side, looks[key]) + '</div><div class="gm-chips">' + chips + '</div></div>';
  };
  const cols = col('away') + col('home');
  if (!cols) return '';
  return '<section class="card gm-card"><div class="gm-ch"><h2>Last 5</h2></div><div class="gm-l5">' + cols + '</div></section>';
}

function gmOddsHTML(game, looks) {
  const odds = game.odds;
  if (!odds) return '';
  const cell = (main, sub) => '<span class="gm-ov">' + (main ? '<b>' + esc(main) + '</b>' : '<b class="none">—</b>') + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>';
  const rows = [];
  const sp = odds.spread;
  if (sp.away.line || sp.home.line) {
    const moved = (key) => (odds.spreadOpen[key] && odds.spreadOpen[key] !== sp[key].line ? 'open ' + odds.spreadOpen[key] : sp[key].odds);
    rows.push('<span class="gm-ok">Spread</span>' + cell(sp.away.line, moved('away')) + cell(sp.home.line, moved('home')));
  }
  if (odds.moneyline) rows.push('<span class="gm-ok">Moneyline</span>' + cell(odds.moneyline.away) + cell(odds.moneyline.home));
  const total = [];
  if (odds.total != null) {
    total.push('<span><i>Total</i> <b>' + esc(odds.total) + '</b></span>');
    if (odds.totalOpen != null && odds.totalOpen !== odds.total) total.push('<span><i>Opened</i> ' + esc(odds.totalOpen) + '</span>');
    if (odds.overOdds) total.push('<span><i>Over</i> ' + esc(odds.overOdds) + '</span>');
    if (odds.underOdds) total.push('<span><i>Under</i> ' + esc(odds.underOdds) + '</span>');
  }
  if (!rows.length && !total.length) return '';
  const head = rows.length
    ? '<span class="gm-ok"></span><span class="gm-ov h">' + gmAbbr(game.away, looks.away) + '</span><span class="gm-ov h">' + gmAbbr(game.home, looks.home) + '</span>'
    : '';
  return '<section class="card gm-card"><div class="gm-ch"><h2>Odds</h2>' + (odds.provider ? '<span>' + esc(odds.provider) + '</span>' : '') + '</div>' +
    (rows.length ? '<div class="gm-og">' + head + rows.join('') + '</div>' : '') +
    (total.length ? '<div class="gm-ot">' + total.join('') + '</div>' : '') + '</section>';
}

// BPI win chance before tip-off, the in-game win probability while live.
function gmWinChanceHTML(game, looks) {
  const bpi = game.state === 'pre' ? game.predictor : null;
  const live = game.state === 'in' ? game.winProb : null;
  const chance = bpi || live;
  if (!chance || chance.away + chance.home <= 0) return '';
  const pct = (value) => (Math.round(value * 10) / 10).toFixed(1) + '%';
  const top = (key) => '<span class="gm-wp ' + key + '">' + gmAbbr(game[key], looks[key]) + '<b>' + esc(pct(chance[key])) + '</b></span>';
  return '<section class="card gm-card"><div class="gm-ch"><h2>Win chance</h2><span>' + (bpi ? 'ESPN BPI' : 'Live') + '</span></div>' +
    '<div class="gm-wp-top">' + top('away') + top('home') + '</div>' +
    '<div class="gm-split" role="img" aria-label="' + esc(game.away.abbr + ' ' + pct(chance.away) + ', ' + game.home.abbr + ' ' + pct(chance.home)) + '">' +
    '<i style="flex:' + chance.away + ';background:' + looks.away.fill + '"></i><i style="flex:' + chance.home + ';background:' + looks.home.fill + '"></i></div></section>';
}

function gmInjuriesHTML(game, looks) {
  // ESPN's list is the current report, not the report as of a finished game.
  if (game.state === 'post' || !game.injuries) return '';
  const col = (key) => {
    const list = game.injuries[key];
    const rows = list.length
      ? list.map((p) => {
        const back = p.returnDate ? formatDay(p.returnDate.replace(/-/g, '')) : '';
        const note = [p.detail, back ? 'back ' + back : ''].filter(Boolean).join(' · ');
        return '<div class="gm-ir"><span class="gm-in">' + esc(p.name) + (p.pos ? '<i>' + esc(p.pos) + '</i>' : '') + '</span>' +
          '<span class="gm-sx' + (/^out/i.test(p.status) ? ' out' : '') + '">' + esc(p.status || 'Listed') + '</span>' +
          (note ? '<span class="gm-idt">' + esc(note) + '</span>' : '') + '</div>';
      }).join('')
      : '<div class="gm-none">No injuries listed.</div>';
    return '<div class="gm-icol"><div class="gm-lh" style="--c:' + looks[key].fill + '">' + gmAbbr(game[key], looks[key]) + '<span>' + esc(game[key].name) + '</span></div>' + rows + '</div>';
  };
  return '<section class="card gm-card"><div class="gm-ch"><h2>Injuries</h2></div>' + col('away') + col('home') + '</section>';
}

function gmAtsHTML(game, looks) {
  if (!game.ats) return '';
  const col = (key) => {
    const list = game.ats[key];
    if (!list.length) return '';
    return '<div class="gm-icol"><div class="gm-lh" style="--c:' + looks[key].fill + '">' + gmAbbr(game[key], looks[key]) + '</div>' +
      list.map((r) => '<div class="gm-ar"><span>' + esc(r.label) + '</span><b>' + esc(r.summary) + '</b></div>').join('') + '</div>';
  };
  const cols = col('away') + col('home');
  return cols ? '<section class="card gm-card"><div class="gm-ch"><h2>Against the spread</h2></div>' + cols + '</section>' : '';
}

// Which game chart is showing: 'm' margin or 'w' win probability. Kept across
// live refreshes so polling does not flip it back.
let gmChart = 'm';

function gmPageHTML(game, parts) {
  const looks = parts.looks;
  const json = parts.json;
  const flow = json ? parseGameFlow(json) : null;
  const periods = json ? parsePeriodScoring(json) : [];
  const lines = pxHeadline(flow, game);
  const head = lines.length ? '<p class="gm-head">' + esc(lines[0]) + (lines.length > 1 ? ' <span>' + esc(lines.slice(1).join(' ')) + '</span>' : '') + '</p>' : '';
  const tiles = gmTilesHTML(flow, game, looks);
  const hasWp = Boolean(flow && flow.wp.length > 1);
  const view = hasWp ? gmChart : 'm';
  const chart = flow && flow.points.length > 1
    ? '<section class="card gm-card"><div class="gm-ch"><h2>How the game moved</h2>' +
      (hasWp ? '<div class="seg gm-seg" role="group" aria-label="Chart"><button type="button" data-chart="m" aria-pressed="' + (view === 'm') + '">Margin</button><button type="button" data-chart="w" aria-pressed="' + (view === 'w') + '">Win probability</button></div>' : '') +
      '</div><div class="gm-pane gm-reveal" data-pane="m"' + (view === 'm' ? '' : ' hidden') + '>' + pxFlowSVG(flow, game, looks, { h: 220 }) + '</div>' +
      (hasWp ? '<div class="gm-pane gm-reveal" data-pane="w"' + (view === 'w' ? '' : ' hidden') + '>' + pxWinProbSVG(flow, game, looks, { h: 220 }) + '</div>' : '') + '</section>'
    : '';
  const left = chart + parts.tape + gmOddsHTML(game, looks) + gmWinChanceHTML(game, looks);
  const right = gmQuartersHTML(periods, game, looks) + (periods.length ? '' : gmLineScoreHTML(game, looks)) + gmLeadersHTML(game, looks) +
    gmSeriesHTML(parts.pre, game) + gmLastFiveHTML(game, parts.pre, looks) + gmInjuriesHTML(game, looks) + gmAtsHTML(game, looks);
  // Entrance motion on first paint only; a live refresh redraws in place.
  const rise = (html, start) => (parts.refresh ? html : gmStagger(html, start));
  return '<div class="gm' + (parts.refresh ? ' gm-still' : '') + '"><div class="gm-hero" style="--ca:' + looks.away.fill + ';--ch:' + looks.home.fill + '">' + gmBugHTML(game, looks) + head + '</div>' +
    (parts.live ? '<div class="gm-live">Live · updates every 30s</div>' : '') +
    (tiles ? '<div class="gm-row">' + tiles + '</div>' : '') +
    '<div class="gm-cols' + (left && right ? ' two' : '') + '">' +
    (left ? '<div class="gm-col">' + rise(left, 0) + '</div>' : '') + (right ? '<div class="gm-col">' + rise(right, 2) + '</div>' : '') + '</div>' +
    (parts.box || '') +
    '<a class="cmp-link" href="#compare/' + esc(game.away.id) + '/' + esc(game.home.id) + '">Full comparison →</a></div>';
}

async function showPreGame(game, pre, token, colors) {
  const settled = await Promise.all([game.away.id, game.home.id].map((id) => teamBundle(id).catch(() => null)));
  if (token !== requestId) return;
  const looks = gmLooks(game, colors);
  const [away, home] = settled;

  setTitle(game.away.abbr + ' vs ' + game.home.abbr);

  const tape = away && home
    ? gmTapeHTML(COMPARE_ROWS, away, home, looks, game.away.abbr + ' at ' + game.home.abbr + ' season comparison', 'season')
    : '';
  app.innerHTML = gmPageHTML(game, { looks, tape, pre, live: false, box: '' });
  watchRest(app);
}

function armGamePoll(id) {
  gameTimer = setTimeout(() => {
    const route = parseHash();
    if (route.view === 'game' && route.arg === String(id)) showGame(id, true);
  }, POLL_MS);
}

async function showGame(id, isRefresh = false) {
  stopPolling();
  const token = ++requestId;
  if (!isRefresh) app.innerHTML = loadingHTML();

  let json;
  let colors;
  try {
    [json, colors] = await Promise.all([fetchJSON(API + '/summary?event=' + encodeURIComponent(id)), getTeamColors()]);
  } catch (err) {
    if (token !== requestId) return;
    if (isRefresh) armGamePoll(id);
    else showError(() => showGame(id));
    return;
  }
  if (token !== requestId) return;

  const box = parseBoxScore(json);
  const game = parseGameExtras(json);
  const pre = parsePreGame(json);

  if (game.away && game.home && box.teams.length) {
    renderBoxScore(box, game, pre, colors, json, isRefresh);
    if (box.state === 'in') armGamePoll(id);
    return;
  }

  if (game.away && game.home && box.state === 'pre') {
    await showPreGame(game, pre, token, colors);
    return;
  }

  app.innerHTML = '<div class="state">No box score for this game.<br><a class="nav" href="#scores">Back to scores</a></div>';
}

// Team comparison from the box-score totals, for live and final games. Made -
// attempted lines are compared on the percentage the shot line implies and
// shown small under it. The last four rows are team counts from the summary.
const BOX_ROWS = [
  { label: 'FG%', value: (team) => team.shooting.fg, text: (team) => oneDecimal(team.shooting.fg), sub: (team) => team.totals.FG || '' },
  { label: '3P%', value: (team) => team.shooting.three, text: (team) => oneDecimal(team.shooting.three), sub: (team) => team.totals['3PT'] || '' },
  { label: 'FT%', value: (team) => team.shooting.ft, text: (team) => oneDecimal(team.shooting.ft), sub: (team) => team.totals.FT || '' },
  { label: 'REB', value: (team) => team.totals.REB, text: (team) => wholeNumber(team.totals.REB) },
  { label: 'AST', value: (team) => team.totals.AST, text: (team) => wholeNumber(team.totals.AST) },
  { label: 'TOV', value: (team) => team.totals.TO, text: (team) => wholeNumber(team.totals.TO), lower: true },
  { label: 'STL', value: (team) => team.totals.STL, text: (team) => wholeNumber(team.totals.STL) },
  { label: 'BLK', value: (team) => team.totals.BLK, text: (team) => wholeNumber(team.totals.BLK) },
  { label: 'Paint', value: (team) => team.counts && team.counts.paint, text: (team) => wholeNumber(team.counts && team.counts.paint) },
  { label: 'Fast break', value: (team) => team.counts && team.counts.fastBreak, text: (team) => wholeNumber(team.counts && team.counts.fastBreak) },
  { label: 'Pts off TO', value: (team) => team.counts && team.counts.offTurnovers, text: (team) => wholeNumber(team.counts && team.counts.offTurnovers) },
  { label: 'Max lead', value: (team) => team.counts && team.counts.largestLead, text: (team) => wholeNumber(team.counts && team.counts.largestLead) },
];

function renderBoxScore(box, game, pre, colors, json, refresh) {
  const looks = gmLooks(game, colors);
  const awayBox = box.teams.find((team) => team.abbr === game.away.abbr) || box.teams[0];
  const homeBox = box.teams.find((team) => team.abbr === game.home.abbr) || box.teams[1];
  const withCounts = (team, key) => ({ ...team, counts: game.counts ? game.counts[key] : null });

  setTitle(game.away.abbr + ' vs ' + game.home.abbr);
  game = withBoxLeaders(game, { away: awayBox, home: homeBox });

  const tape = awayBox && homeBox
    ? gmTapeHTML(BOX_ROWS, withCounts(awayBox, 'away'), withCounts(homeBox, 'home'), looks, game.away.abbr + ' vs ' + game.home.abbr + ' game stats', 'this game')
    : '';
  const tables = box.teams.map((team) => boxTableHTML(team, team.abbr === game.home.abbr ? looks.home : looks.away)).join('');
  app.innerHTML = gmPageHTML(game, { looks, tape, pre, live: box.state === 'in', box: '<h2 class="gm-sh">Box score</h2>' + tables, json, refresh });
  watchRest(app);
  wireGameChart();
}

/* ── Team page (tm-*) ───────────────────────────────────────────────────── */
// One game row: date, opponent with its colour swatch, W/L chip and result (or

    (opp.logo ? '<img src="' + esc(smallImg(opp.logo, 36, 36)) + '" alt="" width="18" height="18" loading="lazy" decoding="async">' : '') +

    '<span class="tm-r">' + (next ? '<em>Next</em>' : '') + result + '</span></a>';

function tmRosterCardHTML(player, look) {
  const shot = player.headshot
    ? '<img src="' + esc(smallImg(player.headshot, 96, 70)) + '" alt="" width="48" height="48" loading="lazy" decoding="async" onerror="this.remove()">'
    : '';
  const sub = [player.height, player.age ? player.age + ' yrs' : ''].filter(Boolean).join(' · ');
  const name = player.id ? '<a href="#player/' + esc(player.id) + '">' + esc(player.name) + '</a>' : esc(player.name);
  return '<div class="tm-p"><span class="tm-hs" style="--c:' + look.fill + '">' + shot + '</span>' +
    '<span class="tm-pw"><span class="tm-pn">' + name + '</span><span class="tm-ps">' + esc(sub) + '</span></span>' +
    '<span class="tm-pp"><b>' + esc(player.pos || '—') + '</b>' + (player.jersey ? '<i>#' + esc(player.jersey) + '</i>' : '') + '</span></div>';
}

function tmHeroHTML(bundle, row, look) {
  const logo = look.logo || bundle.logo;
  const chips = [];
  if (row && row.seed != null) chips.push(['Seed', ordinal(row.seed) + ' ' + row.conf]);
  if (row && row.streak) chips.push(['Streak', row.streak]);
  if (row && row.last10) chips.push(['L10', row.last10]);
  if (row && row.home) chips.push(['Home', row.home]);
  if (row && row.road) chips.push(['Road', row.road]);
  const chip = contrastRatio(look.fill, '#ffffff') >= contrastRatio(look.fill, '#000000') ? 'rgba(0,0,0,0.24)' : 'rgba(255,255,255,0.4)';
  return '<div class="tm-hero" style="background:' + look.fill + ';color:' + look.ink + ';--chip:' + chip + '">' +
    '<div class="tm-id">' +
    (logo ? '<span class="tm-logo"><img src="' + esc(smallImg(logo, 112, 112)) + '" alt="" width="52" height="52" decoding="async"></span>' : '') +
    '<div class="tm-nm"><h1>' + esc(bundle.name || 'Team') + '</h1>' +
    '<span class="tm-rec">' + esc(bundle.record || '') +
    (bundle.pct != null ? '<i>' + esc(formatPct(bundle.pct)) + '</i>' : '') + '</span></div>' +
    '<a class="tm-cmp" href="#compare/' + esc(bundle.id) + '">Compare</a></div>' +
    (chips.length ? '<div class="tm-chips">' + chips.map(([k, v]) => '<span><i>' + k + '</i><b>' + esc(v) + '</b></span>').join('') + '</div>' : '') + '</div>';
}

// Season grid. League rank only where every team's number is on hand: the
// standings rows carry points for and against and win percentage.
function tmStatsHTML(bundle, rows, look) {
  const rank = (read, lower) => {
    const r = leagueRank(rows, bundle.id, read, lower);
    return r ? ordinal(r.rank) : '';
  };
  const diff = bundle.ppg == null || bundle.oppPpg == null ? null : bundle.ppg - bundle.oppPpg;
  const cells = [
    ['PPG', oneDecimal(bundle.ppg), rank((r) => r.ppg)],
    ['Opp PPG', oneDecimal(bundle.oppPpg), rank((r) => r.oppPpg, true)],
    ['Diff', signedDecimal(diff), rank(pointDiff)],
    ['Win %', bundle.pct == null ? '—' : formatPct(bundle.pct), rank((r) => r.pct)],
    ['FG%', oneDecimal(bundle.stats.fgPct), ''],
    ['3P%', oneDecimal(bundle.stats.threePct), ''],
    ['FT%', oneDecimal(bundle.stats.ftPct), ''],
    ['REB', oneDecimal(bundle.stats.reb), ''],
    ['AST', oneDecimal(bundle.stats.ast), ''],
    ['TOV', oneDecimal(bundle.stats.tov), ''],
    ['STL', oneDecimal(bundle.stats.stl), ''],
    ['BLK', oneDecimal(bundle.stats.blk), ''],
  ].filter((cell) => cell[1] !== '—');
  if (!cells.length) return '';
  const rk = readableOn(look.fill, PANEL_BG);
  return '<section class="card tm-stats"><div class="tm-ch"><h2>Season stats</h2><span>Per game · rank of 30</span></div><div class="tm-sg">' +
    cells.map(([label, value, rankText]) => '<div class="tm-c"><span class="k">' + esc(label) + '</span><b>' + esc(value) + '</b>' +
      (rankText ? '<span class="rk" style="color:' + rk + '">' + esc(rankText) + '</span>' : '') + '</div>').join('') +
    '</div></section>';
}

async function showTeam(id) {
  stopPolling();
  const token = ++requestId;
  app.innerHTML = loadingHTML();

  let bundle;
  let roster;
  let colors;
  let standings;
  try {
    [bundle, roster, colors, standings] = await Promise.all([
      teamBundle(id),
      fetchJSON(API + '/teams/' + encodeURIComponent(id) + '/roster').then(parseRoster),
      getTeamColors(),
      getStandings(),
    ]);
  } catch (err) {
    if (token === requestId) showError(() => showTeam(id));
    return;
  }
  if (token !== requestId) return;

  const row = standingFor(standings, id);
  const rows = [...standings.East, ...standings.West];
  const look = teamLook(colors, bundle.abbr, id, bundle.logo);
  bundle.pct = row ? row.pct : null;
  setTitle(bundle.name);

  const games = bundle.schedule.games.slice().sort((x, y) => new Date(x.startISO) - new Date(y.startISO));
  const upcoming = games.filter((game) => game.result === null);
  const played = games.filter((game) => game.result !== null).reverse();
  const nextId = upcoming.length ? upcoming[0].id : '';
  const list = (title, items, empty) => '<div class="tm-col"><div class="tm-ch"><h2>' + title + '</h2><span>' + items.length + ' games</span></div>' +
    (items.length ? '<div class="tm-gl">' + items.map((game) => tmRowHTML(game, colors, game.id === nextId)).join('') + '</div>' : '<div class="gm-none">' + empty + '</div>') + '</div>';
  const scheduleList = games.length
    ? '<div class="card tm-sched">' + list('Upcoming', upcoming, 'No games left.') + list('Results', played, 'No games played yet.') + '</div>'
    : '<div class="state">No games</div>';
  const rosterList = roster.length
    ? '<div class="tm-roster">' + roster.map((player) => tmRosterCardHTML(player, look)).join('') + '</div>'
    : '<div class="state">No roster</div>';

  app.innerHTML = '<div class="tm">' + tmHeroHTML(bundle, row, look) + tmStatsHTML(bundle, rows, look) + injuryCardHTML(roster) +
    '<div class="tabs-row" role="tablist">' +
    '<button class="tab" type="button" role="tab" data-panel="schedule" aria-selected="true">Schedule</button>' +
    '<button class="tab" type="button" role="tab" data-panel="roster" aria-selected="false">Roster</button>' +
    '<button class="tab" type="button" role="tab" data-panel="stats" aria-selected="false">Stats</button>' +
    '</div>' +
    '<section data-view="schedule">' + scheduleList + '</section>' +
    '<section data-view="roster" hidden>' + rosterList + '</section>' +
    '<section data-view="stats" hidden><div class="state"><span class="pulse"></span>Loading…</div></section></div>';

  const tabs = app.querySelectorAll('.tabs-row .tab');
  tabs.forEach((tab) => tab.addEventListener('click', () => {
    tabs.forEach((other) => other.setAttribute('aria-selected', String(other === tab)));
    app.querySelectorAll('section[data-view]').forEach((panel) => {
      panel.hidden = panel.getAttribute('data-view') !== tab.getAttribute('data-panel');
    });
    if (tab.getAttribute('data-panel') === 'stats') fillTeamStats(app.querySelector('section[data-view="stats"]'), id, look, token);
  }));
}

// Injury report from the team's ESPN roster: each listed player's status and
// when it was posted. Out and injured reserve read red, the rest amber.
function injuryCardHTML(roster) {
  const hurt = (roster || []).filter((p) => p.injury);
  const day = (iso) => { const d = new Date(iso); return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
  const sev = (s) => (/out|reserve|suspend/i.test(s) ? 'out' : 'q');
  return '<section class="card inj"><div class="inj-h"><h2>Injury report</h2><span>' + (hurt.length ? hurt.length + ' listed' : 'No one listed') + ' · ESPN</span></div>' +
    (hurt.length ? '<div class="inj-l">' + hurt.map((p) => '<div class="inj-r"><a href="#player/' + esc(p.id) + '">' + esc(p.name) + '</a><span class="inj-p">' + esc(p.pos) + '</span>' +
      '<span class="inj-s ' + sev(p.injury.status) + '">' + esc(p.injury.status) + '</span><span class="inj-d">' + esc(day(p.injury.date)) + '</span></div>').join('') + '</div>' : '') + '</section>';
}

/* ── Stats (#stats, #stats/<teamId>) ───────────────────────────────────────
   #stats is the league table from the standings already loaded elsewhere;
   #stats/<id> is every player's season line from ESPN's team athlete
   statistics, the table ESPN shows on a team's Stats page. Tables sort on a
   header click and scroll sideways inside their card on a phone. */
const STATS_MODE_KEY = 'mb.nba.stats.mode';
const playerStatsCache = new Map();

function getTeamPlayerStats(id) {
  const key = String(id);
  if (!playerStatsCache.has(key)) {
    playerStatsCache.set(key, fetchJSON('https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/teams/' + encodeURIComponent(key) + '/athletes/statistics')
      .then(parseTeamPlayerStats)
      .catch((err) => { playerStatsCache.delete(key); throw err; }));
  }
  return playerStatsCache.get(key);
}

// A cell with its sort value. null sorts last both ways and shows a dash.
function sCell(value, text, cls) {
  return '<td' + (cls ? ' class="' + cls + '"' : '') + ' data-v="' + (value == null ? '' : esc(value)) + '">' + (value == null ? '—' : esc(text == null ? value : text)) + '</td>';
}

function makeSortable(table) {
  table.querySelectorAll('thead th[data-sort]').forEach((th) => th.addEventListener('click', () => {
    const idx = Array.prototype.indexOf.call(th.parentNode.children, th);
    const desc = th.getAttribute('aria-sort') !== 'descending';
    table.querySelectorAll('thead th').forEach((h) => h.removeAttribute('aria-sort'));
    th.setAttribute('aria-sort', desc ? 'descending' : 'ascending');
    const body = table.tBodies[0];
    const text = th.getAttribute('data-sort') === 'text';
    const val = (row) => row.cells[idx].getAttribute('data-v');
    Array.from(body.rows).sort((a, b) => {
      const x = val(a), y = val(b);
      if (x === '' || y === '') return x === y ? 0 : x === '' ? 1 : -1;
      const c = text ? x.localeCompare(y) : Number(x) - Number(y);
      return desc ? -c : c;
    }).forEach((row) => body.appendChild(row));
  }));
}

const PCT1 = (v) => v.toFixed(1);
const FIX1 = (v) => v.toFixed(1);
const INT = (v) => String(Math.round(v));

// One team's player table. mode is 'per' (per game) or 'tot' (season totals).
function playerStatsTableHTML(data, look, mode) {
  const per = mode !== 'tot';
  const fmt = per ? FIX1 : INT;
  const ma = (m, a) => (m == null || a == null ? null : per ? m.toFixed(1) + '-' + a.toFixed(1) : Math.round(m) + '-' + Math.round(a));
  const head = [['Player', 'text', 'l sticky'], ['POS', 'text', 'l'], ['GP'], ['GS'], ['MIN'], ['PTS'], ['REB'], ['AST'], ['STL'], ['BLK'], ['TO'],
    ['FG'], ['FG%'], ['3P'], ['3P%'], ['FT'], ['FT%'], ['OREB'], ['DREB'], ['PF']];
  const rows = data.players.map((p) => {
    const l = per ? p.perGame : p.totals;
    return '<tr style="--c:' + look.fill + '"><td class="nm l sticky" data-v="' + esc(p.name) + '"><span class="sw"></span><a href="#player/' + esc(p.id) + '">' + esc(p.name) + '</a></td>' +
      sCell(p.pos || null, null, 'dim l') + sCell(p.gp, null) + sCell(p.gs, null) + sCell(l.min, l.min == null ? null : fmt(l.min)) +
      sCell(l.pts, l.pts == null ? null : fmt(l.pts), 'b') + sCell(l.reb, l.reb == null ? null : fmt(l.reb)) + sCell(l.ast, l.ast == null ? null : fmt(l.ast)) +
      sCell(l.stl, l.stl == null ? null : fmt(l.stl)) + sCell(l.blk, l.blk == null ? null : fmt(l.blk)) + sCell(l.to, l.to == null ? null : fmt(l.to)) +
      sCell(l.fgm, ma(l.fgm, l.fga), 'dim') + sCell(p.fgPct, p.fgPct == null ? null : PCT1(p.fgPct)) +
      sCell(l.tpm, ma(l.tpm, l.tpa), 'dim') + sCell(p.tpPct, p.tpPct == null ? null : PCT1(p.tpPct)) +
      sCell(l.ftm, ma(l.ftm, l.fta), 'dim') + sCell(p.ftPct, p.ftPct == null ? null : PCT1(p.ftPct)) +
      sCell(l.oreb, l.oreb == null ? null : fmt(l.oreb)) + sCell(l.dreb, l.dreb == null ? null : fmt(l.dreb)) + sCell(l.pf, l.pf == null ? null : fmt(l.pf)) + '</tr>';
  }).join('');
  return '<div class="ld-scroll"><table class="ld-t st-t"><caption class="sr-only">' + esc(data.team.name) + ' player stats, ' + (per ? 'per game' : 'season totals') + '</caption><thead><tr>' +
    head.map(([label, kind, cls]) => '<th' + (cls ? ' class="' + cls + '"' : '') + ' data-sort="' + (kind || 'num') + '"' + (label === 'PTS' ? ' aria-sort="descending"' : '') + ' scope="col">' + esc(label) + '</th>').join('') +
    '</tr></thead><tbody>' + (rows || '<tr><td class="l" colspan="20">No player stats yet this season.</td></tr>') + '</tbody></table></div>';
}

// The Per game / Totals switch plus the table, wired. Used by #stats/<id> and
// the team page's Stats tab.
function playerStatsBlockHTML(data, look, mode) {
  return '<section class="card st-card"><div class="ld-ch"><h2>Player stats</h2>' +
    '<div class="seg st-mode" role="group" aria-label="Per game or totals">' +
    [['per', 'Per game'], ['tot', 'Totals']].map(([k, t]) => '<button type="button" data-v="' + k + '" aria-pressed="' + (k === mode) + '">' + t + '</button>').join('') +
    '</div></div><div class="st-body">' + playerStatsTableHTML(data, look, mode) + '</div>' +
    '<p class="ld-note">' + esc(data.season ? data.season + ' regular season' : 'Regular season') + ' · ESPN. Click a column to sort; percentages are blank with no attempts.</p></section>';
}

function wirePlayerStats(root, data, look) {
  const table = () => root.querySelector('.st-t');
  makeSortable(table());
  const seg = root.querySelector('.st-mode');
  seg.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-v]');
    if (!button) return;
    const mode = button.getAttribute('data-v');
    savePref(STATS_MODE_KEY, mode);
    seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
    root.querySelector('.st-body').innerHTML = playerStatsTableHTML(data, look, mode);
    makeSortable(table());
  });
}

async function fillTeamStats(host, id, look, token) {
  if (!host || host.getAttribute('data-filled')) return;
  host.setAttribute('data-filled', '1');
  try {
    const data = await getTeamPlayerStats(id);
    if (token !== requestId) return;
    host.innerHTML = playerStatsBlockHTML(data, look, readPref(STATS_MODE_KEY, ['per', 'tot'], 'per'));
    wirePlayerStats(host, data, look);
  } catch (err) {
    host.removeAttribute('data-filled');
    host.innerHTML = '<div class="state">Player stats did not load. Open the tab again to retry.</div>';
  }
}

function leagueStatsTableHTML(rows, colors) {
  const head = [['Team', 'text', 'l sticky'], ['Conf', 'text', 'l'], ['W'], ['L'], ['PCT'], ['PPG'], ['OPP'], ['DIFF'], ['Home', 'text'], ['Road', 'text'], ['L10', 'text'], ['Strk', 'text']];
  const body = rows.map((r) => {
    const look = teamLook(colors, r.abbr, r.teamId, r.logo);
    const diff = r.ppg != null && r.oppPpg != null ? r.ppg - r.oppPpg : null;
    return '<tr style="--c:' + look.fill + '"><td class="nm l sticky" data-v="' + esc(r.name) + '"><span class="sw"></span><a href="#stats/' + esc(r.teamId) + '">' + esc(r.name) + '</a></td>' +
      sCell(r.conf, null, 'dim l') + sCell(r.wins, null) + sCell(r.losses, null) + sCell(r.pct, r.pct == null ? null : r.pct.toFixed(3).replace(/^0/, '')) +
      sCell(r.ppg, r.ppg == null ? null : r.ppg.toFixed(1), 'b') + sCell(r.oppPpg, r.oppPpg == null ? null : r.oppPpg.toFixed(1)) +
      sCell(diff, diff == null ? null : (diff > 0 ? '+' : '') + diff.toFixed(1)) +
      sCell(r.home || null) + sCell(r.road || null) + sCell(r.last10 || null) + sCell(r.streak || null) + '</tr>';
  }).join('');
  return '<div class="ld-scroll"><table class="ld-t st-t"><caption class="sr-only">NBA team stats</caption><thead><tr>' +
    head.map(([label, kind, cls]) => '<th' + (cls ? ' class="' + cls + '"' : '') + ' data-sort="' + (kind || 'num') + '"' + (label === 'PCT' ? ' aria-sort="descending"' : '') + ' scope="col">' + esc(label) + '</th>').join('') +
    '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

function statsTeamPickHTML(rows, current) {
  const sorted = rows.slice().sort((a, b) => a.name.localeCompare(b.name));
  return '<label class="st-pick"><span class="sr-only">Team</span><select onchange="location.hash = this.value ? \'#stats/\' + this.value : \'#stats\'">' +
    '<option value="">All teams</option>' +
    sorted.map((r) => '<option value="' + esc(r.teamId) + '"' + (r.teamId === String(current) ? ' selected' : '') + '>' + esc(r.name) + '</option>').join('') +
    '</select></label>';
}

async function showStats(teamId) {
  stopPolling();
  const token = ++requestId;
  app.innerHTML = loadingHTML();
  let colors;
  let standings;
  let data = null;
  try {
    [colors, standings, data] = await Promise.all([getTeamColors(), getStandings(), teamId ? getTeamPlayerStats(teamId) : null]);
  } catch (err) {
    if (token === requestId) showError(() => showStats(teamId));
    return;
  }
  if (token !== requestId) return;
  const rows = [...standings.East, ...standings.West];
  if (!teamId) {
    setTitle('NBA Stats');
    const sorted = rows.slice().sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1));
    app.innerHTML = '<div class="ld-bar"><h1>Team stats</h1>' + statsTeamPickHTML(rows, '') + '</div>' +
      '<section class="card st-card"><div class="ld-ch"><h2>All 30 teams</h2><span>Pick a team for every player\'s line</span></div>' +
      leagueStatsTableHTML(sorted, colors) + '<p class="ld-note">ESPN standings. Click a column to sort.</p></section>';
    makeSortable(app.querySelector('.st-t'));
    return;
  }
  const row = rows.find((r) => r.teamId === String(teamId));
  const look = teamLook(colors, data.team.abbr || (row && row.abbr), teamId, row && row.logo);

  const record = row && row.wins != null ? row.wins + '-' + row.losses : '';
  app.innerHTML = '<div class="ld-bar"><h1>' + esc(data.team.name || 'Team') + (record ? ' <span class="st-rec">' + esc(record) + '</span>' : '') + '</h1>' +
    statsTeamPickHTML(rows, teamId) + '<a class="st-link" href="#team/' + esc(teamId) + '">Team page →</a></div>' +
    playerStatsBlockHTML(data, look, readPref(STATS_MODE_KEY, ['per', 'tot'], 'per'));
  wirePlayerStats(app.querySelector('.st-card'), data, look);
}

/* ── Shared charts and play-by-play facts (px-*) ──────────────────────────
   Every number here comes from an ESPN payload: the game summary (play-by-play
   and box score) or the scoreboard. A block whose data is missing returns ''
   and is not drawn. */
const summaryCache = new Map();

// One summary request per game per page load, for the scores inspector.
function getSummary(id) {
  const key = String(id || '');
  if (!key) return Promise.resolve(null);
  if (!summaryCache.has(key)) {
    summaryCache.set(key, fetchJSON(API + '/summary?event=' + encodeURIComponent(key)).catch(() => {
      summaryCache.delete(key);
      return null;
    }));
  }
  return summaryCache.get(key);
}

function periodName(period) {
  return period <= 4 ? 'Q' + period : 'OT' + (period > 5 ? period - 4 : '');
}

// Seconds from tip-off to "Q2 4:31" (time left in that period).
function clockLabel(t) {
  const period = t < 2880 ? Math.min(4, Math.floor(t / 720) + 1) : 5 + Math.floor((t - 2880) / 300);
  const left = Math.max(0, Math.round(periodStart(period) + (period <= 4 ? 720 : 300) - t));
  return periodName(period) + ' ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
}

// A team colour that reads as a line (3:1) or a label (4.5:1) on the dark panel.
function inkOf(look, target = 3) {
  return readableOn(look.fill, PANEL_BG, target);
}

const pctText = (value) => (value == null ? '—' : Math.round(value) + '%');

// The score margin through the game as a step chart: above the line the home
// side leads, below it the away side. Quarter lines, both biggest leads marked.
function pxFlowSVG(flow, game, looks, opts = {}) {
  if (!flow || flow.points.length < 2) return '';
  const W = 1000;
  const H = opts.h || 180;
  const mid = H / 2;
  const top = Math.max(flow.largest.home.lead, flow.largest.away.lead, 5);
  const span = Math.ceil(top / 5) * 5;
  const x = (t) => (t / flow.end) * W;
  const y = (m) => mid - (m / span) * (mid - 6);
  let d = 'M0 ' + mid;
  for (const p of flow.points.slice(1)) d += ' H' + x(p.t).toFixed(1) + ' V' + y(p.home - p.away).toFixed(1);
  d += ' H' + W;
  const area = d + ' V' + mid + ' Z';
  const homeInk = inkOf(looks.home);
  const awayInk = inkOf(looks.away);
  const homeText = inkOf(looks.home, 4.5);
  const awayText = inkOf(looks.away, 4.5);
  const uid = 'fx' + game.id + (opts.uid || '');
  const quarters = [];
  for (let p = 2; p <= flow.periods; p += 1) quarters.push('<line class="px-q" x1="' + x(periodStart(p)) + '" x2="' + x(periodStart(p)) + '" y1="0" y2="' + H + '"/>');
  const gridY = [span, span / 2, -span / 2, -span].map((m) => '<line class="px-g" x1="0" x2="' + W + '" y1="' + y(m).toFixed(1) + '" y2="' + y(m).toFixed(1) + '"/>').join('');
  const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<defs><clipPath id="' + uid + 'h"><rect x="0" y="0" width="' + W + '" height="' + mid + '"/></clipPath>' +
    '<clipPath id="' + uid + 'a"><rect x="0" y="' + mid + '" width="' + W + '" height="' + mid + '"/></clipPath></defs>' +
    gridY + quarters.join('') +
    '<path d="' + area + '" fill="' + looks.home.fill + '" fill-opacity="0.55" clip-path="url(#' + uid + 'h)"/>' +
    '<path d="' + area + '" fill="' + looks.away.fill + '" fill-opacity="0.55" clip-path="url(#' + uid + 'a)"/>' +
    '<path class="px-line" d="' + d + '" fill="none" stroke="' + homeInk + '" clip-path="url(#' + uid + 'h)"/>' +
    '<path class="px-line" d="' + d + '" fill="none" stroke="' + awayInk + '" clip-path="url(#' + uid + 'a)"/>' +
    '<line class="px-zero" x1="0" x2="' + W + '" y1="' + mid + '" y2="' + mid + '"/></svg>';
  const mark = (side) => {
    const big = flow.largest[side];
    if (!big || !big.lead || big.t == null) return '';
    const left = (big.t / flow.end) * 100;
    const topPct = (y(side === 'home' ? big.lead : -big.lead) / H) * 100;
    const edge = left < 15 ? ' l' : left > 85 ? ' r' : '';
    return '<i class="px-dot" style="left:' + left.toFixed(1) + '%;top:' + topPct.toFixed(1) + '%;background:' + (side === 'home' ? homeInk : awayInk) + '"></i>' +
      '<span class="px-mk ' + side + edge + '" style="left:' + left.toFixed(1) + '%;top:' + topPct.toFixed(1) + '%">' +
      '<b style="color:' + (side === 'home' ? homeText : awayText) + '">' + esc(game[side].abbr) + ' +' + esc(big.lead) + '</b> ' + esc(clockLabel(big.t)) + '</span>';
  };
  const qLabels = Array.from({ length: flow.periods }, (_, i) => {
    const p = i + 1;
    const len = p <= 4 ? 720 : 300;
    return '<span style="left:' + ((x(periodStart(p) + len / 2) / W) * 100).toFixed(1) + '%">' + periodName(p) + '</span>';
  }).join('');
  return '<figure class="px-flow" role="img" aria-label="' +
    esc('Score margin through the game. ' + game.home.abbr + ' led by up to ' + flow.largest.home.lead + ', ' + game.away.abbr + ' by up to ' + flow.largest.away.lead + '.') + '">' +
    '<div class="px-fh"><span style="color:' + homeText + '">▲ ' + esc(game.home.abbr) + ' ahead</span><span style="color:' + awayText + '">▼ ' + esc(game.away.abbr) + ' ahead</span></div>' +
    '<div class="px-plot" style="--h:' + H + 'px">' + svg + '<span class="px-scale t">+' + span + '</span><span class="px-scale b">+' + span + '</span>' + mark('home') + mark('away') + '</div>' +
    '<div class="px-ql">' + qLabels + '</div></figure>';
}

// Home win probability (ESPN's in-game model) as a line, 50% in the middle.
function pxWinProbSVG(flow, game, looks, opts = {}) {
  if (!flow || flow.wp.length < 2) return '';
  const W = 1000;
  const H = opts.h || 120;
  const pts = flow.wp.map((w) => ((w.t / flow.end) * W).toFixed(1) + ',' + (H - (w.home / 100) * H).toFixed(1));
  const homeInk = inkOf(looks.home, 4.5);
  const awayInk = inkOf(looks.away, 4.5);
  const uid = 'wp' + game.id;
  const area = 'M0,' + (H / 2) + ' L' + pts.join(' L') + ' L' + W + ',' + (H / 2) + ' Z';
  const low = flow.wp.reduce((a, b) => (b.home < a.home ? b : a), flow.wp[0]);
  const lowLeft = (low.t / flow.end) * 100;
  return '<figure class="px-wp" role="img" aria-label="' + esc('ESPN win probability. ' + game.home.abbr + ' fell as low as ' + Math.round(low.home) + '% at ' + clockLabel(low.t) + '.') + '">' +
    '<div class="px-fh"><span style="color:' + homeInk + '">▲ ' + esc(game.home.abbr) + ' favoured</span><span style="color:' + awayInk + '">▼ ' + esc(game.away.abbr) + ' favoured</span></div>' +
    '<div class="px-plot" style="--h:' + H + 'px"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<defs><clipPath id="' + uid + 'h"><rect x="0" y="0" width="' + W + '" height="' + H / 2 + '"/></clipPath><clipPath id="' + uid + 'a"><rect x="0" y="' + H / 2 + '" width="' + W + '" height="' + H / 2 + '"/></clipPath></defs>' +
    '<path d="' + area + '" fill="' + looks.home.fill + '" fill-opacity="0.45" clip-path="url(#' + uid + 'h)"/>' +
    '<path d="' + area + '" fill="' + looks.away.fill + '" fill-opacity="0.45" clip-path="url(#' + uid + 'a)"/>' +
    '<polyline class="px-line" points="' + pts.join(' ') + '" fill="none" stroke="#f2f2f3"/>' +
    '<line class="px-zero" x1="0" x2="' + W + '" y1="' + H / 2 + '" y2="' + H / 2 + '"/></svg>' +
    '<span class="px-scale t">100%</span><span class="px-scale m">50%</span><span class="px-scale b">100%</span>' +
    '<span class="px-mk away' + (lowLeft < 15 ? ' l' : lowLeft > 85 ? ' r' : '') + '" style="left:' + lowLeft.toFixed(1) + '%;top:' + (100 - low.home).toFixed(1) + '%"><b>' + esc(game.home.abbr) + ' ' + Math.round(low.home) + '%</b> ' + esc(clockLabel(low.t)) + '</span></div></figure>';
}

// Facts the play-by-play gives that the tape does not.
function pxFacts(flow) {
  if (!flow) return [];
  const runText = (side) => (flow.runs[side] ? flow.runs[side].pts + '-0' : '—');
  const runWhen = (side) => (flow.runs[side] ? clockLabel(flow.runs[side].start) : '');
  return [
    { k: 'Biggest lead', away: flow.largest.away.lead ? '+' + flow.largest.away.lead : '—', home: flow.largest.home.lead ? '+' + flow.largest.home.lead : '—',
      awaySub: flow.largest.away.t != null && flow.largest.away.lead ? clockLabel(flow.largest.away.t) : '', homeSub: flow.largest.home.t != null && flow.largest.home.lead ? clockLabel(flow.largest.home.t) : '' },
    { k: 'Best run', away: runText('away'), home: runText('home'), awaySub: runWhen('away'), homeSub: runWhen('home') },
  ];
}

// The game in a few sentences, built only from the numbers above. Finals only.
function pxHeadline(flow, game) {
  if (game.state !== 'post') return [];
  const win = game.home.winner ? 'home' : game.away.winner ? 'away' : '';
  if (!win) return [];
  const lose = win === 'home' ? 'away' : 'home';
  const W = game[win];
  const L = game[lose];
  const by = Math.abs((game.home.score || 0) - (game.away.score || 0));
  const parts = [];
  if (flow && flow.largest[lose].lead >= 10) parts.push(W.name + ' trailed by ' + flow.largest[lose].lead + ' and won by ' + by + '.');
  else parts.push(W.name + ' beat the ' + L.name.split(' ').slice(-1)[0] + ' by ' + by + '.');
  if (flow) {
    const run = flow.runs[win];
    if (run && run.pts >= 8) parts.push('A ' + run.pts + '-0 run from ' + clockLabel(run.start) + ' took it from ' + run.from[lose] + '-' + run.from[win] + ' to ' + run.from[lose] + '-' + (run.from[win] + run.pts) + '.');
    parts.push(flow.leadChanges + ' lead change' + (flow.leadChanges === 1 ? '' : 's') + ', ' + flow.ties + ' tie' + (flow.ties === 1 ? '' : 's') + '.');
  }
  return parts;
}

// The scores view shows each team in its own card colour (the game page may
// swap the home side to its alternate), so inspector charts match the cards.
function insLooks(game, colors) {
  return {
    away: teamLook(colors, game.away.abbr, game.away.id, game.away.logo),
    home: teamLook(colors, game.home.abbr, game.home.id, game.home.logo),
  };
}

/* ── Scores: recap, chart and steals/blocks in the inspector; the night's
   best lines under the cards (ins-*) ──────────────────────────────────── */
// The night's best lines across the slate, from each card's game leaders.
function insNightHTML(games, colors) {
  const cats = [['pts', 'Points'], ['reb', 'Rebounds'], ['ast', 'Assists']].map(([key, label]) => {
    const rows = [];
    for (const game of games) {
      if (game.state === 'pre') continue;
      for (const side of [game.away, game.home]) {
        const lead = side.leaders && side.leaders.kind === 'game' && side.leaders[key];
        const value = lead ? Number(lead.value) : NaN;
        if (!Number.isFinite(value)) continue;
        const opp = side === game.away ? game.home : game.away;
        rows.push({ name: lead.name, value, abbr: side.abbr, opp: opp.abbr, at: side === game.away ? '@' : 'vs', look: teamLook(colors, side.abbr, side.id, side.logo), game: game.id });
      }
    }
    rows.sort((a, b) => b.value - a.value || a.name.localeCompare(b.name));
    return { label, rows: rows.slice(0, 4) };
  }).filter((c) => c.rows.length);
  if (!cats.length) return '';
  const done = games.filter((g) => g.state === 'post').length;
  return '<section class="ins-night" aria-label="Best lines of the night"><h2>The night\'s best lines</h2>' +
    '<p>' + esc(games.length + ' game' + (games.length === 1 ? '' : 's') + ', ' + done + ' final. Each team\'s leader from the box score, ranked across the slate.') + '</p>' +
    '<div class="ins-cats">' + cats.map((c) => '<div class="ins-cat"><h3>' + esc(c.label) + '</h3>' + c.rows.map((r) =>
      '<a class="ins-cr" href="#game/' + esc(r.game) + '"><span class="sw" style="background:' + r.look.fill + '"></span>' +
      '<span class="n"><b>' + esc(r.name) + '</b><i>' + esc(r.abbr + ' ' + r.at + ' ' + r.opp) + '</i></span><span class="v">' + esc(r.value) + '</span></a>').join('') + '</div>').join('') +
    '</div></section>';
}

// Fills the inspector's recap, margin chart and steals/blocks once the game's
// summary arrives. Pre-game has none of these, so it draws nothing.
async function fillInspectorStory(game) {
  if (!game || game.state === 'pre') return;
  const json = await getSummary(game.id);
  if (!json || !scState || scSelected !== game.id) return;
  const story = app.querySelector('.ins-story[data-game="' + game.id + '"]');
  const def = app.querySelector('.ins-def[data-game="' + game.id + '"]');
  const looks = insLooks(game, scState.colors);
  if (story) {
    const flow = parseGameFlow(json);
    const lines = pxHeadline(flow, game);
    story.innerHTML = (lines[0] ? '<p class="ins-lede">' + esc(lines[0]) + '</p>' : '') +
      (lines.length > 1 ? '<p class="ins-lede">' + esc(lines.slice(1).join(' ')) + '</p>' : '') +
      pxFlowSVG(flow, game, looks, { h: 150, uid: 'i' });
  }
  if (def) {
    const box = parseBoxScore(json);
    const team = (side) => box.teams.find((t) => t.abbr === game[side].abbr);
    const rows = [['STL', 'Steals'], ['BLK', 'Blocks']].flatMap(([key, label]) => ['away', 'home'].map((side) => {
      const lead = team(side) ? boxLeader(team(side), key) : null;
      return lead ? '<span class="k">' + esc(game[side].abbr + ' ' + label.toLowerCase()) + '</span><b class="sans">' + esc(lead.name + ' ' + lead.value) + '</b>' : '';
    })).join('');
    def.innerHTML = rows ? '<div class="ins-ib"><h3>Steals and blocks</h3><div class="ins-kv ins-kv2">' + rows + '</div></div>' : '';
  }
}

/* ── Game page additions (gm-*) ─────────────────────────────────────────── */
// Adds the rise-in class and a stagger index to every card in a chunk of HTML.
function gmStagger(html, start = 0) {
  let i = start;
  return html.replace(/<section class="card/g, () => '<section style="--i:' + (i++) + '" class="gm-in card');
}

function gmTilesHTML(flow, game, looks) {
  const facts = pxFacts(flow);
  if (!facts.length) return '';
  const tile = (side, f) => '<div class="gm-tile" style="--c:' + looks[side].fill + '"><b>' + esc(f[side]) + '</b><span>' + esc(game[side].abbr + ' ' + f.k.toLowerCase()) + '</span>' + (f[side + 'Sub'] ? '<i>' + esc(f[side + 'Sub']) + '</i>' : '') + '</div>';
  const [lead, run] = facts;
  return tile('away', lead) + tile('home', lead) + tile('away', run) + tile('home', run);
}

function gmQuartersHTML(periods, game, looks) {
  if (!periods.length) return '';
  let a = 0;
  let h = 0;
  const row = (key, side, other) => {
    const top = side.scorers[0];
    return '<div class="gm-qr"><span class="ab" style="color:' + inkOf(looks[key], 4.5) + '">' + esc(game[key].abbr) + '</span><span class="who">' + (top ? esc(top.short + ' ' + top.pts) : '') + '</span><b class="' + (side.pts > other.pts ? 'w' : '') + '">' + esc(side.pts) + '</b></div>';
  };
  return '<section class="card gm-card"><div class="gm-ch"><h2>Quarters</h2><span>Top scorer each side</span></div><div class="gm-qs">' + periods.map((p) => {
    a += p.away.pts;
    h += p.home.pts;
    return '<div class="gm-q"><h3>' + esc(periodName(p.period)) + '<i>' + esc(a + '-' + h) + '</i></h3>' + row('away', p.away, p.home) + row('home', p.home, p.away) + '</div>';
  }).join('') + '</div></section>';
}

// Steals and blocks leaders from the box score, next to ESPN's points,
// rebounds and assists leaders. Game leaders only: ESPN sends no season
// steals or blocks leader before tip-off.
function withBoxLeaders(game, boxes) {
  if (!game.leaders || !boxes.away || !boxes.home) return game;
  const add = (lead, team) => {
    if (!lead || lead.kind !== 'game') return lead;
    // Reuse a headshot when the same player already leads in PTS, REB or AST.
    const known = new Map(['pts', 'reb', 'ast'].map((k) => lead[k]).filter((p) => p && p.id && p.headshot).map((p) => [p.id, p.headshot]));
    const withShot = (p) => (p ? { ...p, headshot: known.get(p.id) || '' } : null);
    return { ...lead, stl: withShot(boxLeader(team, 'STL')), blk: withShot(boxLeader(team, 'BLK')) };
  };
  return { ...game, leaders: { away: add(game.leaders.away, boxes.away), home: add(game.leaders.home, boxes.home) } };
}

// The chart toggle: margin or ESPN win probability, one at a time.
function wireGameChart() {
  const seg = app.querySelector('.gm-seg');
  if (!seg) return;
  seg.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-chart]');
    if (!button) return;
    gmChart = button.getAttribute('data-chart');
    seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
    app.querySelectorAll('.gm-pane').forEach((pane) => { pane.hidden = pane.getAttribute('data-pane') !== gmChart; });
  });
}

/* ── Router ─────────────────────────────────────────────────────────────── */
function markNav(view) {
  document.querySelectorAll('[data-nav]').forEach((link) => {
    link.setAttribute('aria-current', link.getAttribute('data-nav') === view ? 'page' : 'false');
  });
}

function router() {
  stopPolling();
  const route = parseHash();
  markNav(route.view);
  // The scores view is three columns and needs more room than the other views.
  const onScores = !['standings', 'game', 'team', 'compare', 'leaders', 'stats', 'players', 'player'].includes(route.view);
  document.body.classList.toggle('sc-wide', onScores);
  document.body.classList.toggle('gm-wide', ['game', 'team', 'compare', 'leaders', 'stats', 'players', 'player'].includes(route.view));

  if (route.view === 'standings') showStandings(route.args[0]);
  else if (route.view === 'game' && route.arg) showGame(route.arg);
  else if (route.view === 'team' && route.arg) showTeam(route.arg);
  else if (route.view === 'compare') showCompare(route.args[0], route.args[1]);
  else if (route.view === 'leaders') showLeaders();
  else if (route.view === 'stats') showStats(route.arg);
  else if (route.view === 'players') showPlayers(route.args[0], route.args[1]);
  else if (route.view === 'player' && route.arg) showPlayer(route.arg);
  else showScores(route.view === 'scores' ? route.arg : '');
}

window.addEventListener('hashchange', router);
initSearch();
router();
</script>
