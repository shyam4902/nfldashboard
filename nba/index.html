<script type="module">
import {
  barShares,
  boxLeader,
  contrastRatio,
  etDate,
  leagueRank,
  ordinal,
  parseAthlete,
  parseBoxScore,
  parseGameExtras,
  parseGameFlow,
  parseGameLog,
  parseLeaderLines,
  parsePeriodScoring,
  parsePlayerOverview,
  parsePreGame,
  parseRoster,
  parseScoreboard,
  parseSearch,
  parseStandings,
  parseTeamSchedule,
  parseTeams,
  parseTeamStats,
  parseTeamPlayerStats,
  periodStart,
  pickCompareGame,
  readableOn,
  restInfo,
  slateDay,
  smallImg,
  teamFill,
  textOn,
} from './nba.js?v=20261111b';

const API = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const STANDINGS_API = 'https://site.api.espn.com/apis/v2/sports/basketball/nba/standings';
const SEARCH_API = 'https://site.web.api.espn.com/apis/common/v3/search?query=';
const POLL_MS = 30000;
const COLUMNS = ['MIN', 'PTS', 'FG', '3PT', 'FT', 'REB', 'AST', 'TO', 'STL', 'BLK', 'PF', '+/-'];

const app = document.getElementById('app');
// A headshot that fails to load is dropped; the tinted circle behind it stays.
app.addEventListener('error', (event) => {
  const img = event.target;
  if (img && img.tagName === 'IMG' && img.classList.contains('gm-hsimg')) img.remove();
}, true);
let requestId = 0;
let pollTimer = 0;
let gameTimer = 0;
// Debounce timers owned by the player-compare pickers. Every hash change runs
// stopPolling(), which closes them, so a pending callback can never write into
// a node that a re-render already replaced.
let pickerClosers = [];

const SITE = 'Matchup Board';
const DEFAULT_TITLE = SITE + ' · NBA scores, matchups and stats';
let currentTitle = '';

// Tabs, history and shared links get the view's name once its data has loaded;
// the default title stays put while a view is still fetching.
function setTitle(text) {
  const next = text ? text + ' · ' + SITE : DEFAULT_TITLE;
  if (next === currentTitle) return;
  currentTitle = next;
  if (typeof document !== 'undefined' && document) document.title = next;
}

function lastName(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  while (parts.length > 1 && /^(jr|sr|ii|iii|iv|v)$/i.test(parts[parts.length - 1])) parts.pop();
  return parts[parts.length - 1] || '';
}

const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ESCAPES[ch]);

function stopPolling() {
  if (pollTimer) {
    clearTimeout(pollTimer);
    pollTimer = 0;
  }
  if (gameTimer) {
    clearTimeout(gameTimer);
    gameTimer = 0;
  }
  pickerClosers.forEach((close) => close());
  pickerClosers = [];
  if (restObserver) restObserver.disconnect();
}

function loadingHTML() {
  return '<div class="state"><span class="pulse"></span>Loading…</div>';
}

function showError(retry) {
  app.innerHTML = '<div class="state"><span>Couldn\'t reach ESPN.</span><button class="retry" type="button">Retry</button></div>';
  app.querySelector('.retry').addEventListener('click', retry);
}

async function fetchJSON(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('ESPN HTTP ' + res.status);
  return res.json();
}

function parseHash() {
  const raw = (location.hash || '').replace(/^#/, '');
  const parts = raw.split('/').filter(Boolean);
  return { view: parts[0] || 'scores', arg: parts[1] || '', args: parts.slice(1) };
}

/* ── Dates ──────────────────────────────────────────────────────────────── */
// The default scores day. slateDay turns the day over at midnight Pacific; the
// one case it cannot see alone is a game from the day before still running
// (a late West Coast tip-off in overtime), so until 8am ET this asks ESPN.
let slateKnown = { day: '', at: 0 };
const SLATE_TTL = 2 * 60 * 1000;

function currentSlateDay() {
  return slateKnown.day && Date.now() - slateKnown.at < SLATE_TTL ? slateKnown.day : slateDay(new Date());
}

async function resolveSlateDay() {
  if (slateKnown.day && Date.now() - slateKnown.at < SLATE_TTL) return slateKnown.day;
  const now = new Date();
  const base = slateDay(now);
  let live = false;
  if (slateDay(new Date(now.getTime() - 5 * 3600 * 1000)) !== base) {
    try {
      const games = parseScoreboard(await fetchJSON(API + '/scoreboard?dates=' + shiftDay(base, -1)));
      live = games.some((game) => game.state === 'in');
    } catch (err) {
      live = false;
    }
  }
  slateKnown = { day: slateDay(now, live), at: Date.now() };
  return slateKnown.day;
}

function isoOfDay(yyyymmdd) {
  return yyyymmdd.slice(0, 4) + '-' + yyyymmdd.slice(4, 6) + '-' + yyyymmdd.slice(6, 8) + 'T12:00:00Z';
}

function isValidDay(value) {
  return /^\d{8}$/.test(String(value || ''));
}

function shiftDay(yyyymmdd, offset) {
  const day = new Date(isoOfDay(yyyymmdd));
  day.setUTCDate(day.getUTCDate() + offset);
  const y = day.getUTCFullYear();
  const m = String(day.getUTCMonth() + 1).padStart(2, '0');
  const d = String(day.getUTCDate()).padStart(2, '0');
  return y + m + d;
}

function formatDay(yyyymmdd) {
  const day = new Date(isoOfDay(yyyymmdd));
  if (Number.isNaN(day.getTime())) return yyyymmdd;
  return day.toLocaleDateString('en-US', {
    timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric',
  });
}

function formatWhen(iso) {
  const day = new Date(iso);
  if (Number.isNaN(day.getTime())) return '';
  return day.toLocaleString('en-US', {
    timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit',
  }) + ' ET';
}

function formatPct(pct) {
  if (pct == null || Number.isNaN(pct)) return '—';
  if (pct >= 1) return '1.000';
  return '.' + String(Math.round(pct * 1000)).padStart(3, '0');
}

/* ── Scores ─────────────────────────────────────────────────────────────── */
/* Inspector layout: team colours, standings rail, selected-game panel. Colours
   come from the ESPN teams endpoint, fetched once per page load. A failed fetch
   is not cached (the next view retries) and leaves teams a neutral grey. */
// ponytail: static snapshot, ESPN /teams has no CORS header. Refresh by hand on a rebrand.
const TEAMS_API = '/nba/teams.json';
const PAGE_BG = '#0d0d0f';
const PANEL_BG = '#161618';
let teamColorsPromise = null;

function getTeamColors() {
  if (!teamColorsPromise) {
    teamColorsPromise = fetchJSON(TEAMS_API).then(parseTeams).catch(() => {
      teamColorsPromise = null;
      return { byAbbr: {}, byId: {} };
    });
  }
  return teamColorsPromise;
}

// Fill, text colour and logo for one team. `colors` is the parseTeams result.
function teamLook(colors, abbr, id, logo) {
  const entry = (colors && (colors.byAbbr[abbr] || colors.byId[String(id)])) || {};
  const fill = teamFill(entry, PAGE_BG);
  return { fill: fill.fill, ink: fill.ink, usedAlt: fill.usedAlt, logo: logo || entry.logo || '' };
}

function tipOff(iso) {
  const day = new Date(iso);
  if (Number.isNaN(day.getTime())) return '';
  return day.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' }) + ' ET';
}

function recordText(row, side) {
  if (row && row.wins != null && row.losses != null) return row.wins + '-' + row.losses;
  return (side && side.record) || '';
}

const LEADER_ROWS = [['PTS', 'pts'], ['REB', 'reb'], ['AST', 'ast']];

// Season per-game leaders before tip-off, the game's own counts once it starts.
// Past days are not "tonight", so a finished game from another day says so.
function leaderCaption(kind, game) {
  if (kind === 'season') return 'Season avg';
  if (game.state === 'in' || etDate(game.startISO) === currentSlateDay()) return 'Tonight';
  return 'In this game';
}

function insBandHTML(side, game, colors) {
  const state = game.state;
  const look = teamLook(colors, side.abbr, side.id, side.logo);
  const lost = state === 'post' && !side.winner;
  const logo = look.logo
    ? '<span class="ins-logo"><img src="' + esc(smallImg(look.logo, 56, 56)) + '" alt="" width="22" height="22" decoding="async"></span>'
    : '<span class="ins-logo ins-logo-none"></span>';
  const score = state === 'pre' || side.score == null ? '' : esc(side.score);
  const lead = side.leaders;
  // Cards are three to a row, so leaders show the surname; the full "J. Embiid" is the hover title.
  const surname = (short) => String(short || '').replace(/^(?:[A-Z]\.)+\s*/, '');
  const cells = lead
    ? LEADER_ROWS.filter(([, key]) => lead[key]).map(([label, key]) =>
      '<span class="c"><span class="lk">' + label + '</span><b>' + esc(lead[key].value) + '</b><span class="nm" title="' + esc(lead[key].short) + '">' + esc(surname(lead[key].short)) + '</span></span>').join('')
    : '';
  return '<div class="ins-band' + (lost ? ' lost' : '') + '" style="background:' + look.fill + ';color:' + look.ink + '">' +
    '<div class="ins-bh">' + logo + '<span class="ab">' + esc(side.abbr) + '</span>' +
    '<span class="rc">' + esc(side.record) + '</span><span class="sc">' + score + '</span></div>' +
    (cells ? '<div class="ins-ld"><span class="cap">' + esc(leaderCaption(lead.kind, game)) + '</span>' + cells + '</div>' : '') + '</div>';
}

function oddsHeadHTML(game) {
  const odds = game.odds;
  if (odds) {
    const parts = [];
    if (odds.details) parts.push('<b>' + esc(odds.details) + '</b>');
    if (odds.total != null) parts.push('O/U ' + esc(odds.total));
    if (parts.length) return '<span class="ins-odds">' + parts.join(' · ') + '</span>';
  }
  return game.broadcast ? '<span class="ins-odds">' + esc(game.broadcast) + '</span>' : '';
}

// The drawer under a frame: both teams' full leader lines, the moneyline,
// home/road records, then last 10 and streak from the standings payload.
function insDetailHTML(game, standings, colors) {
  const sides = [game.away, game.home].map((side) => ({
    side,
    row: standings ? standingFor(standings, side.id) : null,
    look: teamLook(colors, side.abbr, side.id, side.logo),
  }));
  const [A, H] = sides;
  const cell = (inner, cls) => '<span class="v' + (cls ? ' ' + cls : '') + '">' + inner + '</span>';
  const rowHTML = (label, a, b) => (a || b)
    ? '<span class="k">' + esc(label) + '</span>' + (a || cell('<span>—</span>')) + (b || cell('<span>—</span>'))
    : '';
  const plain = (value) => (value ? cell('<b>' + esc(value) + '</b>') : '');

  const heads = '<span class="hd"></span>' + sides.map((t) =>
    '<span class="hd" style="box-shadow:inset 0 -2px 0 ' + t.look.fill + '">' + esc(t.side.abbr) + '</span>').join('');
  // Filled by watchRest once the frame is on screen; stays hidden without a schedule.
  const day = etDate(game.startISO);
  const rest = '<span class="rs-row" hidden><span class="k">Rest</span>' +
    sides.map((t) => '<span class="v">' + restChipHTML(t.side.id, day) + '</span>').join('') + '</span>';

  const leadLines = LEADER_ROWS.map(([label, key]) => {
    const one = (t) => (t.side.leaders && t.side.leaders[key]
      ? cell('<span title="' + esc(t.side.leaders[key].name) + '">' + esc(String(t.side.leaders[key].name || '').split(' ').slice(1).join(' ') || t.side.leaders[key].name) + '</span><b>' + esc(t.side.leaders[key].value) + '</b>', 'ld')
      : '');
    return rowHTML(label, one(A), one(H));
  }).join('');
  const kind = (A.side.leaders && A.side.leaders.kind) || (H.side.leaders && H.side.leaders.kind) || '';
  const leadCap = leadLines ? '<span class="dc">Leaders · ' + esc(leaderCaption(kind, game).toLowerCase()) + '</span>' : '';

  const ml = game.odds && game.odds.moneyline ? rowHTML('ML', plain(game.odds.moneyline.away), plain(game.odds.moneyline.home)) : '';
  const road = rowHTML('Road', A.side.roadRecord ? cell('<b>' + esc(A.side.roadRecord) + '</b>', 'rel') : '', H.side.roadRecord ? plain(H.side.roadRecord) : '');
  const home = rowHTML('Home', A.side.homeRecord ? plain(A.side.homeRecord) : '', H.side.homeRecord ? cell('<b>' + esc(H.side.homeRecord) + '</b>', 'rel') : '');
  const l10 = rowHTML('L10', plain(A.row && A.row.last10), plain(H.row && H.row.last10));
  const strk = rowHTML('STRK', plain(A.row && A.row.streak), plain(H.row && H.row.streak));
  const recCap = road || home ? '<span class="dc">Records</span>' : '';
  const formCap = l10 || strk ? '<span class="dc">Form</span>' : '';
  const mlCap = ml ? '<span class="dc">Moneyline</span>' : '';

  return '<div class="ins-more"><div class="ins-more-in"><div class="ins-dt"><div class="ins-dg">' +
    heads + rest + leadCap + leadLines + mlCap + ml + recCap + road + home + formCap + l10 + strk +
    '</div><a class="ins-dopen" href="#game/' + esc(game.id) + '"><span>Game details</span><span aria-hidden="true">→</span></a></div></div></div>';
}

function gameCardHTML(game, colors, selected, standings) {
  const live = game.state === 'in';
  const status = game.state === 'pre' ? tipOff(game.startISO) || 'Scheduled' : (game.statusText || 'Final');
  return '<div class="ins-frame' + (selected ? ' sel' : '') + '" role="group" tabindex="0" data-rest-scope data-game="' + esc(game.id) + '"' +
    (selected ? ' aria-current="true"' : '') +
    ' aria-label="' + esc(game.away.name + ' at ' + game.home.name) + '">' +
    '<div class="ins-fl"><span class="ins-st' + (live ? ' live' : '') + '">' + (live ? '<i class="dot"></i>' : '') + esc(status) + '</span>' +
    oddsHeadHTML(game) + '</div>' +
    '<div class="ins-fwrap"><div class="ins-fbody">' + insBandHTML(game.away, game, colors) + insBandHTML(game.home, game, colors) + '</div>' +
    
    insDetailHTML(game, standings, colors) + '</div></div>';
}

function insRailHTML(standings, colors, game) {
  if (!standings) return '';
  const active = new Set(game ? [game.away.id, game.home.id] : []);
  const group = (title, rows) => '<div class="ins-grp"><div class="ins-gh">' + esc(title) + '</div>' + rows.map((row) => {
    const look = teamLook(colors, row.abbr, row.teamId, row.logo);
    const rec = row.wins != null && row.losses != null ? row.wins + '-' + row.losses : '—';
    return '<a class="ins-lr' + (active.has(row.teamId) ? ' on' : '') + '" href="#team/' + esc(row.teamId) + '" data-team="' + esc(row.teamId) + '" title="' + esc(row.name) + '">' +
      '<span class="sw" style="background:' + look.fill + '"></span><span class="ab">' + esc(row.abbr) + '</span>' +
      '<span class="nm">' + esc(row.name) + '</span><span class="rc">' + esc(rec) + '</span></a>';
  }).join('') + '</div>';
  return '<div class="ins-ph">Standings</div>' + group('Eastern Conference', standings.East) + group('Western Conference', standings.West);
}

function insRow(label, a, b, better) {
  // better: 'a', 'b' or '' for the side that leads on this line.
  return '<span class="k">' + esc(label) + '</span>' +
    '<b class="' + (better === 'a' ? 'lead' : '') + '">' + esc(a) + '</b>' +
    '<b class="' + (better === 'b' ? 'lead' : '') + '">' + esc(b) + '</b>';
}

function leadSide(a, b, lower) {
  if (a == null || b == null || a === b) return '';
  return (lower ? a < b : a > b) ? 'a' : 'b';
}

function insPanelHTML(game, standings, colors) {
  if (!game) return '<div class="ins-ph">Inspector</div><p class="ins-foot">Pick a game.</p>';
  const rowOf = (side) => (standings ? [...standings.East, ...standings.West].find((r) => r.teamId === side.id) || null : null);
  const A = { side: game.away, row: rowOf(game.away), look: teamLook(colors, game.away.abbr, game.away.id, game.away.logo) };
  const H = { side: game.home, row: rowOf(game.home), look: teamLook(colors, game.home.abbr, game.home.id, game.home.logo) };
  const started = game.state !== 'pre';
  const status = game.state === 'pre' ? 'Scheduled' : (game.statusText || '');
  const pctA = A.row && A.row.pct != null ? A.row.pct : null;
  const pctH = H.row && H.row.pct != null ? H.row.pct : null;

  const vs = '<div class="ins-ib"><div class="ins-vs">' +
    '<div class="t"><b style="color:' + readableOn(A.look.fill, PANEL_BG) + '">' + esc(game.away.abbr) + '</b><span>' + esc(game.away.name) + '</span>' + restChipHTML(game.away.id, etDate(game.startISO)) + '</div>' +
    '<span class="at">at</span>' +
    '<div class="t r"><b style="color:' + readableOn(H.look.fill, PANEL_BG) + '">' + esc(game.home.abbr) + '</b><span>' + esc(game.home.name) + '</span>' + restChipHTML(game.home.id, etDate(game.startISO)) + '</div></div>' +
    (started ? '<div class="ins-score"><span>' + (game.away.score == null ? '' : esc(game.away.score)) + '</span><span></span><span>' + (game.home.score == null ? '' : esc(game.home.score)) + '</span></div>' : '') +
    (pctA != null && pctH != null && pctA + pctH > 0
      ? '<div class="ins-meter" title="Win percentage"><span style="flex:' + (pctA || 0.01) + ';background:' + A.look.fill + '"></span><span style="flex:' + (pctH || 0.01) + ';background:' + H.look.fill + '"></span></div>' +
        '<div class="ins-meter-cap"><span>' + esc(pctA.toFixed(3).replace(/^0/, '')) + '</span><i>WIN %</i><span>' + esc(pctH.toFixed(3).replace(/^0/, '')) + '</span></div>'
      : '') + '</div>';

  const dA = A.row ? pointDiff(A.row) : null;
  const dH = H.row ? pointDiff(H.row) : null;
  const winA = A.row ? A.row.pct : null;
  const winH = H.row ? H.row.pct : null;
  const rows = [];
  const recA = recordText(A.row, game.away);
  const recH = recordText(H.row, game.home);
  if (recA || recH) rows.push(insRow('Record', recA || '—', recH || '—', leadSide(winA, winH)));
  if (winA != null || winH != null) rows.push(insRow('Win %', formatPct(winA), formatPct(winH), leadSide(winA, winH)));
  if ((A.row && A.row.ppg != null) || (H.row && H.row.ppg != null)) rows.push(insRow('PPG', oneDecimal(A.row && A.row.ppg), oneDecimal(H.row && H.row.ppg), leadSide(A.row && A.row.ppg, H.row && H.row.ppg)));
  if ((A.row && A.row.oppPpg != null) || (H.row && H.row.oppPpg != null)) rows.push(insRow('Opp PPG', oneDecimal(A.row && A.row.oppPpg), oneDecimal(H.row && H.row.oppPpg), leadSide(A.row && A.row.oppPpg, H.row && H.row.oppPpg, true)));
  if (dA != null || dH != null) rows.push(insRow('Diff', signedDecimal(dA), signedDecimal(dH), leadSide(dA, dH)));
  if ((A.row && A.row.streak) || (H.row && H.row.streak)) rows.push(insRow('Streak', (A.row && A.row.streak) || '—', (H.row && H.row.streak) || '—', ''));
  if ((A.row && A.row.last10) || (H.row && H.row.last10)) rows.push(insRow('Last 10', (A.row && A.row.last10) || '—', (H.row && H.row.last10) || '—', ''));
  const season = rows.length
    ? '<div class="ins-ib"><h3>Season</h3><div class="ins-kv"><span class="k"></span><b class="hd">' + esc(game.away.abbr) + '</b><b class="hd">' + esc(game.home.abbr) + '</b>' + rows.join('') + '</div></div>'
    : '';

  const when = formatWhen(game.startISO);
  const tip = '<div class="ins-ib"><h3>Tip-off</h3><div class="ins-kv ins-kv2">' +

      [[game.away, game.leaders.away], [game.home, game.leaders.home]].filter(([, l]) => l && l.name).map(([side, l]) =>

    : '';

  return '<div class="ins-ph">Inspector<span>' + esc(status) + '</span></div>' + vs + '<div class="ins-story" data-game="' + esc(game.id) + '"></div>' + season + tip + lead + '<div class="ins-def" data-game="' + esc(game.id) + '"></div>' +

function isoDayValue(yyyymmdd) {

// The selected game survives live polling: each refresh re-renders the view
// but keeps this id while the game is still on the slate.
let scSelected = '';
let scState = null;

function scheduleScoresPoll(date, games) {
  if (!games.some((game) => game.state === 'in')) return;
  pollTimer = setTimeout(() => {
    const route = parseHash();
    if (route.view === 'scores' && (!route.arg || route.arg === date)) showScores(route.arg || '', true);
  }, POLL_MS);
}

function selectGame(id) {
  if (!scState) return;
  const game = scState.games.find((entry) => entry.id === id);
  if (!game) return;
  scSelected = id;
  app.querySelectorAll('.ins-frame').forEach((frame) => {
    const on = frame.getAttribute('data-game') === id;
    frame.classList.toggle('sel', on);
    if (on) frame.setAttribute('aria-current', 'true');
    else frame.removeAttribute('aria-current');
  });
  const panel = document.getElementById('insPanel');
  if (panel) {
    panel.innerHTML = insPanelHTML(game, scState.standings, scState.colors);
    watchRest(panel);
  }
  fillInspectorStory(game);
  const active = new Set([game.away.id, game.home.id]);
  app.querySelectorAll('.ins-lr').forEach((row) => row.classList.toggle('on', active.has(row.getAttribute('data-team'))));
}

let scOpen = '';

function wireInspector() {
  const slate = document.getElementById('insSlate');
  if (!slate) return;
  const narrow = () => window.matchMedia('(max-width: 720px)').matches;
  const hovers = () => window.matchMedia('(hover: hover)').matches;
  const idOf = (frame) => frame.getAttribute('data-game');

  // One frame is pinned open at a time: a tap or Enter pins it, the same again
  // (or Escape, or another frame) lets it go.
  function setOpen(frame, on) {
    slate.querySelectorAll('.ins-frame.open').forEach((other) => { if (other !== frame) other.classList.remove('open'); });
    frame.classList.toggle('open', on);
    scOpen = on ? idOf(frame) : '';
  }

  slate.addEventListener('click', (event) => {
    // "Open game" and any other link inside the drawer navigate as normal.
    if (event.target.closest('a')) return;
    const frame = event.target.closest('.ins-frame');
    if (!frame) return;
    if (!narrow()) selectGame(idOf(frame));
    // Touch has no hover: the first tap expands the frame.
    if (!hovers() || narrow()) setOpen(frame, !frame.classList.contains('open'));
  });

  slate.addEventListener('keydown', (event) => {
    const frame = event.target.closest('.ins-frame');
    if (!frame || event.target !== frame) return;
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      if (!narrow()) selectGame(idOf(frame));
      setOpen(frame, !frame.classList.contains('open'));
    } else if (event.key === 'Escape') {
      setOpen(frame, false);
      frame.blur();
    }
  });
}

async function showScores(dateArg, isRefresh = false) {
  stopPolling();
  const token = ++requestId;
  if (!isRefresh) app.innerHTML = loadingHTML();
  const date = isValidDay(dateArg) ? dateArg : await resolveSlateDay();
  if (token !== requestId) return;

  // A pointer resting on a frame (or a frame holding keyboard focus) is mid
  // animation; swapping the DOM under it would replay the expand. Wait a beat.
  if (isRefresh && app.querySelector('.ins-frame:hover, .ins-frame:focus-visible')) {
    pollTimer = setTimeout(() => {
      const route = parseHash();
      if (route.view === 'scores' && (!route.arg || route.arg === date)) showScores(route.arg || '', true);
    }, 4000);
    return;
  }

  let games;
  let standings;
  let colors;
  try {
    // Standings and colours are extras: either failing leaves the scores intact.
    [games, standings, colors] = await Promise.all([
      fetchJSON(API + '/scoreboard?dates=' + date).then(parseScoreboard),
      getStandingsFresh(TEAM_TTL).catch(() => standingsCache),
      getTeamColors(),
    ]);
  } catch (err) {
    if (token === requestId) {
      if (!isRefresh) {
        showError(() => showScores(date));
      } else {
        pollTimer = setTimeout(() => {
          const route = parseHash();
          if (route.view === 'scores' && (!route.arg || route.arg === date)) showScores(route.arg || '', true);
        }, POLL_MS);
      }
    }
    return;
  }
  if (token !== requestId) return;

  const order = { in: 0, pre: 1, post: 2 };
  const sorted = games.slice().sort((a, b) => (order[a.state] ?? 3) - (order[b.state] ?? 3));

  // Keep the pick while its game is still listed; otherwise the first live
  // game, else the first game on the slate.
  if (!sorted.some((game) => game.id === scSelected)) scSelected = sorted.length ? sorted[0].id : '';
  if (!isRefresh || !sorted.some((game) => game.id === scOpen)) scOpen = '';
  scState = { games: sorted, standings, colors };
  const selectedGame = sorted.find((game) => game.id === scSelected) || null;

  setTitle('NBA Scores · ' + formatDay(date));

  const scrollY = isRefresh ? window.scrollY : 0;
  const hadFocus = isRefresh && document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('ins-frame')
    ? document.activeElement.getAttribute('data-game') : '';
  app.innerHTML = dateBarHTML(date) + (sorted.length
    ? '<div class="ins-shell">' +
      '<aside class="ins-rail" aria-label="Standings by conference">' + insRailHTML(standings, colors, selectedGame) + '</aside>' +
      '<section class="ins-canvas" aria-label="Games"><div class="ins-slate" id="insSlate">' +
      sorted.map((game) => gameCardHTML(game, colors, game.id === scSelected, standings)).join('') + '</div>' + insNightHTML(sorted, colors) + '</section>' +
      '<aside class="ins-panel" id="insPanel" data-rest-scope aria-label="Game inspector">' + insPanelHTML(selectedGame, standings, colors) + '</aside></div>'
    : '<div class="state">No games</div>');
  if (isRefresh) window.scrollTo(0, scrollY);
  // Put a pinned or focused frame back without replaying its animation.
  if (scOpen || hadFocus) {
    const find = (id) => id && app.querySelector('.ins-frame[data-game="' + id + '"]');
    const open = find(scOpen);
    const focus = find(hadFocus);
    [open, focus].forEach((frame) => frame && frame.classList.add('no-anim'));
    if (open) open.classList.add('open');
    if (focus) focus.focus({ preventScroll: true });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      [open, focus].forEach((frame) => frame && frame.classList.remove('no-anim'));
    }));
  }
  wireDatePicker();
  wireInspector();
  watchRest(app);
  fillInspectorStory(selectedGame);

  scheduleScoresPoll(date, games);
}

/* ── Standings ──────────────────────────────────────────────────────────── */
/* Sortable standings. Every column the payload gives us can be sorted; the
   sort state is shared by the tables on the page. */
const ST_COLS = [
  { key: 'seed', label: '#', cls: 'seed', dir: 'asc' },
  { key: 'team', label: 'Team', cls: 'team', dir: 'asc' },
  { key: 'w', label: 'W', dir: 'desc' },
  { key: 'l', label: 'L', dir: 'asc' },
  { key: 'pct', label: 'PCT', dir: 'desc' },
  { key: 'gb', label: 'GB', dir: 'asc' },
  { key: 'ppg', label: 'PPG', dir: 'desc' },
  { key: 'opp', label: 'OPP', dir: 'asc' },
  { key: 'diff', label: 'DIFF', dir: 'desc' },
  { key: 'l10', label: 'L10', dir: 'desc' },
  { key: 'strk', label: 'STRK', dir: 'desc' },
];
let stSort = { key: 'seed', dir: 'asc' };

function streakNumber(text) {
  const match = /^([WL])\s*(\d+)/i.exec(String(text || ''));
  return match ? (match[1].toUpperCase() === 'W' ? 1 : -1) * Number(match[2]) : null;
}

function gbNumber(text) {
  const value = String(text || '').trim();
  if (!value) return null;
  if (value === '-') return 0;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function last10Wins(text) {
  const match = /^(\d+)\s*-\s*\d+/.exec(String(text || ''));
  return match ? Number(match[1]) : null;
}

function stSortValue(key, entry) {
  const row = entry.row;
  switch (key) {
    case 'seed': return entry.rank;
    case 'team': return row.name;
    case 'w': return row.wins;
    case 'l': return row.losses;
    case 'pct': return row.pct;
    case 'gb': return gbNumber(row.gb);
    case 'ppg': return row.ppg;
    case 'opp': return row.oppPpg;
    case 'diff': return pointDiff(row);
    case 'l10': return last10Wins(row.last10);
    case 'strk': return streakNumber(row.streak);
    default: return null;
  }
}

function sortEntries(entries, sort) {
  const sign = sort.dir === 'desc' ? -1 : 1;
  return entries.slice().sort((a, b) => {
    const x = stSortValue(sort.key, a);
    const y = stSortValue(sort.key, b);
    // Rows with no value for this column always go last, whichever way it sorts.
    if (x == null && y != null) return 1;
    if (x != null && y == null) return -1;
    if (x != null && y != null && x !== y) {
      const cmp = typeof x === 'string' ? x.localeCompare(y) : x - y;
      if (cmp !== 0) return cmp * sign;
    }
    return a.rank - b.rank;
  });
}

function standingsTableHTML(title, rows, options = {}) {

  const entries = rows.map((row, index) => ({ row, rank: league ? index + 1 : (row.seed ?? index + 1) }));

  const seedOrder = sort.key === 'seed' && sort.dir === 'asc';
  const hot = (key) => (sort.key === key ? ' sorted' : '');
  const td = (key, html, cls) => '<td class="' + [cls, hot(key).trim()].filter(Boolean).join(' ') + '">' + html + '</td>';
  const body = ordered.map((entry, index) => {

    const diff = pointDiff(row);
    const strk = /^W/.test(row.streak || '') ? 'strk-w' : /^L/.test(row.streak || '') ? 'strk-l' : '';
    return '<tr class="st-row' + cut + '" style="--c:' + look.fill + '">' +

      td('w', row.wins == null ? '—' : esc(row.wins)) +

      td('diff', esc(signedDecimal(diff)), diff == null ? '' : diff > 0 ? 'diff-pos' : diff < 0 ? 'diff-neg' : '') +

  }).join('');

  const head = ST_COLS.map((col) => {

    return '<th class="' + [col.cls, active ? 'sorted' : ''].filter(Boolean).join(' ') + '" scope="col" aria-sort="' + label + '">' +
      '<button type="button" class="st-sort" data-sort="' + col.key + '">' + esc(col.label) +
      '<span class="st-arrow" aria-hidden="true">' + (active && sort.dir === 'desc' ? '▼' : '▲') + '</span></button></th>';
  }).join('');

  const key = !league && seedOrder ? '<span class="st-key"><i class="po"></i>1-6 playoffs <i class="pi"></i>7-10 play-in</span>' : '';
  return '<section class="card standings-block"><div class="st-h"><h2>' + esc(title) + '</h2>' + key + '</div>' +
    '<div class="table-wrap"><table class="standings">' +
    '<caption class="sr-only">' + esc(title) + ' standings, sorted by ' + esc(ST_COLS.find((c) => c.key === sort.key).label) + ' ' + (sort.dir === 'asc' ? 'ascending' : 'descending') + '</caption>' +
    '<thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div></section>';
}

/* Mosaic: a squarified treemap, conference > division > team. Divisions are a
   fixed fact of the league and are not in the standings payload, so they are
   keyed by ESPN abbreviation here. A team missing from this map lands in an
   "Other" block of its conference instead of disappearing. */
const NBA_DIVISIONS = [
  ['East', 'Atlantic', ['BOS', 'BKN', 'NY', 'PHI', 'TOR']],
  ['East', 'Central', ['CHI', 'CLE', 'DET', 'IND', 'MIL']],
  ['East', 'Southeast', ['ATL', 'CHA', 'MIA', 'ORL', 'WSH']],
  ['West', 'Northwest', ['DEN', 'MIN', 'OKC', 'POR', 'UTAH']],
  ['West', 'Pacific', ['GS', 'LAC', 'LAL', 'PHX', 'SAC']],
  ['West', 'Southwest', ['DAL', 'HOU', 'MEM', 'NO', 'SA']],
];

function mosaicGroups(standings) {
  return ['East', 'West'].map((conf) => {
    const rows = standings[conf];
    const used = new Set();
    const divisions = NBA_DIVISIONS.filter((entry) => entry[0] === conf).map(([, name, abbrs]) => {
      const teams = rows.filter((row) => abbrs.includes(row.abbr));
      teams.forEach((row) => used.add(row.teamId));
      return { name, teams };
    });
    const other = rows.filter((row) => !used.has(row.teamId));
    if (other.length) divisions.push({ name: 'Other', teams: other });
    return { conf, title: conf === 'East' ? 'Eastern Conference' : 'Western Conference', divisions: divisions.filter((d) => d.teams.length) };
  });
}

// Squarified treemap (Bruls, Huizing, van Wijk): fill the short side with rows
// whose worst aspect ratio keeps improving. Items need v > 0.
function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((sum, item) => sum + item.v, 0);
  if (!total || w <= 0 || h <= 0) return out;
  const scale = (w * h) / total;
  let rest = items.map((item) => ({ ...item, a: item.v * scale }));
  while (rest.length) {
    const short = Math.min(w, h);
    let row = [];
    let best = Infinity;
    for (const item of rest) {
      const next = [...row, item];
      const sum = next.reduce((acc, z) => acc + z.a, 0);
      const max = Math.max(...next.map((z) => z.a));
      const min = Math.min(...next.map((z) => z.a));
      const worst = Math.max((short * short * max) / (sum * sum), (sum * sum) / (short * short * min));
      if (worst > best) break;
      best = worst;
      row = next;
    }
    const sum = row.reduce((acc, z) => acc + z.a, 0);
    if (w >= h) {
      const colW = sum / h;
      let cy = y;
      for (const item of row) {
        const ch = item.a / colW;
        out.push({ ...item, x, y: cy, w: colW, h: ch });
        cy += ch;
      }
      x += colW;
      w -= colW;
    } else {
      const rowH = sum / w;
      let cx = x;
      for (const item of row) {
        const cw = item.a / rowH;
        out.push({ ...item, x: cx, y, w: cw, h: rowH });
        cx += cw;
      }
      y += rowH;
      h -= rowH;
    }
    rest = rest.slice(row.length);
  }
  return out;
}

  wins: {

  },
  diff: {

    value: (row, ctx) => {

    },

function mosaicHTML(groups, colors) {
  const tiles = groups.flatMap((g) => g.divisions.flatMap((d) => d.teams)).map((row) => {
    const look = teamLook(colors, row.abbr, row.teamId, row.logo);
    const logo = look.logo ? '<img class="mz-logo" src="' + esc(smallImg(look.logo, 72, 72)) + '" alt="" width="28" height="28" decoding="async">' : '';
    const rec = row.wins != null && row.losses != null ? row.wins + '-' + row.losses : '';
    const form = [
      pointDiff(row) == null ? '' : 'DIFF ' + signedDecimal(pointDiff(row)),
      row.last10 ? 'L10 ' + row.last10 : '',
      row.streak ? 'STRK ' + row.streak : '',
    ];
    const tip = [row.name, rec, ...form.filter(Boolean)].filter(Boolean).join(' · ');
    return '<a class="mz-tile" data-t="' + esc(row.teamId) + '" href="#team/' + esc(row.teamId) + '" title="' + esc(tip) + '">' +
      '<div class="mz-in" style="background:' + look.fill + ';color:' + look.ink + '"><div class="mz-top">' + logo +
      '<span class="ab" data-l="ab">' + esc(row.abbr) + '</span></div><div class="mz-bot">' +
      '<span class="v" data-l="v"></span><span class="rc" data-l="rc">' + esc(rec) + '</span>' +
      '<span class="mz-x" data-l="dx">' + esc(form[0]) + '</span><span class="mz-x" data-l="l10">' + esc(form[1]) + '</span><span class="mz-x" data-l="st">' + esc(form[2]) + '</span>' +
      '</div></div></a>';
  }).join('');
  const labels = groups.map((g) => '<span class="mz-lab mz-conf" data-c="' + g.conf + '">' + esc(g.title) + '</span>' +
    g.divisions.map((d) => '<span class="mz-lab mz-div" data-d="' + g.conf + '/' + esc(d.name) + '">' + esc(d.name) + '</span>').join('')).join('');
  return '<section class="card mz" aria-label="Standings treemap">' +
    '<div class="mz-bar"><div class="mz-ctrl" role="group" aria-label="Size tiles by">' +
    Object.entries(MOSAIC_METRICS).map(([key, m]) => '<button type="button" data-m="' + key + '" aria-pressed="' + (key === 'wins') + '">' + esc(m.label) + '</button>').join('') +
    '</div></div><p class="mz-note" id="mzNote"></p>' +
    '<div class="mz-map" id="mzMap">' + labels + tiles + '</div></section>';
}

// Text on a tile is budgeted from the tile's own size. Lines are added in
// priority order (abbreviation, record, size metric, point diff, last 10,
// streak) at a font scaled to the tile, shrunk to fit the width; the first line
// that cannot fit, and everything after it, is dropped. Nothing can overflow.
const clampNum = (value, lo, hi) => Math.max(lo, Math.min(hi, value));

function fitTile(el, row, r, spec) {
  const s = Math.min(r.w, r.h);
  const padX = clampNum(r.w * 0.07, 3, 9);
  const padY = clampNum(r.h * 0.07, 3, 9);
  el.querySelector('.mz-in').style.padding = padY + 'px ' + padX + 'px';
  const innerW = r.w - 4 - padX * 2;
  let room = r.h - 4 - padY * 2;
  const gap = s < 70 ? 1 : 3;

  const logo = el.querySelector('.mz-logo');
  if (logo) {
    const size = clampNum(s * 0.2, 20, 30);
    const show = s >= 110 && room > size + 90;
    logo.style.display = show ? '' : 'none';
    if (show) {
      logo.style.width = logo.style.height = size + 'px';
      room -= size + 5;
    }
  }

  const rec = row.wins != null && row.losses != null ? row.wins + '-' + row.losses : '';
  const diff = pointDiff(row);
  const small = clampNum(s * 0.085, 8.5, 11.5);
  const lines = [
    { l: 'ab', text: row.abbr, font: clampNum(s * 0.24, 11, 34), min: 8, k: 0.74, lh: 1 },
    { l: 'rc', text: rec, font: clampNum(s * 0.11, 9, 14), min: 7.5, k: 0.62, lh: 1.15 },
    { l: 'v', text: spec.show(row), alt: spec.show(row, true), font: clampNum(s * 0.15, 10, 24), min: 7.5, k: 0.62, lh: 1.1 },
    { l: 'dx', text: diff == null ? '' : 'DIFF ' + signedDecimal(diff), font: small, min: 7.5, k: 0.62, lh: 1.15 },
    { l: 'l10', text: row.last10 ? 'L10 ' + row.last10 : '', font: small, min: 7.5, k: 0.62, lh: 1.15 },
    { l: 'st', text: row.streak ? 'STRK ' + row.streak : '', font: small, min: 7.5, k: 0.62, lh: 1.15 },
  ];
  let used = 0;
  let open = true;
  for (const line of lines) {
    const node = el.querySelector('[data-l="' + line.l + '"]');
    let text = line.text;
    let font = line.font;
    let ok = open && Boolean(text);
    if (ok) {
      if (text.length * font * line.k > innerW && line.alt) text = line.alt;
      if (text.length * font * line.k > innerW) font = innerW / (text.length * line.k);
      const need = font * line.lh + (used ? gap : 0);
      ok = font >= line.min && used + need <= room;
      if (ok) used += need;
    }
    if (!ok) {
      node.style.display = 'none';
      if (text) open = false;
      continue;
    }
    node.textContent = text;
    node.style.fontSize = font + 'px';
    node.style.display = '';
  }
}

function wireMosaic(groups) {
  const map = document.getElementById('mzMap');
  const note = document.getElementById('mzNote');
  if (!map || !note) return;
  const byId = new Map(groups.flatMap((g) => g.divisions.flatMap((d) => d.teams)).map((row) => [row.teamId, row]));
  const tileOf = (id) => map.querySelector('[data-t="' + id + '"]');
  let metric = 'wins';

  function layout() {
    if (!map.isConnected) return;
    const W = map.clientWidth;
    if (W <= 0) return;
    const spec = MOSAIC_METRICS[metric];
    const diffs = [...byId.values()].map(pointDiff).filter((d) => d != null);
    const ctx = { minDiff: diffs.length ? Math.min(...diffs) : 0 };
    let placed = 0;
    // Teams with no value for this measure are left out of the layout.
    const valueOf = (row) => {
      const v = spec.value(row, ctx);
      return v != null && v > 0 ? v : null;
    };
    const sumTeams = (teams) => teams.reduce((acc, row) => acc + (valueOf(row) || 0), 0);
    const tiles = [...byId.keys()];
    tiles.forEach((id) => { tileOf(id).style.display = 'none'; });
    map.querySelectorAll('.mz-lab').forEach((el) => { el.style.display = 'none'; });
    const place = (el, x, y) => { el.style.display = ''; el.style.left = x + 'px'; el.style.top = y + 'px'; };

    function drawTeams(teams, x, y, w, h) {
      const items = teams.map((row) => ({ id: row.teamId, v: valueOf(row) })).filter((item) => item.v != null).sort((a, b) => b.v - a.v);
      for (const r of squarify(items, x, y, w, h)) {
        const row = byId.get(r.id);
        const el = tileOf(r.id);
        placed += 1;
        Object.assign(el.style, { display: '', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
        fitTile(el, row, r, spec);
      }
    }

    if (W > 640) {
      const H = Math.round(Math.min(720, Math.max(520, W * 0.6)));
      map.style.height = H + 'px';
      const confs = groups.map((g) => ({ id: g.conf, g, v: g.divisions.reduce((acc, d) => acc + sumTeams(d.teams), 0) })).filter((c) => c.v > 0);
      for (const c of squarify(confs, 0, 0, W, H)) {
        place(map.querySelector('[data-c="' + c.id + '"]'), c.x + 8, c.y + 5);
        const divs = c.g.divisions.map((d) => ({ id: d.name, d, v: sumTeams(d.teams) })).filter((d) => d.v > 0).sort((a, b) => b.v - a.v);
        for (const d of squarify(divs, c.x + 3, c.y + 26, c.w - 6, c.h - 29)) {
          place(map.querySelector('[data-d="' + c.id + '/' + d.id + '"]'), d.x + 7, d.y + 4);
          drawTeams(d.d.teams, d.x + 3, d.y + 22, d.w - 6, d.h - 25);
        }
      }
    } else {
      // Phone: one block per division, stacked, full width. Nothing can
      // overflow sideways because every rectangle is cut from [0, W].
      let y = 0;
      const blockH = Math.round(W * 0.78);
      for (const g of groups) {
        const live = g.divisions.filter((d) => sumTeams(d.teams) > 0);
        if (!live.length) continue;
        place(map.querySelector('[data-c="' + g.conf + '"]'), 2, y + 2);
        y += 26;
        for (const d of live) {
          place(map.querySelector('[data-d="' + g.conf + '/' + d.name + '"]'), 2, y);
          drawTeams(d.teams, 0, y + 18, W, blockH);
          y += 18 + blockH + 10;
        }
      }
      map.style.height = Math.max(0, y) + 'px';
    }
    const missing = byId.size - placed;
    note.textContent = spec.note + (missing > 0 ? ' ' + missing + ' team' + (missing === 1 ? '' : 's') + ' without this stat left out.' : '');
    document.querySelectorAll('.mz-ctrl button').forEach((button) => button.setAttribute('aria-pressed', String(button.getAttribute('data-m') === metric)));
  }

  document.querySelector('.mz-ctrl').addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    metric = button.getAttribute('data-m');
    layout();
  });
  const onResize = () => layout();
  window.addEventListener('resize', onResize);
  // stopPolling() runs on every route change and calls these closers.
  pickerClosers.push(() => window.removeEventListener('resize', onResize));
  layout();
  return layout;
}

async function showStandings(mode) {
  stopPolling();
  const token = ++requestId;
  const league = mode === 'league';
  app.innerHTML = loadingHTML();

  let standings;
  let colors;
  try {
    [standings, colors] = await Promise.all([
      fetchJSON(STANDINGS_API).then(parseStandings),
      getTeamColors(),
    ]);
  } catch (err) {
    if (token === requestId) showError(() => showStandings(mode));
    return;
  }
  if (token !== requestId) return;

  const switchHTML = '<nav class="standings-switch" aria-label="Standings scope">' +
    '<a href="#standings"' + (league ? '' : ' aria-current="page"') + '>Conference</a>' +
    '<a href="#standings/league"' + (league ? ' aria-current="page"' : '') + '>League</a></nav>';

  setTitle('NBA Standings');

  let view = readStandingsView();
  const segHTML = '<div class="seg st-seg" role="group" aria-label="Standings display">' +
    ['table', 'map'].map((key) => '<button type="button" data-v="' + key + '" aria-pressed="' + (view === key) + '">' + (key === 'table' ? 'Table' : 'Map') + '</button>').join('') + '</div>';

  const groups = mosaicGroups(standings);
  app.innerHTML = '<div class="st-bar">' + switchHTML + segHTML + '</div>' +
    '<div class="st-pane" id="stTable"' + (view === 'table' ? '' : ' hidden') + '>' + standingsTablesHTML(standings, league, colors) + '</div>' +
    '<div class="st-pane" id="stMap"' + (view === 'map' ? '' : ' hidden') + '>' + mosaicHTML(groups, colors) + '</div>';
  wireStandingsSort(standings, league, colors);
  const layout = wireMosaic(groups);

  // The map measures its own box, so it lays out only once it is visible.
  const paneOf = (key) => document.getElementById(key === 'table' ? 'stTable' : 'stMap');
  document.querySelector('.st-seg').addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    view = button.getAttribute('data-v');
    saveStandingsView(view);
    ['table', 'map'].forEach((key) => { paneOf(key).hidden = key !== view; });
    document.querySelectorAll('.st-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === view)));
    if (view === 'map' && layout) layout();
  });
}

/* ── Compare ────────────────────────────────────────────────────────────── */
const WEB = 'https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba';
let standingsCache = null;
let standingsAt = 0;

async function getStandings() {
  if (!standingsCache) {
    standingsCache = parseStandings(await fetchJSON(STANDINGS_API));
    standingsAt = Date.now();
  }
  return standingsCache;
}

// Scores polls every 30s; standings only change when a game ends, so reload
// them at most once per maxAge.
async function getStandingsFresh(maxAge) {
  if (standingsCache && Date.now() - standingsAt < maxAge) return standingsCache;
  standingsCache = parseStandings(await fetchJSON(STANDINGS_API));
  standingsAt = Date.now();
  return standingsCache;
}

function allTeams(standings) {
  return [...standings.East, ...standings.West].slice().sort((a, b) => a.name.localeCompare(b.name));
}

function standingFor(standings, id) {
  const key = String(id);
  return [...standings.East, ...standings.West].find((row) => row.teamId === key) || null;
}

// One team, everything the compare table needs: standings row (record, points
// for and against), season averages and the schedule (last five, head to head).
const TEAM_TTL = 5 * 60 * 1000;
const teamCache = new Map();

// One team cache (statistics + schedule, five minutes) shared by compare,
// pre-game and the team page.
async function teamData(id) {
  const key = String(id);
  const hit = teamCache.get(key);
  if (hit && Date.now() - hit.at < TEAM_TTL) return hit.value;
  const [statsJson, scheduleJson] = await Promise.all([
    fetchJSON(API + '/teams/' + encodeURIComponent(key) + '/statistics'),
    // A missing schedule costs that team's last five, not the whole view.
    fetchJSON(API + '/teams/' + encodeURIComponent(key) + '/schedule').catch(() => ({})),
  ]);
  const value = { stats: parseTeamStats(statsJson), schedule: parseTeamSchedule(scheduleJson) };
  teamCache.set(key, { at: Date.now(), value });
  if (value.schedule.games.length) keepRestSchedule(key, value.schedule);
  return value;
}

/* ── Rest ───────────────────────────────────────────────────────────────── */
/* Days since each team's previous game, from ESPN's team schedule. A schedule
   is fetched only when a card, the inspector or the game header showing that
   team scrolls into view, then kept for the browser session (memory plus
   sessionStorage, dates only). No schedule, no chip. */
const REST_RETRY = 5 * 60 * 1000;
const restSchedules = new Map(); // team id -> { games } | null (failed, with .at)
const restPending = new Map(); // team id -> Promise
let restObserver = null;

function restStoreKey(id) {
  return 'mb-nba-rest-' + id;
}

function keepRestSchedule(id, schedule) {
  const games = schedule.games.map((game) => ({ startISO: game.startISO, postponed: Boolean(game.postponed) }));
  restSchedules.set(String(id), { games });
  try {
    sessionStorage.setItem(restStoreKey(id), JSON.stringify(games));
  } catch (err) {
    // Private mode or a full store: the in-memory copy still serves this page.
  }
}

function cachedRestSchedule(id) {
  const key = String(id);
  const hit = restSchedules.get(key);
  if (hit && hit.games) return hit;
  if (hit && Date.now() - hit.at < REST_RETRY) return null;
  try {
    const raw = sessionStorage.getItem(restStoreKey(key));
    const games = raw ? JSON.parse(raw) : null;
    if (Array.isArray(games) && games.length) {
      restSchedules.set(key, { games });
      return restSchedules.get(key);
    }
  } catch (err) {
    // Unreadable entry: fetch again.
  }
  return undefined;
}

function restSchedule(id) {
  const key = String(id);
  const hit = cachedRestSchedule(key);
  if (hit !== undefined) return Promise.resolve(hit);
  if (!restPending.has(key)) {
    restPending.set(key, fetchJSON(API + '/teams/' + encodeURIComponent(key) + '/schedule')
      .then((json) => {
        const schedule = parseTeamSchedule(json);
        if (!schedule.games.length) throw new Error('empty schedule');
        keepRestSchedule(key, schedule);
        return restSchedules.get(key);
      })
      .catch(() => {
        restSchedules.set(key, { games: null, at: Date.now() });
        return null;
      })
      .finally(() => restPending.delete(key)));
  }
  return restPending.get(key);
}

function restChipHTML(teamId, day) {
  if (!teamId || !day) return '';
  return '<span class="rest" data-rest-team="' + esc(teamId) + '" data-rest-day="' + esc(day) + '" hidden></span>';
}

function paintRestChip(chip, schedule) {
  const info = schedule ? restInfo(schedule, chip.getAttribute('data-rest-day')) : null;
  if (!info) return;
  // Break "B2B · 3 in 4" only after the dot, so a narrow drawer cell wraps it whole.
  chip.textContent = info.label.replace(/ in /g, '\u00a0in\u00a0').replace(/^B2B ·/, 'B2B\u00a0·');
  chip.title = info.b2b && info.threeInFour ? 'Second night of a back-to-back, third game in four nights'
    : info.b2b ? 'Second night of a back-to-back'
      : info.threeInFour ? 'Third game in four nights'
        : info.daysSince + ' days since the last game';
  chip.classList.toggle('tired', info.b2b || info.threeInFour);
  chip.hidden = false;
  const row = chip.closest('.rs-row');
  if (row) row.hidden = false;
}

// Paints what the cache already has right away (so a live refresh never
// flickers), and returns true when every chip in the scope is settled.
function paintRestFromCache(scope) {
  let settled = true;
  scope.querySelectorAll('[data-rest-team]').forEach((chip) => {
    const hit = cachedRestSchedule(chip.getAttribute('data-rest-team'));
    if (hit === undefined) settled = false;
    else paintRestChip(chip, hit);
  });
  return settled;
}

function fillRest(scope) {
  scope.querySelectorAll('[data-rest-team]').forEach((chip) => {
    restSchedule(chip.getAttribute('data-rest-team')).then((schedule) => {
      if (chip.isConnected) paintRestChip(chip, schedule);
    });
  });
}

function watchRest(root) {
  if (!root) return;
  const scopes = root.matches && root.matches('[data-rest-scope]') ? [root] : [...root.querySelectorAll('[data-rest-scope]')];
  if (!restObserver && 'IntersectionObserver' in window) {
    restObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        restObserver.unobserve(entry.target);
        fillRest(entry.target);
      });
    }, { rootMargin: '120px 0px' });
  }
  scopes.forEach((scope) => {
    if (paintRestFromCache(scope)) return;
    if (restObserver) restObserver.observe(scope);
    else fillRest(scope);
  });
}

async function teamBundle(id) {
  const key = String(id);
  const [standings, team] = await Promise.all([getStandings(), teamData(key)]);
  const stats = team.stats;
  const schedule = team.schedule;
  const row = standingFor(standings, key);
  const wins = row ? row.wins : null;
  const losses = row ? row.losses : null;
  return {
    id: key,
    abbr: (row && row.abbr) || schedule.team.abbr,
    name: (row && row.name) || schedule.team.name,
    logo: (row && row.logo) || schedule.team.logo,
    wins,
    losses,
    record: wins != null && losses != null ? wins + '-' + losses : (schedule.team.record || ''),
    ppg: row ? row.ppg : null,
    oppPpg: row ? row.oppPpg : null,
    stats,
    schedule,
  };
}

function oneDecimal(value) {
  if (value == null || Number.isNaN(value)) return '—';
  return (Math.round(value * 10) / 10).toFixed(1);
}

// Box-score counts are whole numbers; oneDecimal would show 46 rebounds as 46.0.
function wholeNumber(value) {
  if (value == null || Number.isNaN(Number(value))) return '—';
  return String(Math.round(Number(value)));
}

function signedDecimal(value) {
  if (value == null || Number.isNaN(value)) return '—';
  const rounded = Math.round(value * 10) / 10;
  return (rounded > 0 ? '+' : '') + rounded.toFixed(1);
}

function ratioDecimal(value) {
  if (value == null || Number.isNaN(value)) return '—';
  return (Math.round(value * 100) / 100).toFixed(2);
}

function pointDiff(row) {
  return row.ppg == null || row.oppPpg == null ? null : row.ppg - row.oppPpg;
}

// League view: one table of 30 by win percentage, then point differential.
function byLeague(a, b) {
  const pct = (b.pct ?? -1) - (a.pct ?? -1);
  if (pct !== 0) return pct;
  const diffA = pointDiff(a);
  const diffB = pointDiff(b);
  if (diffA != null && diffB != null && diffA !== diffB) return diffB - diffA;
  if (diffA != null && diffB == null) return -1;
  if (diffA == null && diffB != null) return 1;
  return a.name.localeCompare(b.name);
}

function wireComparePicker(a, b) {
  const selectA = document.getElementById('cmpA');
  const selectB = document.getElementById('cmpB');
  const go = (nextA, nextB) => {
    const hash = hashForCompare(nextA, nextB);
    if (location.hash === hash) return;
    location.hash = hash;
  };
  selectA.addEventListener('change', () => go(selectA.value, selectB.value));
  selectB.addEventListener('change', () => go(selectA.value, selectB.value));
  document.getElementById('cmpSwap').addEventListener('click', () => go(b, a));
}

function recentGames(games, count) {
  return games.filter((game) => game.result !== null)
    .slice()
    .sort((x, y) => new Date(y.startISO) - new Date(x.startISO))
    .slice(0, count);
}

/* ── Compare (cp-*) ─────────────────────────────────────────────────────── */
// Compare never opens empty: with no teams picked it takes the first game on
// tonight's slate, or the latest game of the most recent day that had one.
async function defaultCompareGame() {
  let day = currentSlateDay();
  for (let back = 0; back < 8; back += 1) {
    const games = await fetchJSON(API + '/scoreboard?dates=' + day).then(parseScoreboard);
    const pick = pickCompareGame(games, back === 0 ? 'first' : 'last');
    if (pick) return pick;
    day = shiftDay(day, -1);
  }
  return null;
}

// The two teams' meetings this season, in the shape the game page's series block reads.
function cpSeries(left, right) {
  const rival = new Map(right.schedule.games.map((game) => [game.id, game]));
  return left.schedule.games.filter((game) => rival.has(game.id))
    .sort((x, y) => new Date(x.startISO) - new Date(y.startISO))
    .map((game) => {
      const home = game.homeAway === 'home';
      const mine = { abbr: left.abbr, score: game.score };
      const theirs = { abbr: right.abbr, score: game.oppScore };
      const [away, hom] = home ? [theirs, mine] : [mine, theirs];
      return {
        id: game.id, date: game.startISO, state: game.result ? 'post' : 'pre',
        away: away.abbr, home: hom.abbr, awayScore: away.score, homeScore: hom.score,
        winnerAbbr: game.result ? (game.result === 'W' ? left.abbr : right.abbr) : '',
      };
    });
}

function cpLastFive(team) {
  return recentGames(team.schedule.games, 5).map((game) => ({
    id: game.id, date: game.startISO, result: game.result, atVs: game.homeAway === 'home' ? 'vs' : '@',
    opponentAbbr: game.opponent.abbr, score: (game.score == null ? '' : game.score) + (game.oppScore == null ? '' : '-' + game.oppScore),
  }));
}

function cpMidHTML(series, game) {
  const done = series.filter((g) => g.state === 'post');
  return '<div class="gm-mid"><span class="gm-day">' + (game ? esc(formatDay(etDate(game.startISO) || '')) : 'Season series') + '</span>' +
    '<span class="gm-st">vs</span>' +
    (done.length ? '<span class="gm-meta cp-h2h">Head to head this season: ' + done.length + ' played</span>' : '<span class="gm-meta">No meetings played yet</span>') +
    (game ? '<a class="cp-open" href="#game/' + esc(game.id) + '">' + esc(game.state === 'pre' ? tipOff(game.startISO) || 'Scheduled' : game.statusText || 'Final') + ' · Game details →</a>' : '') +
    '</div>';
}

async function showCompare(idA, idB) {
  stopPolling();
  const token = ++requestId;
  app.innerHTML = loadingHTML();

  let standings;
  let colors;
  try {
    [standings, colors] = await Promise.all([getStandings(), getTeamColors()]);
  } catch (err) {
    if (token === requestId) showError(() => showCompare(idA, idB));
    return;
  }
  if (token !== requestId) return;

  const teams = allTeams(standings);
  const wanted = (id) => (teams.some((row) => row.teamId === String(id || '')) ? String(id) : '');
  let a = wanted(idA);
  let b = wanted(idB);
  let game = null;

  if (!a && !b) {
    try {
      game = await defaultCompareGame();
    } catch (err) {
      game = null;
    }
    if (token !== requestId) return;
    if (game) {
      a = wanted(game.away.id);
      b = wanted(game.home.id);
    }
  }

  if (!a || !b) {
    app.innerHTML = comparePickerHTML(teams, a, b) + '<div class="state">' +
      esc(a ? 'Pick the second team to compare.' : 'Pick two teams to compare their season so far.') + '</div>';
    wireComparePicker(a, b);
    return;
  }

  let left;
  let right;
  try {
    [left, right] = await Promise.all([teamBundle(a), teamBundle(b)]);
  } catch (err) {
    if (token === requestId) showError(() => showCompare(a, b));
    return;
  }
  if (token !== requestId) return;

  const looks = gmLooks({ away: left, home: right }, colors);
  const series = cpSeries(left, right);
  const side = (team) => ({ id: team.id, abbr: team.abbr, name: team.name, record: team.record, score: null });
  const pre = { lastFive: { [left.abbr]: cpLastFive(left), [right.abbr]: cpLastFive(right) }, seasonSeries: series };
  const shell = { id: game ? game.id : '', away: left, home: right };
  // The game that opened the page, only while its two teams are still the pick.
  const shown = game && game.away.id === a && game.home.id === b ? game : null;
  const tape = gmTapeHTML(COMPARE_ROWS, left, right, looks, left.abbr + ' vs ' + right.abbr + ' · season comparison', 'season');
  const rightCol = gmSeriesHTML(pre, shell) + gmLastFiveHTML(shell, pre, looks);

  setTitle(left.abbr + ' vs ' + right.abbr + ' · Compare');

  app.innerHTML = comparePickerHTML(teams, a, b) +
    '<div class="gm cp"><div class="gm-bug">' + gmBlockHTML(side(left), looks.away, 'away', { state: 'pre' }) + cpMidHTML(series, shown) +
    gmBlockHTML(side(right), looks.home, 'home', { state: 'pre' }) + '</div>' +
    '<div class="gm-cols' + (tape && rightCol ? ' two' : '') + '">' +
    (tape ? '<div class="gm-col">' + tape + '</div>' : '') + (rightCol ? '<div class="gm-col">' + rightCol + '</div>' : '') + '</div></div>';

  wireComparePicker(a, b);
}

  { key: 'rebounds', label: 'Rebounds', category: 'general', stat: 'avgRebounds' },
  { key: 'assists', label: 'Assists', category: 'offensive', stat: 'avgAssists' },
  { key: 'steals', label: 'Steals', category: 'defensive', stat: 'avgSteals' },
  { key: 'blocks', label: 'Blocks', category: 'defensive', stat: 'avgBlocks' },

// Every leaders board with each player's full per-game line (parseLeaderLines).
// A board that fails to load comes back with rows: null and is named once.
const leaderLinesCache = new Map();

async function loadLeaderBoards() {
  return Promise.all(LEADER_BOARDS.map(async (board) => {
    if (leaderLinesCache.has(board.key)) return { board, rows: leaderLinesCache.get(board.key) };
    try {
      const url = LEADERS_API + '?limit=50&category=' + encodeURIComponent(board.category) +
        '&sort=' + encodeURIComponent(board.category + '.' + board.stat + ':desc');
      const rows = parseLeaderLines(await fetchJSON(url), board.category, board.stat, 0);
      leaderLinesCache.set(board.key, rows);
      return { board, rows };
    } catch (err) {
      return { board, rows: null };
    }
  }));
}

function missingBoardsHTML(results) {

// Stat sheet: one stat at a time, 25 deep, with a chart that fits the stat.
// x is a field from the same ESPN byathlete row; y is the board's own stat.
const SHEET_COLS = [['gp', 'GP', (v) => String(v)], ['min', 'MIN', oneDecimal], ['fga', 'FGA', oneDecimal], ['fgPct', 'FG%', oneDecimal], ['tpm', '3PM', oneDecimal], ['threePct', '3P%', oneDecimal],
  ['fta', 'FTA', oneDecimal], ['ftPct', 'FT%', oneDecimal], ['reb', 'REB', oneDecimal], ['ast', 'AST', oneDecimal], ['to', 'TO', oneDecimal], ['stl', 'STL', oneDecimal], ['blk', 'BLK', oneDecimal]];
const SHEET_STATS = {
  points: { name: 'points', short: 'PTS', x: 'fgPct', xLabel: 'FG%', pct: true, title: 'Volume vs efficiency', note: 'Up is more points per game, right is a higher field-goal percentage.' },
  rebounds: { name: 'rebounds', short: 'REB', x: 'min', xLabel: 'MIN', title: 'Rebounds vs minutes', note: 'Up is more rebounds per game, right is more minutes. Above the pack means more boards per minute.' },
  assists: { name: 'assists', short: 'AST', x: 'to', xLabel: 'TO', title: 'Assists vs turnovers', note: 'Up is more assists per game, right is more turnovers. Up and to the left is the cleaner passer.' },
  steals: { name: 'steals', short: 'STL', x: 'min', xLabel: 'MIN', title: 'Steals vs minutes', note: 'Up is more steals per game, right is more minutes on the floor.' },
  blocks: { name: 'blocks', short: 'BLK', x: 'min', xLabel: 'MIN', title: 'Blocks vs minutes', note: 'Up is more blocks per game, right is more minutes on the floor.' },
  threes: { name: 'threes made', short: '3PM', x: 'threePct', xLabel: '3P%', pct: true, title: 'Makes vs accuracy', note: 'Up is more threes made per game, right is a higher three-point percentage.' },
};

// Tick step that gives five to eight lines across a range.
function niceStep(span) {
  for (const step of [0.5, 1, 2, 2.5, 5, 10, 20]) if (span / step <= 8) return step;
  return 50;
}

function leaderPlotHTML(rows, colors, spec, unit, labelCount = 8) {
  const pts = rows.filter((r) => r.line[spec.x] != null);
  if (pts.length < 3) return '';
  const W = 560;
  const H = 420;
  const pad = { l: 44, r: 16, t: 30, b: 40 };
  const xs = pts.map((r) => r.line[spec.x]);
  const ys = pts.map((r) => r.value);
  const xStep = niceStep(Math.max(...xs) - Math.min(...xs) || 1);
  const yStep = niceStep(Math.max(...ys) - Math.min(...ys) || 1);
  const x0 = Math.floor(Math.min(...xs) / xStep) * xStep;
  const x1 = Math.ceil(Math.max(...xs) / xStep) * xStep;
  const y0 = Math.floor(Math.min(...ys) / yStep) * yStep;
  const y1 = Math.ceil(Math.max(...ys) / yStep) * yStep;
  const X = (v) => pad.l + ((v - x0) / (x1 - x0 || 1)) * (W - pad.l - pad.r);
  const Y = (v) => H - pad.b - ((v - y0) / (y1 - y0 || 1)) * (H - pad.t - pad.b);
  const fmt = (v) => String(Math.round(v * 10) / 10);
  const ticks = [];
  for (let v = x0; v <= x1 + 1e-9; v += xStep) ticks.push('<line class="ax" x1="' + X(v) + '" x2="' + X(v) + '" y1="' + pad.t + '" y2="' + (H - pad.b) + '"/><text x="' + X(v) + '" y="' + (H - pad.b + 18) + '" text-anchor="middle">' + fmt(v) + (spec.pct ? '%' : '') + '</text>');
  for (let v = y0; v <= y1 + 1e-9; v += yStep) ticks.push('<line class="ax" x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text x="' + (pad.l - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + fmt(v) + '</text>');
  const dots = pts.map((r) => {
    const look = teamLook(colors, r.teamAbbr, '', '');
    const named = r.rank <= labelCount;
    return '<circle cx="' + X(r.line[spec.x]).toFixed(1) + '" cy="' + Y(r.value).toFixed(1) + '" r="' + (named ? 6 : 4.5) + '" fill="' + inkOf(look, 3) + '" fill-opacity="' + (named ? 1 : 0.75) + '">' +
      '<title>' + esc(r.name + ' · ' + oneDecimal(r.value) + ' ' + unit + ' · ' + oneDecimal(r.line[spec.x]) + ' ' + spec.xLabel) + '</title></circle>';
  }).join('');
  // Name the top players. Each label tries the right of its dot, then the
  // left, then steps down until it clears the labels already placed.
  const placed = [];
  const clear = (box) => placed.every((b) => box.x1 < b.x0 || box.x0 > b.x1 || box.y1 < b.y0 || box.y0 > b.y1);
  const labels = pts.filter((r) => r.rank <= labelCount).sort((a, b) => a.rank - b.rank).map((r) => {
    const cx = X(r.line[spec.x]);
    const cy = Y(r.value) + 4;
    const text = lastName(r.name);
    const w = text.length * 7.6;
    const sides = [];
    if (cx + 9 + w <= W - pad.r) sides.push(true);
    if (cx - 9 - w >= pad.l) sides.push(false);
    let best = null;
    for (let dy = 0; dy <= 64 && !best; dy += 16) {
      for (const sy of dy ? [dy, -dy] : [0]) {
        for (const right of sides) {
          const x0 = right ? cx + 9 : cx - 9 - w;
          const box = { x0, x1: x0 + w, y0: cy + sy - 12, y1: cy + sy + 2 };
          if (!best && clear(box)) best = { right, y: cy + sy, box };
        }
      }
    }
    if (!best) return '';
    placed.push(best.box);
    return '<text class="lb" x="' + (cx + (best.right ? 9 : -9)).toFixed(1) + '" y="' + best.y.toFixed(1) + '" text-anchor="' + (best.right ? 'start' : 'end') + '">' + esc(text) + '</text>';
  }).join('');
  return '<figure class="ld-plot"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(unit + ' against ' + spec.xLabel + ' for ' + pts.length + ' players') + '">' +
    ticks.join('') + dots + labels +
    '<text x="' + (W - pad.r) + '" y="' + (H - 4) + '" text-anchor="end">' + esc(spec.xLabel) + ' →</text><text x="4" y="14">' + esc(unit) + ' ↑</text></svg></figure>';
}

function leaderSheetHTML(result, colors) {
  const { board, rows } = result;
  const spec = SHEET_STATS[board.key];
  const unit = BOARD_UNIT[board.key] || '';
  const top = rows.slice(0, 25);
  const cols = SHEET_COLS.filter(([key]) => key !== BOARD_LINE_KEY[board.key] && top.some((row) => row.line[key] != null));
  const body = top.map((row) => {
    const look = teamLook(colors, row.teamAbbr, '', '');
    return '<tr style="--c:' + look.fill + '"><td class="rk">' + esc(row.rank) + '</td><td class="nm l sticky"><span class="sw"></span><a href="#player/' + esc(row.id) + '">' + esc(row.name) + '</a></td>' +
      '<td class="dim l">' + esc(row.teamAbbr) + '</td><td class="big">' + esc(oneDecimal(row.value)) + '</td>' +
      cols.map(([key, , fmt]) => '<td>' + esc(row.line[key] == null ? '—' : fmt(row.line[key])) + '</td>').join('') + '</tr>';
  }).join('');
  const table = '<section class="card"><div class="ld-ch"><h2>' + esc(spec.name.charAt(0).toUpperCase() + spec.name.slice(1)) + ' per game</h2><span>Top ' + top.length + ' of ' + esc(rows.length) + ' in ESPN\'s list</span></div>' +
    '<div class="ld-scroll"><table class="ld-t"><caption class="sr-only">' + esc(board.label) + ' leaders with full per-game lines</caption><thead><tr><th>#</th><th class="l sticky">Player</th><th class="l">Tm</th><th>' + esc(spec.short) + '</th>' +
    cols.map(([, label]) => '<th>' + esc(label) + '</th>').join('') + '</tr></thead><tbody>' + body + '</tbody></table></div></section>';
  const plot = leaderPlotHTML(rows, colors, spec, unit);
  const chart = plot
    ? '<section class="card"><div class="ld-ch"><h2>' + esc(spec.title) + '</h2><span>All ' + esc(rows.length) + ' players</span></div>' + plot +
      '<p class="ld-note">Each dot is a player in ESPN\'s ' + esc(spec.name) + ' list. ' + esc(spec.note) + ' The top eight are named where they fit; hover a dot for any player.</p></section>'
    : '';
  return '<div class="ld-sheet">' + table + (chart ? '<div>' + chart + '</div>' : '') + '</div>';
}

// The two leaders views and the stat-sheet stat are remembered per browser.
const LEADERS_VIEW_KEY = 'mb.nba.leaders.view';
const LEADERS_STAT_KEY = 'mb.nba.leaders.stat';

function readPref(key, allowed, fallback) {
  try {
    const value = localStorage.getItem(key);
    return allowed.includes(value) ? value : fallback;
  } catch (err) {
    return fallback;
  }
}

function savePref(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch (err) {
    /* private mode or blocked storage: the choice just won't persist */
  }
}

async function showLeaders() {
  stopPolling();
  const token = ++requestId;
  app.innerHTML = loadingHTML();
  let colors;
  let results;
  try {
    [colors, results] = await Promise.all([getTeamColors(), loadLeaderBoards()]);
  } catch (err) {
    if (token === requestId) showError(() => showLeaders());
    return;
  }
  if (token !== requestId) return;
  setTitle('NBA Leaders');

  const loaded = results.filter((r) => r.rows && r.rows.length);
  if (!loaded.length) {
    showError(() => showLeaders());
    return;
  }
  let view = readPref(LEADERS_VIEW_KEY, ['boards', 'sheet'], 'boards');
  let stat = readPref(LEADERS_STAT_KEY, loaded.map((r) => r.board.key), loaded[0].board.key);
  const seg = (cls, label, items, on) => '<div class="seg ' + cls + '" role="group" aria-label="' + esc(label) + '">' +
    items.map(([key, text]) => '<button type="button" data-v="' + esc(key) + '" aria-pressed="' + (key === on) + '">' + esc(text) + '</button>').join('') + '</div>';
  const sheetOf = (key) => leaderSheetHTML(loaded.find((r) => r.board.key === key), colors);

  app.innerHTML = '<div class="ld-bar"><h1>League leaders</h1>' + seg('ld-view', 'Leaders display', [['boards', 'Boards'], ['sheet', 'Stat sheet']], view) + '</div>' +
    '<div class="ld-pane" data-pane="boards"' + (view === 'boards' ? '' : ' hidden') + '>' + leaderBoardsHTML(results, colors) + '</div>' +
    '<div class="ld-pane" data-pane="sheet"' + (view === 'sheet' ? '' : ' hidden') + '>' +
    seg('ld-pick', 'Stat', loaded.map((r) => [r.board.key, SHEET_STATS[r.board.key].short]), stat) +
    '<div id="ldSheet">' + sheetOf(stat) + '</div></div>' + missingBoardsHTML(results);

  const press = (group, key) => group.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === key)));
  const viewSeg = app.querySelector('.ld-view');
  viewSeg.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-v]');
    if (!button) return;
    view = button.getAttribute('data-v');
    savePref(LEADERS_VIEW_KEY, view);
    press(viewSeg, view);
    app.querySelectorAll('.ld-pane').forEach((pane) => { pane.hidden = pane.getAttribute('data-pane') !== view; });
  });
  const pick = app.querySelector('.ld-pick');
  pick.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-v]');
    if (!button || button.getAttribute('data-v') === stat) return;
    stat = button.getAttribute('data-v');
    savePref(LEADERS_STAT_KEY, stat);
    press(pick, stat);
    document.getElementById('ldSheet').innerHTML = sheetOf(stat);
  });
}

    '<span>' + esc(player.name) + '</span>' +
    (player.teamAbbr ? '<span class="sr-team">' + esc(player.teamAbbr) + '</span>' : '') +
    '</li>';
}

async function searchPlayers(query, signal) {
  const response = await fetch(SEARCH_API + encodeURIComponent(query) + '&limit=10&type=player', { cache: 'no-store', signal });
  if (!response.ok) throw new Error('ESPN HTTP ' + response.status);
  return parseSearch(await response.json()).slice(0, 8);
}

function paintSearchMessage(message) {
  const list = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');
  if (!list || !input) return;
  searchResults = [];
  searchActive = -1;
  list.innerHTML = '<li class="sr-empty" role="presentation">' + esc(message) + '</li>';
  list.hidden = false;
  input.setAttribute('aria-expanded', 'true');
}

function paintSearchResults(items) {
  const list = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');
  if (!list || !input) return;
  searchResults = items;
  searchActive = items.length ? 0 : -1;
  list.innerHTML = items.length
    ? items.map((player) => searchOptionHTML(player, 'search-opt-')).join('')
    : '<li class="sr-empty" role="presentation">No NBA players found</li>';
  list.hidden = false;
  input.setAttribute('aria-expanded', 'true');
  highlightSearchResult();
}

function closeSearch() {
  if (searchTimer) {
    clearTimeout(searchTimer);
    searchTimer = 0;
  }
  if (searchAbort) {
    searchAbort.abort();
    searchAbort = null;
  }
  const list = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');
  const toggle = document.getElementById('searchToggle');
  const shell = document.getElementById('nbaSearch');
  if (list) {
    list.hidden = true;
    list.innerHTML = '';
  }
  if (input) input.setAttribute('aria-expanded', 'false');
  if (toggle) toggle.setAttribute('aria-expanded', 'false');
  if (shell) shell.classList.remove('open');
  searchResults = [];
  searchActive = -1;
}

function openPlayer(id) {
  if (!id) return;
  closeSearch();
  location.hash = '#player/' + id;
}

async function runSearch(query) {
  if (searchAbort) searchAbort.abort();
  searchAbort = new AbortController();
  const signal = searchAbort.signal;
  paintSearchMessage('Searching…');
  try {
    const players = await searchPlayers(query, signal);
    if (signal.aborted) return;
    paintSearchResults(players);
  } catch (err) {
    if (signal.aborted || (err && err.name === 'AbortError')) return;
    paintSearchResults([]);
  }
}

function initSearch() {
  const input = document.getElementById('searchInput');
  const toggle = document.getElementById('searchToggle');
  const list = document.getElementById('searchResults');
  const shell = document.getElementById('nbaSearch');
  if (!input || !toggle || !list || !shell) return;

  input.addEventListener('input', () => {
    if (searchTimer) clearTimeout(searchTimer);
    const query = input.value.trim();
    if (query.length < 2) {
      if (searchAbort) searchAbort.abort();
      closeSearch();
      return;
    }
    searchTimer = setTimeout(() => runSearch(query), 250);
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      closeSearch();
      return;
    }
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      if (!searchResults.length) return;
      event.preventDefault();
      const step = event.key === 'ArrowDown' ? 1 : -1;
      searchActive = (searchActive + step + searchResults.length) % searchResults.length;
      highlightSearchResult();
      return;
    }
    if (event.key === 'Enter' && searchResults.length) {
      event.preventDefault();
      const picked = searchResults[Math.max(0, searchActive)];
      if (picked) openPlayer(picked.id);
    }
  });

  list.addEventListener('click', (event) => {
    const option = event.target.closest('[data-id]');
    if (option) openPlayer(option.getAttribute('data-id'));
  });

  toggle.addEventListener('click', () => {
    const open = !shell.classList.contains('open');
    shell.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', String(open));
    if (open) input.focus();
    else closeSearch();
  });

  // Tapping anywhere outside the search closes it, so the brand and the sport
  // switch stay reachable while the phone overlay is open.
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('click', (event) => {
      if (shell.contains && shell.contains(event.target)) return;
      closeSearch();
    });
  }
}

function formatLogDate(iso) {
  const day = new Date(iso);
  if (Number.isNaN(day.getTime())) return '';
  return day.toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
}

function averagesHTML(overview) {
  if (!overview.labels.length) return '<div class="state">No averages for this player.</div>';
  const row = (title, values) => '<tr><td>' + esc(title) + '</td>' +
    overview.labels.map((label) => '<td>' + (values[label] == null ? '—' : esc(values[label])) + '</td>').join('') +
    '</tr>';
  return '<div class="table-wrap"><table class="log avg">' +
    '<caption class="sr-only">Season and career averages</caption><thead><tr><th class="sticky-col">Split</th>' +
    overview.labels.map((label) => '<th>' + esc(label) + '</th>').join('') +
    '</tr></thead><tbody>' + row('Season', overview.season) + row('Career', overview.career) +
    '</tbody></table></div>';
}

function seasonTableHTML(labels, games, colors) {
  const head = '<th class="sticky-col">Date</th><th>Opp</th><th>Result</th>' +
    labels.map((label) => '<th>' + esc(label) + '</th>').join('');
  const rows = games.map((game) => '<tr><td class="sticky-col">' + esc(formatLogDate(game.date)) + '</td>' +
    '<td class="opp"><i class="tm-sw" style="background:' + teamLook(colors, game.opponentAbbr, '', '').fill + '"></i>' + esc((game.atVs ? game.atVs + ' ' : '') + game.opponentAbbr) + '</td>' +
    '<td class="res">' + (game.result ? '<span class="tm-wl ' + esc(game.result) + '">' + esc(game.result) + '</span>' : '') + esc(game.score) + '</td>' +
    labels.map((label) => '<td>' + (game.stats[label] == null ? '—' : esc(game.stats[label])) + '</td>').join('') +
    '</tr>').join('');
  return '<div class="table-wrap"><table class="log pl-log">' +
    '<caption class="sr-only">Game log</caption><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function gameLogHTML(log, colors) {
  if (!log.seasons.length) return '<div class="state">No games logged this season.</div>';
  const found = log.seasons.findIndex((season) => /regular season/i.test(season.name));
  const active = found >= 0 ? found : 0;
  const tabs = log.seasons.map((season, index) =>
    '<button class="tab" type="button" role="tab" data-season="' + index + '" aria-selected="' + (index === active) + '">' + esc(season.name) + '</button>').join('');
  const panels = log.seasons.map((season, index) =>
    '<section data-season-panel="' + index + '"' + (index === active ? '' : ' hidden') + '>' +
    (season.games.length ? seasonTableHTML(log.labels, season.games, colors) : '<div class="state">No games</div>') +
    '</section>').join('');
  return '<div class="tabs-row" role="tablist">' + tabs + '</div>' + panels;
}

function wireSeasonTabs() {
  const tabs = app.querySelectorAll('.tabs-row .tab[data-season]');
  tabs.forEach((tab) => tab.addEventListener('click', () => {
    tabs.forEach((other) => other.setAttribute('aria-selected', String(other === tab)));
    app.querySelectorAll('section[data-season-panel]').forEach((panel) => {
      panel.hidden = panel.getAttribute('data-season-panel') !== tab.getAttribute('data-season');
    });
  }));
}
